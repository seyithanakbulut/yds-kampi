{id:'present',grp:'yds',t:'Geniş, Şimdiki ve Present Perfect Zamanlar',en:'Present Tenses',s:'Simple Present, Present Continuous, Present Perfect (Continuous) ve ipuçları',body:`
<p>YDS'de en çok soru gelen zaman <b>Present Perfect</b>'tir. Ama onu doğru kullanmak için önce dört "present" zamanının farkını oturtmak gerekir.</p>

<h3>1. Simple Present (Geniş Zaman)</h3>
<p><b>Yapı:</b> V1 (he/she/it → V1+s) · Olumsuz: don't/doesn't + V1 · Soru: Do/Does + özne + V1?</p>
<p><b>Kullanım:</b></p>
<ul><li>Bilimsel gerçekler, genel doğrular → akademik metinlerin ana zamanı</li>
<li>Alışkanlıklar, tekrarlanan olaylar</li>
<li>Programlı gelecek (tren saatleri, takvim)</li></ul>
${EX('Water <u>boils</u> at 100°C. / The heart <u>pumps</u> blood around the body.','Su 100°C\'de kaynar. / Kalp kanı vücuda pompalar.')}
<p><b>İpuçları:</b> always, usually, often, sometimes, rarely, never, every day/year, generally, in general</p>

<h3>2. Present Continuous (Şimdiki Zaman)</h3>
<p><b>Yapı:</b> am / is / are + V-ing</p>
<ul><li>Şu anda olan eylem: <i>The students <u>are taking</u> an exam now.</i></li>
<li>Bu dönemlerde süren, geçici durum: <i>More people <u>are working</u> from home these days.</i></li>
<li>Değişen, gelişen durum (akademikte çok sık): <i>The world population <u>is growing</u> rapidly.</i></li>
<li>Planlanmış yakın gelecek: <i>We <u>are meeting</u> the minister tomorrow.</i></li></ul>
<p><b>İpuçları:</b> now, at the moment, currently, at present, these days, nowadays, increasingly</p>
${TRAP('Durum fiilleri (know, believe, contain, belong, consist, depend, mean, seem, need, exist) bu zamanda kullanılmaz: <i>The report <u>contains</u> errors</i> (is containing değil).')}

<h3>3. Present Perfect (Yakın Geçmiş / Geçmişten Bugüne)</h3>
<p><b>Yapı:</b> have / has + V3 · Olumsuz: haven't / hasn't + V3</p>
<p>Türkçede tam karşılığı yoktur; bazen "-dı", bazen "-mış", bazen "-dır / -maktadır" diye çevrilir. Temel fikir: <b>Geçmişte başlayan ya da olan bir şey bugünle bağlantılı.</b></p>
<table class="t"><tr><th>Kullanım</th><th>Örnek</th><th>Türkçesi</th></tr>
<tr><td>Geçmişte başlayıp hâlâ süren</td><td>She <u>has lived</u> here <u>since</u> 2010.</td><td>2010'dan beri burada yaşıyor.</td></tr>
<tr><td>Zamanı belli olmayan geçmiş deneyim</td><td>I <u>have</u> never <u>seen</u> such a storm.</td><td>Hiç böyle bir fırtına görmedim.</td></tr>
<tr><td>Sonucu şu an önemli olan olay</td><td>Scientists <u>have found</u> a cure.</td><td>Bilim insanları bir tedavi buldu (ve şu an elimizde).</td></tr>
<tr><td>Bir süreç boyunca olan değişim</td><td>Temperatures <u>have risen</u> <u>over the past century</u>.</td><td>Son yüzyıl boyunca sıcaklıklar arttı.</td></tr></table>
<p><b>Mutlaka Present Perfect isteyen ipuçları:</b></p>
<table class="t"><tr><th>İpucu</th><th>Anlam</th></tr>
<tr><td><b>since</b> + başlangıç noktası (since 2010, since the war, since he was born)</td><td>-den beri</td></tr>
<tr><td><b>for</b> + süre (for ten years) — bugüne uzanıyorsa</td><td>-dır</td></tr>
<tr><td><b>so far, up to now, until now, to date, thus far</b></td><td>şimdiye kadar</td></tr>
<tr><td><b>over / in / during the past/last + süre</b> (over the past decade)</td><td>son … boyunca</td></tr>
<tr><td><b>recently, lately</b></td><td>son zamanlarda</td></tr>
<tr><td><b>already, yet, just, ever, never</b></td><td>zaten, henüz, az önce, hiç</td></tr>
<tr><td><b>It is the first/second time</b> …</td><td>ilk kez …</td></tr>
<tr><td><b>superlative + ever</b>: the best film I <u>have ever seen</u></td><td>gördüğüm en iyi</td></tr></table>
${TRAP('Belirli bir geçmiş zaman ifadesi (<b>ago, in 1990, last year, yesterday, when I was young</b>) varsa Present Perfect <b>kullanılamaz</b>, Simple Past gelir: <i>The war <u>ended</u> in 1945</i> (has ended değil).')}

<h3>4. Present Perfect Continuous</h3>
<p><b>Yapı:</b> have / has been + V-ing</p>
<p>Geçmişte başlayıp hâlâ süren ve <b>süresi vurgulanan</b> eylem.</p>
${EX('Researchers <u>have been studying</u> the virus <u>for</u> three years.','Araştırmacılar üç yıldır virüsü inceliyor.')}
<p>Present Perfect ile farkı: Perfect <b>sonucu</b> (ne kadar yapıldı), Perfect Continuous <b>süreci</b> (ne kadar süredir yapılıyor) vurgular. YDS'de çoğu zaman ikisi de kabul edilir; şıklarda biri varsa ötekini ara.</p>

<h3>5. since cümlesinde zaman uyumu</h3>
<p>"since" bir cümle bağlıyorsa: <b>ana cümle Present Perfect + since + Simple Past</b></p>
${EX('Life expectancy <u>has increased</u> considerably since antibiotics <u>were discovered</u>.','Antibiyotikler keşfedildiğinden beri ortalama yaşam süresi önemli ölçüde arttı.')}

<h3>6. Özet karar tablosu</h3>
<table class="t"><tr><th>Cümlede ne görüyorsun?</th><th>Zaman</th></tr>
<tr><td>Genel gerçek, bilimsel bilgi, alışkanlık</td><td>Simple Present</td></tr>
<tr><td>now, currently, these days, değişen eğilim</td><td>Present Continuous</td></tr>
<tr><td>since, for, so far, over the past…, recently, yet</td><td>Present Perfect (Continuous)</td></tr>
<tr><td>ago, last…, in + geçmiş yıl</td><td>Simple Past (sonraki konu)</td></tr></table>`,
qs:[
QW('Over the past two decades, the number of people using smartphones ---- dramatically.',['increases','increased','has increased','had increased','is increasing'],'C','"Over the past two decades" (son yirmi yıl boyunca) geçmişten bugüne uzanan bir süreç bildirir → Present Perfect: has increased.',['Simple Present genel gerçek bildirir; süre ifadesiyle uyuşmaz.','Simple Past belirli, bitmiş bir geçmiş ister; "over the past" bugüne kadar uzanır.',null,'Past Perfect geçmişte başka bir olaydan önceyi anlatır; ikinci bir geçmiş olay yok.','Present Continuous "şu an artıyor" der; "over the past two decades" ile perfect gerekir.']),
QW('Light ---- faster than sound, which is why we see lightning before we hear thunder.',['travels','is travelling','has travelled','travelled','had travelled'],'A','Bilimsel ve her zaman geçerli bir gerçek → Simple Present: travels.',[null,'Sürekli zaman geçici durumlar içindir; ışığın hızı kalıcı bir gerçek.','Present Perfect bir süreç ya da deneyim bildirir; genel gerçek için kullanılmaz.','Geçmiş zaman gerçeği bugün geçersizmiş gibi gösterir.','Past Perfect bu cümlede anlamsız.']),
QW('Scientists ---- the effects of the new drug since 2019, but they ---- any serious side effects so far.',['studied / didn\'t find','have been studying / haven\'t found','are studying / don\'t find','had studied / hadn\'t found','study / haven\'t found'],'B','"since 2019" → Present Perfect (Continuous); "so far" → Present Perfect. İkisini birden doğru veren B.',['since ve so far Simple Past ile kullanılmaz.',null,'since ve so far şimdiki zamanla kullanılmaz.','Past Perfect için geçmişte bir referans noktası gerekir; burada bugüne bağlanıyor.','"study" since ile kullanılmaz.']),
QW('Since the new metro line ----, traffic in the city centre has decreased considerably.',['has opened','opens','opened','had opened','is opening'],'C','"since" cümle bağlıyor: ana cümle Present Perfect (has decreased) → since kısmı Simple Past: opened.',['since cümlesinde başlangıç noktası Simple Past olur.','Geniş zaman bitmiş başlangıç noktası bildirmez.',null,'Past Perfect gereksiz; tek geçmiş olay var.','Present Continuous başlangıç noktası olamaz.']),
QW('These days, more and more young people ---- to live alone rather than with their families.',['have chosen','chose','are choosing','had chosen','were choosing'],'C','"These days" ve "more and more" süren, değişen bir eğilim bildirir → Present Continuous: are choosing.',['Present Perfect mümkün gibi görünse de "these days + more and more" yapısı sürmekte olan eğilim için Present Continuous ister.','Simple Past bitmiş geçmiş anlatır; "these days" bugünü anlatıyor.',null,'Past Perfect geçmişte bir noktayı gerektirir.','Past Continuous geçmişte süren eylem; "these days" ile çelişir.']),
QW('The museum ---- over two million visitors since it opened in 2015.',['attracts','attracted','has attracted','is attracting','had attracted'],'C','"since it opened" → ana cümle Present Perfect: has attracted.',['Geniş zaman since ile kullanılmaz.','Simple Past since ile ana cümlede kullanılmaz.',null,'Şimdiki zaman since ile kullanılmaz.','Past Perfect için geçmişte bir bitiş noktası gerekir; burada bugüne kadar.'])]},

{id:'past',grp:'yds',t:'Geçmiş Zamanlar',en:'Past Tenses',s:'Simple Past, Past Continuous, Past Perfect, used to, would',body:`
<h3>1. Simple Past (-di'li geçmiş)</h3>
<p><b>Yapı:</b> V2 · Olumsuz: didn't + V1 · Soru: Did + özne + V1?</p>
<p>Geçmişte <b>belli bir zamanda</b> başlayıp bitmiş eylemler.</p>
${EX('The Ottoman Empire <u>collapsed</u> after the First World War.','Osmanlı İmparatorluğu Birinci Dünya Savaşı\'ndan sonra çöktü.')}
<p><b>İpuçları:</b> ago, yesterday, last week/year/century, in 1923, in the 1990s, when I was a child, at that time, then, during the war</p>

<h3>2. Past Continuous (-yordu)</h3>
<p><b>Yapı:</b> was / were + V-ing</p>
<ul><li>Geçmişte belli bir anda süren eylem: <i>At 8 pm, we <u>were watching</u> TV.</i></li>
<li>Uzun eylem kısa bir eylemle kesilirse: <b>Past Continuous (uzun) + when + Simple Past (kısa)</b></li></ul>
${EX('While the scientists <u>were working</u> in the lab, a fire <u>broke out</u>.','Bilim insanları laboratuvarda çalışırken bir yangın çıktı.')}
${TIP('<b>while</b> genelde sürekli eylemin, <b>when</b> genelde ani eylemin başına gelir.')}

<h3>3. Past Perfect (-mıştı)</h3>
<p><b>Yapı:</b> had + V3</p>
<p>Geçmişteki iki olaydan <b>önce olanı</b> anlatır. "Geçmişin geçmişi."</p>
<table class="t"><tr><th>Kalıp</th><th>Örnek</th><th>Türkçesi</th></tr>
<tr><td><b>By the time</b> + Simple Past, Past Perfect</td><td>By the time the doctor <u>arrived</u>, the patient <u>had died</u>.</td><td>Doktor geldiğinde hasta ölmüştü.</td></tr>
<tr><td><b>before</b> + Simple Past, Past Perfect</td><td>Before he <u>became</u> a writer, he <u>had worked</u> as a doctor.</td><td>Yazar olmadan önce doktor olarak çalışmıştı.</td></tr>
<tr><td><b>after</b> + Past Perfect, Simple Past</td><td>After they <u>had finished</u>, they <u>left</u>.</td><td>Bitirdikten sonra ayrıldılar.</td></tr>
<tr><td><b>when</b> + Simple Past, Past Perfect</td><td>When we <u>got</u> there, the shop <u>had closed</u>.</td><td>Oraya vardığımızda dükkân kapanmıştı.</td></tr>
<tr><td><b>until / till</b> + Simple Past</td><td>He <u>had</u> never <u>seen</u> the sea until he <u>moved</u> to Izmir.</td><td>İzmir'e taşınana kadar denizi hiç görmemişti.</td></tr>
<tr><td><b>No sooner had … than / Hardly had … when</b></td><td>No sooner <u>had</u> the film <u>started</u> than the lights <u>went</u> out.</td><td>Film başlar başlamaz ışıklar söndü.</td></tr></table>
${TRAP('<b>by the time</b> + geçmiş → Past Perfect; <b>by the time</b> + geniş zaman → Future Perfect (gelecek konusu). Cümlenin zamanına bak.')}

<h3>4. Past Perfect Continuous (-mekteydi, -dır …yordu)</h3>
<p><b>Yapı:</b> had been + V-ing — Geçmişteki bir noktaya kadar <b>süregelen</b> eylem.</p>
${EX('She <u>had been waiting</u> for two hours when the bus finally arrived.','Otobüs sonunda geldiğinde iki saattir bekliyordu.')}

<h3>5. used to / would / be used to</h3>
<table class="t"><tr><th>Yapı</th><th>Anlam</th><th>Örnek</th></tr>
<tr><td><b>used to</b> + V1</td><td>Eskiden …-ırdı (artık değil)</td><td>People <u>used to travel</u> by horse.</td></tr>
<tr><td><b>would</b> + V1</td><td>Eskiden …-ırdı (tekrarlanan eylem, durum için değil)</td><td>Every summer we <u>would visit</u> our grandparents.</td></tr>
<tr><td><b>be used to</b> + V-ing / isim</td><td>-e alışkın olmak</td><td>Farmers <u>are used to working</u> long hours.</td></tr>
<tr><td><b>get used to</b> + V-ing / isim</td><td>-e alışmak</td><td>You will soon <u>get used to living</u> here.</td></tr>
<tr><td><b>be used to</b> + V1 (edilgen)</td><td>… için kullanılmak</td><td>This tool <u>is used to cut</u> metal.</td></tr></table>
${TRAP('"used to" sonrasında <b>yalın fiil</b>, "be/get used to" sonrasında <b>-ing</b> gelir. Üçüncü anlam ("… için kullanılmak") edilgen yapıdır.')}

<h3>6. Present Perfect mi Simple Past mi?</h3>
<table class="t"><tr><th>Simple Past</th><th>Present Perfect</th></tr>
<tr><td>Belirli geçmiş zaman: <i>in 2005, ago, last year</i></td><td>Belirsiz zaman ya da bugüne uzanan: <i>since, for, so far, recently</i></td></tr>
<tr><td>Bitmiş dönem: <i>Shakespeare <u>wrote</u> 37 plays.</i> (artık yazamaz)</td><td>Süren dönem: <i>She <u>has written</u> five books.</i> (hâlâ yazabilir)</td></tr></table>`,

QW('People in rural areas ---- water from wells, but now most homes have running water.',['are used to getting','used to get','are used to get','get used to','were used to getting'],'B','"Eskiden … alırlardı, ama artık …" → used to + V1: used to get.',['"are used to getting" bugünkü alışkanlık bildirir (alışkınlar); but now ile çelişir.',null,'"be used to" sonrası -ing gelir; "get" yanlış.','"get used to" alışmak demektir ve yapı eksik.','"were used to getting" (alışkındılar) mümkün ama anlamca "eskiden yaparlardı" vurgusu used to ile verilir; ayrıca gramer olarak B en doğrusu.']),
QW('No sooner ---- the speech than the audience began to applaud.',['the president finished','had the president finished','did the president finish','the president had finished','has the president finished'],'B','"No sooner … than" kalıbı devrik yapı ister ve Past Perfect ile kullanılır: No sooner had + özne + V3 … than.',['Devrik yapı gerekir.',null,'"No sooner" kalıbı Past Perfect ister; "did" yapısı standart değildir.','Devrik yapı gerekli; özne yardımcı fiilden sonra gelmeli.','Present Perfect geçmiş bağlamla uyuşmaz.']),
QW('The first modern Olympic Games ---- in Athens in 1896.',['have been held','were held','had held','have held','are held'],'B','"in 1896" belirli geçmiş zaman → Simple Past; oyunlar düzenlendi (edilgen) → were held.',['Belirli geçmiş zamanla Present Perfect kullanılmaz.',null,'Etken ve Past Perfect; anlam ve zaman yanlış.','Present Perfect + etken; iki hata.','Geniş zaman edilgen; 1896 geçmişte.'])]},

{id:'future',grp:'yds',t:'Gelecek Zamanlar ve Zaman Uyumu',en:'Future Tenses & Time Clauses',s:'will, be going to, Future Continuous / Perfect, zaman cümleciklerinde gelecek',body:`
<h3>1. will + V1</h3>
<ul><li>Tahmin (özellikle kanıta dayanmayan): <i>Robots <u>will</u> probably <u>replace</u> many workers.</i></li>
<li>Anlık karar, söz, teklif: <i>I <u>will help</u> you.</i></li>
<li>Kesin gelecek gerçekleri: <i>The sun <u>will rise</u> at 6:30 tomorrow.</i></li></ul>

<h3>2. be going to + V1</h3>
<ul><li>Önceden verilmiş karar, plan: <i>The government <u>is going to build</u> a new airport.</i></li>
<li>Şu anki kanıta dayalı tahmin: <i>Look at those clouds. It <u>is going to rain</u>.</i></li></ul>

<h3>3. Future Continuous: will be + V-ing</h3>
<p>Gelecekte belli bir anda <b>süre</b>cek eylem.</p>
${EX('This time next year, I <u>will be studying</u> at university.','Gelecek yıl bu zamanlar üniversitede okuyor olacağım.')}

<h3>4. Future Perfect: will have + V3</h3>
<p>Gelecekte belli bir zamana kadar <b>tamamlanmış</b> olacak eylem. YDS'de en çok bu çıkar.</p>
${EX('<u>By 2050</u>, the world population <u>will have reached</u> nearly ten billion.','2050\'ye kadar dünya nüfusu neredeyse on milyara ulaşmış olacak.')}
<p><b>İpuçları:</b> by + gelecek zaman (by 2030, by the end of the year, by next month), <b>by the time</b> + Simple Present</p>
${EX('<u>By the time</u> you <u>graduate</u>, technology <u>will have changed</u> completely.','Sen mezun olduğunda teknoloji tamamen değişmiş olacak.')}

<h3>5. Future Perfect Continuous: will have been + V-ing</h3>
${EX('By June, she <u>will have been working</u> here for ten years.','Haziran\'da burada on yıldır çalışıyor olacak.')}

<h3>6. ÇOK ÖNEMLİ: Zaman cümleciklerinde "will" kullanılmaz</h3>
<p><b>when, before, after, as soon as, until, by the time, once, while</b> ve koşul bildiren <b>if, unless, as long as, provided that</b> ile başlayan yan cümlelerde gelecek anlamı <b>geniş zaman (Simple Present)</b> ya da <b>Present Perfect</b> ile verilir.</p>
<table class="t"><tr><th>Yanlış</th><th>Doğru</th></tr>
<tr><td>When the new law <s>will come</s> into force, …</td><td>When the new law <u>comes</u> into force, prices will fall.</td></tr>
<tr><td>As soon as I <s>will finish</s>, I will call you.</td><td>As soon as I <u>finish</u> / <u>have finished</u>, I will call you.</td></tr></table>
${TRAP('Şıklarda "when … will" görürsen elemekte tereddüt etme. Ana cümle gelecek zaman, yan cümle geniş zaman olur.')}

<h3>7. Diğer gelecek kalıpları</h3>
<table class="t"><tr><th>Yapı</th><th>Anlam</th><th>Örnek</th></tr>
<tr><td><b>be about to</b> + V1</td><td>tam … üzere</td><td>The train <u>is about to leave</u>.</td></tr>
<tr><td><b>be due to</b> + V1</td><td>… -mesi bekleniyor (programlı)</td><td>The report <u>is due to be</u> published in May.</td></tr>
<tr><td><b>be expected to</b> + V1</td><td>-mesi bekleniyor</td><td>Prices <u>are expected to rise</u>.</td></tr>
<tr><td><b>be likely to</b> + V1</td><td>muhtemelen …</td><td>It <u>is likely to rain</u>.</td></tr>
<tr><td><b>be bound to</b> + V1</td><td>kesin …</td><td>Problems <u>are bound to arise</u>.</td></tr>
<tr><td><b>be on the verge of</b> + isim/-ing</td><td>-in eşiğinde</td><td>The species <u>is on the verge of extinction</u>.</td></tr></table>

<h3>8. Geçmişte gelecek: was going to / would</h3>
${EX('Scientists predicted that the virus <u>would spread</u> quickly.','Bilim insanları virüsün hızla yayılacağını tahmin etti.')}
${EX('I <u>was going to call</u> you, but I forgot.','Seni arayacaktım ama unuttum.')}`,
qs:[
QW('By the end of this century, sea levels ---- by at least half a metre, according to many scientists.',['rise','will have risen','had risen','have risen','are rising'],'B','"By the end of this century" gelecekte bir noktaya kadar tamamlanmış olacak olayı bildirir → Future Perfect: will have risen.',['Geniş zaman "by + gelecek" ile uyuşmaz.',null,'Past Perfect geçmiş içindir.','Present Perfect bugüne kadar olanı anlatır, gelecek noktası değil.','Present Continuous şu anki süreci anlatır; "by the end of this century" Future Perfect ister.']),
QW('As soon as the results ----, the researchers will share them with the public.',['will be available','are available','would be available','were available','had been available'],'B','"As soon as" zaman cümleciğinde will kullanılmaz; ana cümle gelecek (will share) → yan cümle Simple Present: are available.',['Zaman cümleciğinde will kullanılmaz.',null,'"would" geçmişte gelecek ya da koşul bildirir, zaman uyumu bozulur.','Geçmiş zaman gelecek anlamlı ana cümleyle uyuşmaz.','Past Perfect gelecek bağlamda kullanılmaz.']),
QW('By the time you ---- this letter, I ---- the country.',['will read / left','read / will have left','are reading / have left','will have read / leave','read / had left'],'B','"By the time + Simple Present" → ana cümle Future Perfect: read / will have left.',['Zaman cümleciğinde will olmaz; "left" de geçmiş.',null,'Present Perfect gelecek noktasıyla uyuşmaz.','Zaman cümleciğinde will olmaz.','Past Perfect gelecek bağlamda kullanılmaz.']),
QW('This time tomorrow, the astronauts ---- towards the International Space Station.',['will travel','will be travelling','will have travelled','travel','have travelled'],'B','"This time tomorrow" gelecekte belli bir anda süren eylem → Future Continuous: will be travelling.',['"will travel" belli bir anda süreci vurgulamaz.',null,'Future Perfect tamamlanmışlık bildirir; yolculuk o anda sürüyor.','Geniş zaman bu ipucuyla kullanılmaz.','Present Perfect gelecek ipucuyla uyuşmaz.']),
QW('The new hospital ---- to open next spring, but construction delays may change the date.',['is due','will due','was due','has due','dues'],'A','"be due to + V1" = -mesi planlanıyor/bekleniyor. Gelecek planı bugün geçerli → is due.',[null,'"will due" diye bir yapı yok; due sıfattır, "be" ister.','"was due" geçmişteki bir plan için kullanılır; next spring bugünkü planı anlatıyor.','"has due" yanlış yapı.','"dues" isimdir (aidat), fiil değil.']),
QW('In 1990, few experts predicted that the Internet ---- so many aspects of daily life.',['will change','would change','has changed','changes','is going to change'],'B','Geçmişte yapılmış bir tahmin içinde gelecek: "would" (geçmişte gelecek) → would change.',['"predicted" geçmişte olduğu için zaman kaydırılır, will → would.',null,'Present Perfect ana cümlenin geçmiş bağlamıyla uyuşmaz.','Geniş zaman tahmin edilen geleceği vermez.','"is going to" bugünkü planı/tahmini anlatır; geçmiş bağlamla uyuşmaz.'])]}
];

{id:'modals',grp:'yds',t:'Kipler',en:'Modal Verbs',s:'can, may, must, should, need; geçmiş tahmin ve pişmanlık yapıları',body:`
<p>Kipler (modal verbs) fiile <b>yetenek, izin, olasılık, zorunluluk, tavsiye</b> anlamı katar. Hepsinden sonra <b>yalın fiil</b> gelir ve -s almazlar: <i>She can swim</i> (cans değil, can swims değil).</p>

<h3>1. Kiplerin temel anlamları</h3>
<table class="t"><tr><th>Anlam</th><th>Şimdi / Gelecek</th><th>Geçmiş</th></tr>
<tr><td><b>Yetenek</b></td><td>can, be able to</td><td>could, was able to (bir kez başarmak: was able to / managed to)</td></tr>
<tr><td><b>İzin</b></td><td>can, may, could</td><td>was allowed to</td></tr>
<tr><td><b>Olasılık</b> (zayıf → güçlü)</td><td>might &lt; may / could &lt; should &lt; must</td><td>might / may / could have V3, must have V3</td></tr>
<tr><td><b>İmkânsızlık</b></td><td>can't, couldn't</td><td>can't / couldn't have V3</td></tr>
<tr><td><b>Zorunluluk</b></td><td>must (içten), have to (dıştan), need to</td><td>had to</td></tr>
<tr><td><b>Yasak</b></td><td>mustn't, can't, be not allowed to</td><td>wasn't allowed to</td></tr>
<tr><td><b>Gereksizlik</b></td><td>don't have to, needn't, don't need to</td><td>didn't have to / didn't need to; needn't have V3</td></tr>
<tr><td><b>Tavsiye</b></td><td>should, ought to, had better</td><td>should have V3 (pişmanlık / eleştiri)</td></tr></table>

<h3>2. Geçmişe yönelik kipler (modal + have + V3) — YDS'nin favorisi</h3>
<table class="t"><tr><th>Yapı</th><th>Anlam</th><th>Örnek</th><th>Türkçesi</th></tr>
<tr><td><b>must have V3</b></td><td>-miş olmalı (güçlü tahmin)</td><td>The ground is wet. It <u>must have rained</u>.</td><td>Yer ıslak, yağmur yağmış olmalı.</td></tr>
<tr><td><b>can't / couldn't have V3</b></td><td>-miş olamaz</td><td>He <u>can't have written</u> this; he can't speak English.</td><td>Bunu o yazmış olamaz.</td></tr>
<tr><td><b>may / might / could have V3</b></td><td>-miş olabilir</td><td>The letter <u>may have been lost</u> in the post.</td><td>Mektup postada kaybolmuş olabilir.</td></tr>
<tr><td><b>should / ought to have V3</b></td><td>-meliydi (ama yapmadı)</td><td>You <u>should have told</u> me.</td><td>Bana söylemeliydin.</td></tr>
<tr><td><b>shouldn't have V3</b></td><td>-memeliydi (ama yaptı)</td><td>He <u>shouldn't have driven</u> so fast.</td><td>O kadar hızlı sürmemeliydi.</td></tr>
<tr><td><b>could have V3</b></td><td>-ebilirdi (ama yapmadı)</td><td>The accident <u>could have been avoided</u>.</td><td>Kaza önlenebilirdi.</td></tr>
<tr><td><b>needn't have V3</b></td><td>gerek yoktu ama yaptı</td><td>You <u>needn't have cooked</u>; we had already eaten.</td><td>Yemek yapmana gerek yoktu.</td></tr>
<tr><td><b>would have V3</b></td><td>-ırdı (koşul sonucu)</td><td>I <u>would have helped</u> if you had asked.</td><td>Sorsaydın yardım ederdim.</td></tr></table>
${TRAP('<b>didn\'t need to</b> = gerek yoktu (büyük ihtimalle yapmadı). <b>needn\'t have V3</b> = gerek yoktu ama yaptı. Şıklarda ikisi birlikte varsa cümlenin devamına bak.')}

<h3>3. must / have to farkı ve olumsuzları</h3>
<table class="t"><tr><th>Olumlu</th><th>Olumsuz</th></tr>
<tr><td><b>must</b> = zorundasın (konuşanın kararı)</td><td><b>mustn't</b> = yapmamalısın, yasak</td></tr>
<tr><td><b>have to</b> = zorundasın (kural, dış etken)</td><td><b>don't have to</b> = zorunda değilsin, ister yap ister yapma</td></tr></table>
${EX('You <u>mustn\'t</u> smoke here. ≠ You <u>don\'t have to</u> come.','Burada sigara içmemelisin (yasak). ≠ Gelmek zorunda değilsin.')}

<h3>4. could / was able to</h3>
<p>Geçmişte <b>genel yetenek</b> için could; <b>tek bir olayda başarmak</b> için was able to / managed to:</p>
${EX('She <u>could</u> swim when she was five. / The pilot <u>was able to</u> land the plane safely.','Beş yaşında yüzebiliyordu. / Pilot uçağı güvenle indirmeyi başardı.')}

<h3>5. Diğer kalıplar</h3>
<table class="t"><tr><th>Yapı</th><th>Anlam</th><th>Örnek</th></tr>
<tr><td><b>had better</b> + V1</td><td>-se iyi olur (uyarı)</td><td>You <u>had better</u> leave now.</td></tr>
<tr><td><b>would rather</b> + V1 (than)</td><td>tercih ederim</td><td>I <u>would rather</u> walk <u>than</u> wait.</td></tr>
<tr><td><b>would rather</b> + özne + V2</td><td>başkasının yapmasını tercih</td><td>I'd rather you <u>stayed</u>.</td></tr>
<tr><td><b>may/might as well</b> + V1</td><td>… da yapabiliriz (daha iyisi yok)</td><td>We <u>might as well</u> go home.</td></tr>
<tr><td><b>be supposed to</b> + V1</td><td>-mesi gerekiyor (beklenti)</td><td>You <u>are supposed to</u> wear a uniform.</td></tr>
<tr><td><b>can't help</b> + V-ing</td><td>-meden edememek</td><td>I <u>can't help laughing</u>.</td></tr>
<tr><td><b>cannot … too</b></td><td>ne kadar … -se azdır</td><td>You <u>cannot be too</u> careful.</td></tr></table>

<h3>6. Edilgen kipler</h3>
<p><b>modal + be + V3</b> (şimdi/gelecek), <b>modal + have been + V3</b> (geçmiş)</p>
${EX('The problem <u>must be solved</u> quickly. / The bridge <u>should have been repaired</u> years ago.','Sorun hızla çözülmeli. / Köprü yıllar önce onarılmalıydı.')}

<h3>7. Çözüm yöntemi</h3>
<ol><li>Cümle <b>geçmişten mi</b> bahsediyor? (yesterday, last year, then) → modal + have V3</li>
<li>Bir <b>tahmin</b> mi, <b>pişmanlık</b> mı, <b>gereksizlik</b> mi? İkinci cümle/virgülden sonrası ipucu verir.</li>
<li>Tahminse kanıtın gücüne bak: kesin kanıt → must have; "olamaz" → can't have; belirsiz → may/might have.</li></ol>`,
qs:[
QW('The streets are completely wet this morning; it ---- heavily during the night.',['must have rained','should rain','can rain','needn\'t have rained','had better rain'],'A','Kanıta (sokaklar ıslak) dayanan güçlü geçmiş tahmin → must have rained (yağmış olmalı).',[null,'"should rain" gelecek/tavsiye bildirir; olay geçmişte.','"can rain" genel olasılık; geçmiş tahmin değil.','"gerek yoktu ama yağdı" anlamsız.','"had better" uyarıdır, tahmin değil.']),
QW('You ---- the report so early; the deadline has been extended to next month.',['mustn\'t finish','needn\'t have finished','can\'t have finished','should finish','must have finished'],'B','Rapor erken bitirilmiş ama süre uzatıldığı için gerek yokmuş → needn\'t have finished.',['mustn\'t yasak bildirir ve şimdiki zamandır.',null,'"bitirmiş olamazsın" anlamı ikinci cümleyle bağlanmıyor.','"should finish" tavsiye ve gelecek; geçmişte yapılmış bir şeyden bahsediliyor.','"bitirmiş olmalısın" tahmini süre uzatılması bilgisiyle anlamsız.']),
QW('The ancient Egyptians ---- such huge pyramids without a good knowledge of mathematics.',['can\'t have built','should have built','needn\'t have built','must build','ought to have built'],'A','"İyi bir matematik bilgisi olmadan bu piramitleri yapmış olamazlar" → can\'t have built.',[null,'"yapmalıydılar" eleştiri bildirir; anlamsız.','"yapmalarına gerek yoktu" anlamsız.','"must build" şimdiki zorunluluk; geçmiş anlatılıyor.','"yapmalıydılar" yine eleştiri.']),
QW('The accident ---- if the driver had paid more attention to the road.',['could have been avoided','must have avoided','can be avoided','should avoid','might avoid'],'A','Geçmiş koşul (if … had paid) → sonuç modal + have been V3; kaza önlenebilirdi (edilgen) → could have been avoided.',[null,'Etken ve "kesin tahmin" anlamı; koşulla uyuşmaz.','Şimdiki zaman; koşul geçmiş.','Şimdiki tavsiye; zaman uyumsuz.','Şimdiki olasılık; geçmiş koşulla uyuşmaz.']),
QW('Visitors ---- touch the paintings, but they are allowed to take photographs.',['don\'t have to','mustn\'t','needn\'t','might not','couldn\'t'],'B','"Ama fotoğraf çekmelerine izin var" zıtlığı, ilk kısmın yasak olduğunu gösterir → mustn\'t (dokunmamalılar).',['"zorunda değiller" demek olur; yasak değil, zıtlık kurulmaz.',null,'"gerek yok" demek; yasak anlamı yok.','"dokunmayabilirler" olasılık bildirir.','"couldn\'t" geçmiş yetenek; cümle şimdiki zamanda.']),
QW('The patient\'s condition worsened because he ---- his medication regularly, but he often forgot.',['must have taken','should have taken','can\'t have taken','needn\'t have taken','might take'],'B','İlacı düzenli almalıydı ama sık sık unuttu → should have taken (yapılmamış bir şey için eleştiri).',['"almış olmalı" tahmini "often forgot" ile çelişir.',null,'"almış olamaz" anlam olarak yakın görünse de "but he often forgot" eleştiri yapısını (should have) ister.','"gerek yoktu" anlamsız.','"might take" şimdiki/gelecek olasılık.'])]},

{id:'passive',grp:'yds',t:'Edilgen Yapı',en:'Passive Voice',s:'be + V3 her zamanda, geçişsiz fiil tuzağı, "is said to have", causative',body:`
<p>Akademik metinlerde işi <b>kimin yaptığından çok işin kendisi</b> önemlidir. Bu yüzden YDS'de edilgen yapı her bölümde karşına çıkar.</p>

<h3>1. Etkenden edilgene</h3>
${EX('<b>Etken:</b> Scientists <u>discovered</u> the virus in 2019.<br><b>Edilgen:</b> The virus <u>was discovered</u> (by scientists) in 2019.','Virüs 2019\'da (bilim insanları tarafından) keşfedildi.')}
<p>Nesne başa geçer, fiil <b>be + V3</b> olur, eski özne gerekiyorsa <b>by</b> ile sona eklenir.</p>

<h3>2. Bütün zamanlarda edilgen</h3>
<table class="t"><tr><th>Zaman</th><th>Etken</th><th>Edilgen</th><th>Türkçesi</th></tr>
<tr><td>Simple Present</td><td>make(s)</td><td>is / are made</td><td>yapılır</td></tr>
<tr><td>Present Continuous</td><td>is making</td><td>is / are <b>being</b> made</td><td>yapılıyor</td></tr>
<tr><td>Present Perfect</td><td>has made</td><td>has / have <b>been</b> made</td><td>yapıldı / yapılmıştır</td></tr>
<tr><td>Simple Past</td><td>made</td><td>was / were made</td><td>yapıldı</td></tr>
<tr><td>Past Continuous</td><td>was making</td><td>was / were <b>being</b> made</td><td>yapılıyordu</td></tr>
<tr><td>Past Perfect</td><td>had made</td><td>had <b>been</b> made</td><td>yapılmıştı</td></tr>
<tr><td>Future</td><td>will make</td><td>will <b>be</b> made</td><td>yapılacak</td></tr>
<tr><td>Future Perfect</td><td>will have made</td><td>will have <b>been</b> made</td><td>yapılmış olacak</td></tr>
<tr><td>Kip</td><td>must make</td><td>must <b>be</b> made</td><td>yapılmalı</td></tr>
<tr><td>Kip (geçmiş)</td><td>must have made</td><td>must have <b>been</b> made</td><td>yapılmış olmalı</td></tr>
<tr><td>to V</td><td>to make</td><td>to <b>be</b> made</td><td>yapılmak</td></tr>
<tr><td>-ing</td><td>making</td><td><b>being</b> made</td><td>yapılma</td></tr></table>
${TIP('Edilgen olup olmadığını anlamak için özneye sor: "Özne bu işi kendisi mi yapıyor, yoksa ona mı yapılıyor?" <i>The bridge … built</i> → köprü inşa etmez, inşa edilir → edilgen.')}

<h3>3. Geçişsiz fiiller ASLA edilgen olmaz</h3>
<p>Nesne almayan fiiller: <b>occur, happen, take place, arise, emerge, appear, disappear, exist, die, rise, fall, remain, belong, consist, seem, result, come, go, arrive</b></p>
${TRAP('"The accident <s>was occurred</s>" ✘ → "The accident <u>occurred</u>" ✔. "Many changes <s>have been happened</s>" ✘ → "have happened" ✔. YDS\'de bu tuzak her sınavda vardır.')}

<h3>4. "It is said that…" ve "X is said to…" (raporlama edilgeni)</h3>
<p>Fiiller: say, believe, think, know, consider, report, expect, estimate, claim, suppose</p>
<table class="t"><tr><th>Yapı</th><th>Ne zaman?</th><th>Örnek</th><th>Türkçesi</th></tr>
<tr><td>It is believed that + cümle</td><td>—</td><td>It is believed that the city <u>was founded</u> in 600 BC.</td><td>Şehrin MÖ 600'de kurulduğuna inanılıyor.</td></tr>
<tr><td>X is believed <b>to + V1</b></td><td>Aynı zaman / gelecek</td><td>He is believed <u>to live</u> abroad.</td><td>Yurt dışında yaşadığına inanılıyor.</td></tr>
<tr><td>X is believed <b>to be + V-ing</b></td><td>Şu an süren</td><td>He is said <u>to be working</u> on a new book.</td><td>Yeni bir kitap üzerinde çalıştığı söyleniyor.</td></tr>
<tr><td>X is believed <b>to have + V3</b></td><td>Daha önce olmuş</td><td>The city is believed <u>to have been founded</u> in 600 BC.</td><td>Şehrin MÖ 600'de kurulduğuna inanılıyor.</td></tr></table>
${TRAP('Geçmişte olmuş bir olay için <b>to have V3</b> gerekir. Cümlede "in 600 BC", "years ago", "in the 19th century" görürsen "to have" ara.')}

<h3>5. İki nesneli fiiller</h3>
${EX('They gave <u>the winner</u> <u>a prize</u>. → <u>The winner</u> was given a prize. / <u>A prize</u> was given to the winner.','Kazanana bir ödül verildi.')}

<h3>6. Ettirgen yapı: have / get something done</h3>
<table class="t"><tr><th>Yapı</th><th>Anlam</th><th>Örnek</th></tr>
<tr><td>have + nesne + V3</td><td>bir işi başkasına yaptırmak</td><td>I <u>had my car repaired</u>. (Arabamı tamir ettirdim.)</td></tr>
<tr><td>get + nesne + V3</td><td>aynı, daha günlük</td><td>She <u>got her hair cut</u>.</td></tr>
<tr><td>have + kişi + V1</td><td>birine bir iş yaptırmak</td><td>I <u>had the mechanic check</u> the engine.</td></tr>
<tr><td>get + kişi + to V1</td><td>birini ikna edip yaptırmak</td><td>I <u>got him to sign</u> the form.</td></tr></table>

<h3>7. Edilgen + edat: by dışındakiler</h3>
<p>be interested <b>in</b>, be known <b>as/for</b>, be made <b>of/from</b>, be covered <b>with</b>, be filled <b>with</b>, be associated <b>with</b>, be exposed <b>to</b>, be related <b>to</b>, be involved <b>in</b>, be based <b>on</b>, be composed <b>of</b></p>`,
qs:[
QW('Many new species ---- in the Amazon rainforest every year.',['discover','are discovered','have discovered','are discovering','discovered'],'B','Türler kendileri keşfetmez, keşfedilir → edilgen. "every year" genel/tekrarlanan → Simple Present edilgen: are discovered.',['Etken: türler bir şey keşfediyor anlamı.',null,'Etken Present Perfect.','Etken sürekli: türler keşif yapıyor.','"discovered" tek başına etken geçmiş; "every year" ile uyuşmaz.']),
QW('Major changes in the Earth\'s climate ---- over the past few centuries.',['have been occurred','were occurred','have occurred','are occurred','had been occurring by'],'C','"occur" geçişsizdir, edilgen yapılmaz. "over the past few centuries" → Present Perfect: have occurred.',['Geçişsiz fiil edilgen olmaz.','Geçişsiz fiil edilgen olmaz.',null,'Geçişsiz fiil edilgen olmaz.','"by" edilgen yapıya ait; anlamsız ve zaman uyumsuz.']),
QW('Shakespeare is believed ---- some of his plays together with other writers.',['to write','to have written','writing','to be written','to be writing'],'B','Shakespeare\'in yazması geçmişte, inanmak şimdi → is believed to have written.',['"to write" aynı zaman/gelecek bildirir; Shakespeare şu an yazmıyor.',null,'"believe" bu yapıda -ing almaz.','Edilgen olur (yazılmak); Shakespeare yazan kişi.','Şu an süren eylem bildirir.']),
QW('The results of the experiment ---- carefully before they are published.',['must check','must be checked','must have checked','have to check','are checking'],'B','Sonuçlar kontrol edilmeli (edilgen) ve gelecekteki yayın öncesi → must be checked.',['Etken: sonuçlar bir şeyi kontrol etmeli.',null,'Etken geçmiş tahmin.','Etken: sonuçlar kontrol etmek zorunda.','Etken sürekli.']),
QW('The new bridge ---- at the moment, so drivers must use the old road.',['is built','is being built','has built','builds','was being built'],'B','"at the moment" → Present Continuous; köprü inşa edilmekte → edilgen sürekli: is being built.',['"is built" geniş zaman edilgen; "şu anda" bildirmez.',null,'Etken Present Perfect.','Etken geniş zaman.','Geçmiş sürekli; "at the moment" ile uyuşmaz.']),
QW('The old castle, which ---- in the 12th century, is now a popular museum.',['built','has been built','was built','is built','had built'],'C','Kale inşa edilmiş (edilgen) ve "in the 12th century" belirli geçmiş → was built.',['Etken: kale bir şey inşa etmiş.','Belirli geçmiş zamanla Present Perfect kullanılmaz.',null,'Geniş zaman; geçmiş tarih var.','Etken Past Perfect.'])]},

{id:'if',grp:'yds',t:'Koşul Cümleleri ve Wish',en:'Conditionals & Wishes',s:'Type 0-1-2-3, karma koşul, unless, devrik koşul (Should/Were/Had), wish, if only',body:`
<h3>1. Koşul türleri</h3>
<table class="t"><tr><th>Tür</th><th>If kısmı</th><th>Ana cümle</th><th>Anlam</th></tr>
<tr><td><b>Type 0</b></td><td>Simple Present</td><td>Simple Present</td><td>Her zaman doğru, bilimsel gerçek</td></tr>
<tr><td><b>Type 1</b></td><td>Simple Present</td><td>will / can / may + V1</td><td>Gerçekleşmesi olası gelecek</td></tr>
<tr><td><b>Type 2</b></td><td>Simple Past (be → <b>were</b>)</td><td>would / could / might + V1</td><td>Şu an için hayali, gerçek dışı</td></tr>
<tr><td><b>Type 3</b></td><td>Past Perfect (had V3)</td><td>would / could / might <b>have V3</b></td><td>Geçmişte olmamış, pişmanlık</td></tr></table>
${EX('<b>0:</b> If you <u>heat</u> ice, it <u>melts</u>.','Buzu ısıtırsan erir.')}
${EX('<b>1:</b> If it <u>rains</u> tomorrow, the match <u>will be</u> cancelled.','Yarın yağmur yağarsa maç iptal edilecek.')}
${EX('<b>2:</b> If I <u>were</u> rich, I <u>would travel</u> the world.','Zengin olsaydım dünyayı gezerdim. (Zengin değilim.)')}
${EX('<b>3:</b> If they <u>had left</u> earlier, they <u>would have caught</u> the train.','Daha erken çıksalardı treni yakalarlardı. (Çıkmadılar, kaçırdılar.)')}
${TRAP('If kısmında <b>will / would kullanılmaz</b>. "If it will rain" ✘ → "If it rains" ✔.')}

<h3>2. Karma (mixed) koşul</h3>
<table class="t"><tr><th>Yapı</th><th>Anlam</th><th>Örnek</th></tr>
<tr><td>If + <b>had V3</b>, <b>would V1</b> (now/today)</td><td>Geçmiş neden → şimdiki sonuç</td><td>If I <u>had studied</u> medicine, I <u>would be</u> a doctor now.</td></tr>
<tr><td>If + <b>V2</b>, <b>would have V3</b></td><td>Kalıcı durum → geçmiş sonuç</td><td>If he <u>were</u> more careful, he <u>wouldn't have made</u> that mistake.</td></tr></table>
${TIP('Karma koşulu fark etmek için zaman ifadelerine bak: if kısmında "years ago, last year", ana cümlede "now, today, still" varsa karma koşuldur.')}

<h3>3. if yerine kullanılan bağlaçlar</h3>
<table class="t"><tr><th>Bağlaç</th><th>Anlam</th><th>Örnek</th></tr>
<tr><td><b>unless</b> (= if … not)</td><td>-mezse, -medikçe</td><td><u>Unless</u> you study, you will fail. (= If you don't study…)</td></tr>
<tr><td><b>provided / providing (that)</b></td><td>-mesi şartıyla</td><td>You can go <u>provided that</u> you return early.</td></tr>
<tr><td><b>as / so long as</b></td><td>-dığı sürece</td><td><u>As long as</u> you pay, you can stay.</td></tr>
<tr><td><b>on condition that</b></td><td>-mesi koşuluyla</td><td>—</td></tr>
<tr><td><b>in case</b></td><td>olur da … diye (önlem)</td><td>Take a map <u>in case</u> you get lost.</td></tr>
<tr><td><b>even if</b></td><td>-se bile</td><td>I'll go <u>even if</u> it rains.</td></tr>
<tr><td><b>otherwise</b></td><td>aksi takdirde</td><td>Hurry, <u>otherwise</u> you'll be late.</td></tr>
<tr><td><b>but for / without</b> + isim</td><td>… olmasaydı</td><td><u>But for</u> your help, I would have failed.</td></tr>
<tr><td><b>suppose / supposing / what if</b></td><td>farz et ki</td><td><u>Suppose</u> you won the lottery, what would you do?</td></tr></table>
${TRAP('<b>unless</b> zaten olumsuz anlam taşır; arkasından olumsuz fiil gelmez: "Unless you <s>don\'t</s> study" ✘.')}

<h3>4. Devrik (if'siz) koşul — YDS'de çok çıkar</h3>
<table class="t"><tr><th>Normal</th><th>Devrik</th></tr>
<tr><td>If you <b>should</b> need help, … (Type 1)</td><td><b>Should you need</b> help, call me.</td></tr>
<tr><td>If I <b>were</b> you, … (Type 2)</td><td><b>Were I</b> you, I would accept.</td></tr>
<tr><td>If they <b>had known</b>, … (Type 3)</td><td><b>Had they known</b>, they would have come.</td></tr>
<tr><td>If it were not for …</td><td><b>Were it not for</b> your help, …</td></tr>
<tr><td>If it had not been for …</td><td><b>Had it not been for</b> the rain, …</td></tr></table>
${TIP('Cümle "Should / Were / Had + özne" ile başlıyorsa ve soru işareti yoksa bu devrik koşuldur. Ana cümlenin zamanı türü belirler.')}

<h3>5. wish / if only</h3>
<table class="t"><tr><th>Yapı</th><th>Anlam</th><th>Örnek</th><th>Türkçesi</th></tr>
<tr><td>wish + <b>V2 / were</b></td><td>Şimdiki durumdan şikâyet</td><td>I wish I <u>knew</u> the answer.</td><td>Keşke cevabı bilseydim.</td></tr>
<tr><td>wish + <b>had V3</b></td><td>Geçmiş pişmanlık</td><td>I wish I <u>had studied</u> harder.</td><td>Keşke daha çok çalışsaydım.</td></tr>
<tr><td>wish + <b>would V1</b></td><td>Başkasının davranışından şikâyet / değişim isteği</td><td>I wish they <u>would stop</u> making noise.</td><td>Keşke gürültüyü kesseler.</td></tr>
<tr><td>wish + <b>could V1</b></td><td>Yapamamaktan şikâyet</td><td>I wish I <u>could</u> speak French.</td><td>Keşke Fransızca konuşabilsem.</td></tr></table>
<p><b>if only</b> aynı yapıları kullanır ve daha güçlüdür: <i>If only I had listened!</i></p>

<h3>6. as if / as though</h3>
${EX('He talks <u>as if</u> he <u>knew</u> everything. (ama bilmiyor)','Her şeyi biliyormuş gibi konuşuyor.')}

<h3>7. Koşul cümlelerinin YDS çevirisi</h3>
<table class="t"><tr><th>İngilizce</th><th>Türkçe</th></tr>
<tr><td>If + Present, will</td><td>-irse, -ecek</td></tr>
<tr><td>If + Past, would</td><td>-se, -irdi</td></tr>
<tr><td>If + had V3, would have V3</td><td>-miş olsaydı, -irdi</td></tr></table>`,
qs:[
QW('If governments ---- more in renewable energy decades ago, we would not be facing such a serious climate crisis today.',['invested','had invested','would invest','have invested','invest'],'B','Geçmiş neden (decades ago) + şimdiki sonuç (would not be facing today) → karma koşul: If + had V3.',['Type 2 olur ve "decades ago" ile çelişir.',null,'If kısmında would kullanılmaz.','Present Perfect koşul yapısında bu şekilde kullanılmaz.','Geniş zaman Type 1/0 yapar, "decades ago" ile çelişir.']),
QW('---- you need further information, please do not hesitate to contact our office.',['Should','Had','Were','Unless','Would'],'A','"If you should need" yapısının devrik hali: Should you need. Ana cümle şimdiki/gelecek (please contact).',[null,'"Had" Type 3 içindir, ana cümle geçmiş olmalı.','"Were" Type 2 içindir ve "were you need" yanlış yapı.','"Unless you need" anlamı ters çevirir: ihtiyacın yoksa bizi ara.','"Would you need" koşul değil soru olur.']),
QW('Unless the forests ---- , thousands of species will become extinct.',['will be protected','are protected','were protected','had been protected','are not protected'],'B','Ana cümle Type 1 (will become) → yan cümle Simple Present. "Unless" zaten olumsuz, arkasından olumlu fiil gelir → are protected.',['Koşul kısmında will kullanılmaz.',null,'Type 2 yapısı ana cümleyle (will) uyuşmaz.','Type 3 yapısı ana cümleyle uyuşmaz.','unless + olumsuz = çift olumsuzluk, anlam ters olur.']),
QW('Many older people wish they ---- more time with their families when they were younger.',['spend','will spend','had spent','have spent','would spend'],'C','Geçmişe yönelik pişmanlık ("when they were younger") → wish + had V3: had spent.',['Şimdiki zaman wish ile kullanılmaz.','wish sonrası will kullanılmaz.',null,'Present Perfect wish yapısında yer almaz.','"would spend" başkasının gelecekteki davranışı için şikâyettir.']),
QW('---- the warnings of the scientists, the government would have taken action much earlier.',['Had it listened to','If it listens to','Should it listen to','Unless it had listened to','Were it listened to'],'A','Ana cümle Type 3 (would have taken) → koşul kısmı Past Perfect; devrik hali: Had it listened to.',[null,'Type 1 yapısı ana cümleyle uyuşmaz.','Should devrik yapısı Type 1 içindir.','"Unless … had listened" anlamı ters çevirir: dinlememiş olsaydı daha erken harekete geçerdi.','Yanlış edilgen yapı ve Type 2.']),
QW('Take an umbrella with you ---- it rains this afternoon.',['unless','in case','even though','so that','as long as'],'B','"Öğleden sonra yağmur yağar diye şemsiye al" → önlem: in case.',['"yağmur yağmazsa şemsiye al" anlamsız.',null,'"yağdığı halde" anlam ve zaman uyumsuz.','"so that" amaç bildirir, "yağsın diye" anlamsız.','"yağdığı sürece şemsiye al" anlamca zayıf; önlem anlamı in case ile verilir.'])]}
];
