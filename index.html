<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2B50C8">
<meta name="description" content="YDS'ye sıfırdan hazırlık: okunuşlu ve sesli 1000+ kelime, adım adım gramer, açıklamalı sorular ve denemeler.">
<title>YDS Kampı</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: masaüstünde sol menü + içerik, telefonda alt menü. Şıklar ÖSYM optik formundaki A–E balonları gibi. */
:root{
  --bg:#EDF0F5; --surface:#FFFFFF; --surface-2:#F6F8FB; --ink:#16203A; --muted:#5B6578; --line:#D6DCE6;
  --accent:#2B50C8; --accent-ink:#FFFFFF; --accent-soft:#E2E8FA;
  --mark:rgba(255,222,70,.75);
  --ok:#1D8556; --ok-soft:#DDF2E7; --bad:#C0413A; --bad-soft:#F8E1DF; --warn:#B7791F;
  --font-d:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --font-b:'Source Sans 3','Segoe UI',system-ui,sans-serif;
  --font-m:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1320; --surface:#161D2E; --surface-2:#1B2337; --ink:#E6EAF2; --muted:#9AA4B8; --line:#2A3349;
  --accent:#8AA4FF; --accent-ink:#0E1320; --accent-soft:#1F2A4D; --mark:rgba(232,196,48,.38);
  --ok:#4CC38A; --ok-soft:#14302A; --bad:#F0776E; --bad-soft:#3A1E21; --warn:#E3B04B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1320; --surface:#161D2E; --surface-2:#1B2337; --ink:#E6EAF2; --muted:#9AA4B8; --line:#2A3349;
  --accent:#8AA4FF; --accent-ink:#0E1320; --accent-soft:#1F2A4D; --mark:rgba(232,196,48,.38);
  --ok:#4CC38A; --ok-soft:#14302A; --bad:#F0776E; --bad-soft:#3A1E21; --warn:#E3B04B; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:16px;line-height:1.55}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--font-d);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(1.7rem,4vw,2.4rem);font-weight:800;letter-spacing:-.02em}
h2{font-size:1.35rem;font-weight:700}
h3{font-size:1.05rem;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.mono{font-family:var(--font-m)}
.eyebrow{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}

.app{display:grid;grid-template-columns:220px 1fr;min-height:100%}
.side{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);background:var(--surface);padding-block:20px;padding-inline:14px;display:flex;flex-direction:column;gap:18px}
.brand{font-family:var(--font-d);font-weight:800;font-size:1.3rem;letter-spacing:-.02em;padding-inline:8px}
.brand span{background:linear-gradient(transparent 58%,var(--mark) 58%)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;border:0;background:none;text-align:left;padding:9px 10px;border-radius:8px;color:var(--muted);font-weight:600}
.nav button svg{width:19px;height:19px;flex:none}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="true"]{background:var(--accent-soft);color:var(--accent)}
.side .count{margin-top:auto;padding:12px;border:1px solid var(--line);border-radius:var(--r);font-size:.85rem}
.side .count b{font-family:var(--font-d);font-size:1.6rem;display:block;line-height:1.1}

main{min-width:0;padding-block:28px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:22px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;text-align:left;display:flex;flex-direction:column;gap:6px;transition:border-color .15s,transform .15s}
.tile:hover{border-color:var(--accent);transform:translateY(-1px)}
.tile .meta{font-size:.82rem;color:var(--muted)}
.tile .bar{height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-top:4px}
.tile .bar i{display:block;height:100%;background:var(--accent)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:10px 16px;border-radius:8px;font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted);padding-inline:8px}
.btn.ghost:hover{color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.between{justify-content:space-between}

.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:12px}
.countdown{background:var(--ink);color:var(--bg);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:6px}
.countdown .big{font-family:var(--font-d);font-size:3.6rem;font-weight:800;line-height:1;letter-spacing:-.03em}
.countdown .small{opacity:.75;font-size:.9rem}
.today{display:flex;flex-direction:column;gap:12px}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface-2);border-radius:8px;padding:10px}
.stat b{font-family:var(--font-d);font-size:1.5rem;display:block;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:.78rem;color:var(--muted)}

.dist{display:flex;flex-direction:column;gap:7px}
.dist .r{display:grid;grid-template-columns:170px 1fr 74px;gap:10px;align-items:center;font-size:.9rem}
.dist .track{height:12px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.dist .track i{display:block;height:100%;background:var(--accent)}
.dist .n{font-family:var(--font-m);font-size:.8rem;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}

.crumb{display:flex;gap:6px;align-items:center;font-size:.9rem;color:var(--muted);flex-wrap:wrap}
.crumb button{border:0;background:none;padding:0;color:var(--accent);font-weight:600}

.wtable{width:100%;border-collapse:collapse;font-size:.95rem}
.wtable td,.wtable th{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.wtable th{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.wtable .en{font-weight:700}
.wtable .ok{font-family:var(--font-m);font-size:.85rem;color:var(--muted)}
.tablewrap{overflow-x:auto}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--line)}
.dot.l1{background:var(--warn)}.dot.l2{background:var(--accent)}.dot.l3{background:var(--ok)}
.say{border:1px solid var(--line);background:var(--surface);border-radius:50%;width:34px;height:34px;display:inline-grid;place-items:center;flex:none}
.say:hover{border-color:var(--accent);color:var(--accent)}
.say svg{width:16px;height:16px}

/* flashcard */
.study{display:flex;flex-direction:column;gap:16px;align-items:stretch;max-width:560px;margin:0 auto;width:100%}
.flash{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:30px 22px;min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}
.flash .w{font-family:var(--font-d);font-size:clamp(2rem,7vw,2.8rem);font-weight:800;letter-spacing:-.02em;line-height:1.05}
.flash .pr{font-family:var(--font-m);font-size:1.1rem;color:var(--muted)}
.flash .pr::before{content:"okunuş  ";font-size:.7rem;letter-spacing:.08em;text-transform:uppercase}
.flash .tr{font-size:1.35rem;font-weight:700}
.flash .exs{font-size:1rem;color:var(--ink);max-width:44ch}
.hl{background:linear-gradient(transparent 55%,var(--mark) 55%);font-weight:700}
.pos{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);font-weight:700}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rate .btn{flex-direction:column;gap:0;padding:10px 6px}
.rate .btn small{font-weight:400;color:var(--muted);font-size:.75rem}
.rate .b0{border-color:var(--bad)}.rate .b1{border-color:var(--warn)}.rate .b2{border-color:var(--ok)}
.progress{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .25s}

/* grammar */
.lesson{display:flex;flex-direction:column;gap:12px;max-width:68ch}
.lesson ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
.ex{border-left:3px solid var(--accent);padding:6px 12px;background:var(--surface-2);border-radius:0 8px 8px 0}
.ex .e{font-weight:600}
.ex .t{color:var(--muted);font-size:.92rem}
.t{border-collapse:collapse;font-size:.92rem;width:100%}
.t td,.t th{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
.t th{background:var(--surface-2);font-weight:700}
.trap{border:1px dashed var(--warn);border-radius:8px;padding:10px 12px;font-size:.95rem}
.trap b{color:var(--warn)}

/* quiz */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.timer{font-family:var(--font-m);font-weight:500;font-variant-numeric:tabular-nums;padding:4px 10px;border-radius:6px;background:var(--surface-2)}
.timer.low{color:var(--bad)}
.passage{background:var(--surface-2);border-radius:var(--r);padding:14px 16px;font-size:.98rem;line-height:1.65;white-space:pre-line}
.qtext{font-size:1.08rem;font-weight:600;white-space:pre-line}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 12px}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt[disabled]{cursor:default}
.bub{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;font-family:var(--font-m);font-size:.8rem;font-weight:500;color:var(--muted)}
.opt.sel .bub{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.opt.sel{border-color:var(--ink)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .bub{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .bub{background:var(--bad);border-color:var(--bad);color:#fff}
.expl{border-radius:10px;padding:12px 14px;background:var(--accent-soft);font-size:.96rem}
.expl b{display:block;margin-bottom:2px}
.optik{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:5px}
.optik button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 0;font-family:var(--font-m);font-size:.72rem;line-height:1.2}
.optik button b{display:block;font-size:.8rem}
.optik button.done{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.optik button.cur{outline:2px solid var(--accent);outline-offset:1px}

.score{display:flex;gap:18px;align-items:flex-end;flex-wrap:wrap}
.score .big{font-family:var(--font-d);font-size:3.4rem;font-weight:800;line-height:1;letter-spacing:-.03em}
.review{display:flex;flex-direction:column;gap:10px}
.review .item{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.tag{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:20px;background:var(--surface-2);color:var(--muted)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}.tag.bad{background:var(--bad-soft);color:var(--bad)}

.search input{width:100%;font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.search input:focus{outline:2px solid var(--accent);outline-offset:1px}
.exrow.tr{color:var(--ink);opacity:.75;font-style:italic}
.str{font-weight:700;color:var(--accent)}
.hy{opacity:.45;margin:0 1px}
.flash .extr{color:var(--muted);font-style:italic}
.guide summary{cursor:pointer}
.exrow{font-weight:400;font-size:.82rem;color:var(--muted);margin-top:2px;max-width:46ch}
.sets{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.sets button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;font-weight:700;display:flex;flex-direction:column;align-items:flex-start;line-height:1.2}
.sets button small{font-weight:400;font-size:.72rem;color:var(--muted);font-family:var(--font-m)}
.sets button[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.expl p{margin:0 0 6px}
.verdict{display:block;margin-bottom:4px}
.sol{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.soltitle{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--accent)}
.t.parts td,.t.parts th{background:var(--surface)}
.t.parts th{background:var(--surface-2)}
.keys,.steps{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:4px}
.why{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.why li{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border-radius:8px;padding:8px 10px;border:1px solid var(--line)}
.why li.w-ok{border-color:var(--ok)}
.bub.sm{width:22px;height:22px;font-size:.72rem}
.w-ok .bub.sm{background:var(--ok);border-color:var(--ok);color:#fff}
.lesson h3{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.lesson h3:first-child{margin-top:0;padding-top:0;border-top:0}
.lesson h4{margin:6px 0 0;font-size:.95rem}
.lesson ol{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:4px}
.lesson .t{font-size:.9rem}
.lesson .tablewrap,.lesson table{margin:2px 0}
.stepbar{display:flex;flex-direction:column;gap:6px}
.toc summary{cursor:pointer;font-weight:600;color:var(--accent)}
.toc ol{margin:8px 0 0;padding-left:1.4em;display:flex;flex-direction:column;gap:2px}
.toc button{border:0;background:none;padding:3px 0;text-align:left;color:var(--ink)}
.toc button.done{color:var(--muted)}
.toc button.cur{font-weight:700;color:var(--accent)}
.stepnav .btn.primary{max-width:100%;white-space:normal;text-align:left}
.talk{background:var(--surface-2);border-radius:12px;padding:14px 16px;font-size:1.02rem;line-height:1.7;border:1px solid var(--line)}
.formula{border:1.5px solid var(--accent);border-radius:10px;overflow:hidden}
.formula .ft{background:var(--accent);color:var(--accent-ink);font-weight:700;padding:6px 12px;font-size:.9rem}
.formula .ft:empty{display:none}
.formula table{border-collapse:collapse;width:100%;font-size:.93rem}
.formula th,.formula td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.formula th{background:var(--accent-soft);font-size:.82rem}
.formula tr:last-child td{border-bottom:0}
.formula .fn{margin:0;padding:8px 12px;background:var(--surface-2);font-size:.9rem;border-top:1px solid var(--line)}
.wr{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;font-size:.96rem}
.wr .w-x{color:var(--bad);text-decoration:line-through;text-decoration-thickness:1px}
.wr .w-x span,.wr .w-v span{display:inline-block;width:1.4em;text-decoration:none;font-weight:700}
.wr .w-v{color:var(--ok)}
.wr p{margin:2px 0 0;font-size:.88rem;color:var(--muted)}
.sv{border-radius:10px;background:var(--surface-2);padding:12px 12px 8px}
.svl{display:flex;flex-wrap:wrap;gap:6px 6px;align-items:flex-start;font-size:1.02rem}
.svl span{display:inline-flex;flex-direction:column;align-items:center;padding:3px 8px;border-radius:6px;line-height:1.3}
.svl i{font-style:normal;font-size:.62rem;text-transform:uppercase;letter-spacing:.06em;opacity:.8;margin-top:1px}
.r-s{background:rgba(43,80,200,.13);color:var(--accent)}
.r-v{background:rgba(192,65,58,.13);color:var(--bad);font-weight:700}
.r-o{background:rgba(29,133,86,.14);color:var(--ok)}
.r-t{background:rgba(183,121,31,.16);color:var(--warn)}
.r-c{background:rgba(120,80,190,.15);color:#7a52c0}
.r-x{color:var(--ink)}
.svt{margin-top:6px;font-size:.93rem;color:var(--muted)}
.solve{border:1.5px dashed var(--accent);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.solve .st,.sum .st{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--accent)}
.solve .sq{font-weight:600;margin:0}
.solve .so{margin:0;padding-left:1.6em}
.solve .so li.ok{color:var(--ok);font-weight:700}
.solve .ss{display:flex;flex-direction:column;gap:6px;background:var(--surface-2);border-radius:8px;padding:10px 12px;font-size:.95rem}
.sum{background:var(--accent-soft);border-radius:12px;padding:14px 16px}
.sum ul{margin:6px 0 0;padding-left:1.2em;display:flex;flex-direction:column;gap:5px}
.tl{margin:0;background:var(--surface-2);border-radius:10px;padding:8px 10px 6px}
.tl svg{width:100%;height:auto;display:block}
.tl figcaption{font-size:.85rem;color:var(--muted);padding:0 4px 2px}
.tl-axis{stroke:var(--muted);stroke-width:2}.tl-axisf{fill:var(--muted)}
.tl-now{stroke:var(--accent);stroke-width:2;stroke-dasharray:4 3}
.tl-lb{fill:var(--muted);font-size:14px;font-family:var(--font-m)}
.tl-t{fill:var(--ink);font-size:17px;font-weight:600;font-family:var(--font-b)}
.tl-x line{stroke:var(--bad);stroke-width:3;stroke-linecap:round}
.tl-w{fill:none;stroke:var(--ok);stroke-width:3;stroke-linecap:round}
.tl-bar{stroke:var(--ok);stroke-width:6;stroke-linecap:round}
.tl-dot{fill:var(--ok)}
.tl-dead{stroke:var(--bad);stroke-width:2.5}
.tl-arc{fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:5 4}
.trx{display:block;font-style:italic;color:var(--muted);font-size:.9em;margin-top:2px}
.trx::before{content:"→ ";font-style:normal;color:var(--accent)}
.wr .trx{color:var(--ink);opacity:.8;text-decoration:none}
.sqt{margin:-4px 0 0}
.qtr{background:var(--surface);border-radius:8px;padding:8px 10px;margin:6px 0}
.term{border:0;background:none;padding:0;font:inherit;color:inherit;border-bottom:2px dotted var(--accent);cursor:help}
.term:hover{color:var(--accent)}
#sheet{position:fixed;inset:0;z-index:60;background:rgba(10,15,30,.45);display:flex;align-items:flex-end;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-in{background:var(--surface);color:var(--ink);width:min(560px,100%);border-radius:16px 16px 0 0;padding:16px max(18px,env(safe-area-inset-left,0px)) 22px;display:flex;flex-direction:column;gap:10px;box-shadow:0 -8px 30px rgba(0,0,0,.2);font-size:1.02rem;line-height:1.6}
.sheet-in p{margin:0}
.sheet-t{font-family:var(--font-d);font-size:1.2rem}
.sheet-ex{background:var(--surface-2);border-radius:8px;padding:8px 10px}
.tipbox{border-left:3px solid var(--ok);background:var(--ok-soft);border-radius:0 8px 8px 0;padding:9px 12px;font-size:.95rem}
.tipbox b{color:var(--ok)}
.tips{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:5px}
textarea{width:100%;min-height:110px;font-family:var(--font-m);font-size:.8rem;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface-2);color:var(--ink)}

gzersiz güç kazanmaya yardımcı olur.\ncall for|KOL for|gerektirmek, talep etmek|The situation may call for urgent action.|Durum acil eylem gerektirebilir.\ncarry on|ke-ri ON|devam etmek|You should carry on with your studies.|Çalışmalarına devam etmelisin.\ncatch up with|keç AP widh|yetişmek, arayı kapatmak|Developing countries are trying to catch up with rich nations.|Gelişmekte olan ülkeler zengin ülkelere yetişmeye çalışıyor.\ncome across|kam ı-KROS|rastlamak|You may come across new words while reading.|Okurken yeni kelimelere rastlayabilirsin.\ncome down with|kam DAUN widh|(hastalığa) yakalanmak|Many children come down with flu in winter.|Pek çok çocuk kışın gribe yakalanır.\ncount on|KAUNT on|güvenmek|You can always count on your friends.|Arkadaşlarına her zaman güvenebilirsin.\ncut down on|kat DAUN on|azaltmak|Doctors advise people to cut down on sugar.|Doktorlar insanlara şekeri azaltmalarını tavsiye ediyor.\ndie out|day AUT|nesli tükenmek, yok olmak|Many species may die out this century.|Pek çok türün nesli bu yüzyılda tükenebilir.\ndo without|du wi-DHAUT|-sız idare etmek|Few people can do without their phones.|Çok az insan telefonsuz idare edebilir.\ndraw up|dro AP|hazırlamak (plan, sözleşme)|The lawyers will draw up a new contract.|Avukatlar yeni bir sözleşme hazırlayacak.\ndrop out|drap AUT|okulu bırakmak|Some students drop out of school early.|Bazı öğrenciler okulu erken bırakıyor.\nend up|end AP|sonunda ... olmak|Many people end up working in a different field.|Pek çok insan sonunda farklı bir alanda çalışıyor.\nfall behind|fol bi-HAYND|geride kalmak|Students who miss classes may fall behind.|Derslere girmeyen öğrenciler geride kalabilir.\nfill in|fil İN|doldurmak (form)|Please fill in the application form.|Lütfen başvuru formunu doldurun.\nfind out|faynd AUT|öğrenmek, ortaya çıkarmak|Scientists want to find out how the virus spreads.|Bilim insanları virüsün nasıl yayıldığını öğrenmek istiyor.\nget over|get OU-vır|atlatmak, iyileşmek|It took him months to get over the illness.|Hastalığı atlatması aylar sürdü.\nget rid of|get RİD ov|kurtulmak|It is hard to get rid of bad habits.|Kötü alışkanlıklardan kurtulmak zordur.\ngive off|giv OF|yaymak (koku, ısı, gaz)|Some flowers give off a strong smell.|Bazı çiçekler güçlü bir koku yayar.\ngo through|gou THRUU|yaşamak, geçirmek|Many teenagers go through difficult times.|Pek çok genç zor dönemlerden geçer.\nhand in|hend İN|teslim etmek|Students must hand in their homework on time.|Öğrenciler ödevlerini zamanında teslim etmelidir.\nhold back|hould BEK|engellemek, geri tutmak|Lack of money can hold back development.|Para eksikliği kalkınmayı engelleyebilir.\nlay off|ley OF|işten çıkarmak|The company had to lay off hundreds of workers.|Şirket yüzlerce işçiyi işten çıkarmak zorunda kaldı.\nlead to|LİİD tu|yol açmak|Stress can lead to serious health problems.|Stres ciddi sağlık sorunlarına yol açabilir.\nlet down|let DAUN|hayal kırıklığına uğratmak|Poor service can let down an otherwise good hotel.|Kötü hizmet, başka açılardan iyi olan bir oteli bile hayal kırıklığına dönüştürebilir.\nlive up to|liv AP tu|beklentiyi karşılamak|The film did not live up to expectations.|Film beklentileri karşılamadı.\nlook after|luk EF-tır|bakmak, ilgilenmek|Nurses look after patients in hospital.|Hemşireler hastanede hastalara bakar.\nlook up|luk AP|(sözlükte) bakmak|You can look up new words in a dictionary.|Yeni kelimelere sözlükten bakabilirsin.\nmake out|meyk AUT|seçebilmek, anlamak|It was hard to make out the words in the dark.|Karanlıkta yazıları seçmek zordu.\npick up|pik AP|(dil, alışkanlık) kapmak; almak|Children pick up languages very quickly.|Çocuklar dilleri çok hızlı kapar.\npoint to|POYNT tu|işaret etmek|Recent studies point to a link between diet and mood.|Son çalışmalar beslenme ile ruh hâli arasında bir bağlantıya işaret ediyor.\npull down|pul DAUN|yıkmak|The council plans to pull down the old factory.|Belediye eski fabrikayı yıkmayı planlıyor.\nput forward|put FOR-wırd|öne sürmek|Scientists put forward a new theory.|Bilim insanları yeni bir teori öne sürdü.\nput out|put AUT|söndürmek|Firefighters managed to put out the fire.|İtfaiyeciler yangını söndürmeyi başardı.\nresult in|ri-ZALT in|ile sonuçlanmak, yol açmak|Poor diet can result in health problems.|Kötü beslenme sağlık sorunlarıyla sonuçlanabilir.\nresult from|ri-ZALT fram|-den kaynaklanmak|Many accidents result from careless driving.|Pek çok kaza dikkatsiz sürüşten kaynaklanır.\nset off|set OF|yola çıkmak; tetiklemek|The climbers will set off early in the morning.|Dağcılar sabah erkenden yola çıkacak.\nshow up|şou AP|gelmek, ortaya çıkmak|Only half of the students show up for the lecture.|Öğrencilerin yalnızca yarısı derse geliyor.\nslow down|slou DAUN|yavaşlamak|The economy may slow down next year.|Ekonomi gelecek yıl yavaşlayabilir.\nsort out|sort AUT|halletmek, çözmek|The manager will sort out the problem.|Müdür sorunu halledecek.\nstand for|STEND for|anlamına gelmek, temsil etmek|The letters UN stand for United Nations.|UN harfleri Birleşmiş Milletler anlamına gelir.\nstand out|stend AUT|göze çarpmak, sivrilmek|Her work continues to stand out from the rest.|Onun çalışmaları diğerlerinden sıyrılmaya devam ediyor.\ntake off|teyk OF|havalanmak; birden yükselmek|Sales of electric cars began to take off.|Elektrikli otomobil satışları hızla yükselmeye başladı.\ntake on|teyk ON|üstlenmek; işe almak|The company will take on fifty new workers.|Şirket elli yeni işçi alacak.\ntake up|teyk AP|(hobi) başlamak; yer kaplamak|Many retired people take up gardening.|Pek çok emekli bahçeyle uğraşmaya başlar.\nthink over|think OU-vır|üzerinde düşünmek|I need time to think over your offer.|Teklifin üzerinde düşünmek için zamana ihtiyacım var.\nthrow away|throu ı-WEY|atmak|People throw away tonnes of food every day.|İnsanlar her gün tonlarca yiyecek atıyor.\ntry out|tray AUT|denemek|Scientists will try out the new drug on animals.|Bilim insanları yeni ilacı hayvanlar üzerinde deneyecek.\nturn into|törn İN-tu|-e dönüşmek|Caterpillars turn into butterflies.|Tırtıllar kelebeğe dönüşür.\nturn out|törn AUT|... olduğu ortaya çıkmak|The rumours may turn out to be true.|Söylentilerin doğru olduğu ortaya çıkabilir.\nuse up|yuuz AP|tüketip bitirmek|We use up natural resources too quickly.|Doğal kaynakları çok hızlı tüketiyoruz.\nwork out|wörk AUT|çözmek, hesaplamak; spor yapmak|Engineers need to work out a solution.|Mühendislerin bir çözüm bulması gerekiyor.\npay off|pey OF|karşılığını vermek|Hard work will pay off in the end.|Çok çalışmanın karşılığı sonunda alınacak.\nbreak out|breyk AUT|patlak vermek|War could break out at any moment.|Her an savaş çıkabilir.\ncatch on|keç ON|tutmak, yaygınlaşmak|The new fashion did not catch on.|Yeni moda tutmadı.\nget along with|get ı-LONG widh|iyi geçinmek|It is important to get along with your colleagues.|İş arkadaşlarınla iyi geçinmek önemlidir.\ngo on|gou ON|devam etmek|The meeting will go on until noon.|Toplantı öğlene kadar devam edecek.\nlook down on|luk DAUN on|küçümsemek|Some people look down on manual work.|Bazı insanlar kol emeğini küçümser.\ncut off|kat OF|kesmek, ayırmak|The storm may cut off electricity to thousands of homes.|Fırtına binlerce evin elektriğini kesebilir.\nfall apart|fol ı-PART|dağılmak, parçalanmak|The old building began to fall apart.|Eski bina dağılmaya başladı.\ncome about|kam ı-BAUT|meydana gelmek|Nobody knows how the changes will come about.|Değişikliklerin nasıl gerçekleşeceğini kimse bilmiyor.\nboil down to|boyl DAUN tu|özünde ... olmak|The problem may boil down to a lack of money.|Sorun özünde para eksikliğinden ibaret olabilir.\nback down|bek DAUN|geri adım atmak|The government refused to back down.|Hükümet geri adım atmayı reddetti."},
{id:"baglac",name:"Bağlaçlar",en:"Connectors",pos:"connector",note:"YDS'de gramer, cloze ve cümle tamamlama sorularının çoğu bağlaçla çözülür. Arkasından cümle mi isim mi geldiğine dikkat et.",list:"although|ol-DHOU|-e rağmen (+ cümle)|Although he was tired, he continued working.|Yorgun olmasına rağmen çalışmaya devam etti.\ndespite|di-SPAYT|-e rağmen (+ isim / -ing)|Despite the heavy rain, the match continued.|Şiddetli yağmura rağmen maç devam etti.\nhowever|hau-E-vır|ancak, fakat|The plan was good; however, it was too expensive.|Plan iyiydi; ancak çok pahalıydı.\nwhereas|wer-EZ|oysa, -iken|Some people love cities, whereas others prefer villages.|Bazı insanlar şehirleri sever, oysa diğerleri köyleri tercih eder.\nmoreover|mor-OU-vır|üstelik, ayrıca|The car is cheap; moreover, it uses little fuel.|Araba ucuz; üstelik az yakıt tüketiyor.\ntherefore|DHER-for|bu nedenle|He studied hard; therefore, he passed the exam.|Çok çalıştı; bu nedenle sınavı geçti.\nthus|dhas|böylece, bu yüzden|The drug reduces inflammation and thus relieves pain.|İlaç iltihabı azaltır ve böylece ağrıyı hafifletir.\nhence|hens|dolayısıyla|The disease is rare, hence the lack of research.|Hastalık nadir görülüyor, araştırma eksikliği de bu yüzden.\nunless|ın-LES|-medikçe, -mezse|You will not pass unless you study regularly.|Düzenli çalışmazsan geçemezsin.\nprovided that|prı-VAY-did dhet|-mesi şartıyla|You can borrow the book provided that you return it on Monday.|Pazartesi geri getirmen şartıyla kitabı ödünç alabilirsin.\nin spite of|in SPAYT ov|-e rağmen (+ isim)|In spite of his illness, he went to work.|Hastalığına rağmen işe gitti.\nas long as|ez LONG ez|-dığı sürece|You can stay as long as you keep quiet.|Sessiz kaldığın sürece kalabilirsin.\nso that|SOU dhet|-sın diye|She saved money so that she could study abroad.|Yurt dışında okuyabilmek için para biriktirdi.\nin order to|in OR-dır tu|-mek için|Many people exercise in order to stay healthy.|Pek çok insan sağlıklı kalmak için egzersiz yapar.\ndue to|DUU tu|-den dolayı (+ isim)|The flight was delayed due to bad weather.|Uçuş kötü hava nedeniyle ertelendi.\nowing to|OU-ing tu|-den dolayı (+ isim)|The event was cancelled owing to lack of interest.|Etkinlik ilgi azlığı nedeniyle iptal edildi.\nwhether|WE-dhır|-ip -mediği|Nobody knows whether the plan will work.|Planın işe yarayıp yaramayacağını kimse bilmiyor.\nas a result|ez ı ri-ZALT|sonuç olarak|It rained for days; as a result, the river flooded.|Günlerce yağmur yağdı; sonuç olarak nehir taştı.\non the contrary|on dhı KAN-tre-ri|aksine|The test was not easy; on the contrary, it was very difficult.|Sınav kolay değildi; aksine çok zordu.\nfurthermore|FÖR-dhır-mor|ayrıca, dahası|The house is too small; furthermore, it is too expensive.|Ev çok küçük; dahası çok pahalı.\nnonetheless|nan-dhı-LES|yine de|The film was long; nonetheless, it was enjoyable.|Film uzundu; yine de keyifliydi.\nonce|wans|-ir -mez, bir kez|Once you learn the basics, the rest is easy.|Temelleri bir kez öğrendiğinde gerisi kolay.\neven though|İİ-vın dhou|-diği halde|Even though she was ill, she took the exam.|Hasta olduğu halde sınava girdi.\ninstead of|in-STED ov|yerine|You should walk instead of taking the bus.|Otobüse binmek yerine yürümelisin.\nregardless of|ri-GARD-lıs ov|-e bakmaksızın|Everyone has the right to education regardless of their background.|Geçmişi ne olursa olsun herkesin eğitim hakkı vardır.\nbecause of|bi-KOZ ov|yüzünden (+ isim)|The match was cancelled because of the rain.|Maç yağmur yüzünden iptal edildi.\nsince|sins|-den beri; çünkü|Since the bus was late, we took a taxi.|Otobüs geciktiği için taksiye bindik.\nas|ez|çünkü; -iken; gibi|As it was raining, we stayed at home.|Yağmur yağdığı için evde kaldık.\nwhile|wayl|-iken; oysa|While some people love coffee, others hate it.|Bazı insanlar kahveye bayılırken diğerleri ondan nefret eder.\nthough|dhou|-e rağmen; yine de|Though the test was hard, most students passed.|Sınav zor olsa da öğrencilerin çoğu geçti.\nyet|yet|ama, yine de|The plan was simple, yet it worked.|Plan basitti ama işe yaradı.\nin addition to|in ı-Dİ-şın tu|-e ek olarak (+ isim / -ing)|In addition to English, she speaks French.|İngilizcenin yanı sıra Fransızca da konuşuyor.\nbesides|bi-SAYDZ|ayrıca; -in yanı sıra|Besides being cheap, the car is reliable.|Araba ucuz olmasının yanı sıra güvenilir de.\nin contrast|in KAN-trest|buna karşın|Europe is ageing; in contrast, Africa has a young population.|Avrupa yaşlanıyor; buna karşın Afrika'nın nüfusu genç.\non the other hand|on dhi A-dhır hend|öte yandan|The job is well paid; on the other hand, it is stressful.|İşin maaşı iyi; öte yandan stresli.\notherwise|A-dhır-wayz|aksi takdirde|Hurry up; otherwise, you will miss the bus.|Acele et; yoksa otobüsü kaçıracaksın.\nin case|in KEYS|olur da ... diye|Take an umbrella in case it rains.|Yağmur yağar diye şemsiye al.\neven if|İİ-vın if|-se bile|I will go even if it rains.|Yağmur yağsa bile gideceğim.\nas soon as|ez SUUN ez|-ir -mez|Call me as soon as you arrive.|Varır varmaz beni ara.\nby the time|bay dhı TAYM|-dığı zamana kadar|By the time we arrived, the film had started.|Biz vardığımızda film başlamıştı.\nuntil|ın-TİL|-e kadar|Wait here until I come back.|Ben dönene kadar burada bekle.\nwhenever|we-NE-vır|ne zaman ... -se|Whenever I travel, I take a book.|Ne zaman yolculuk etsem yanıma bir kitap alırım.\nwhereby|wer-BAY|ki bununla, -dığı|They signed an agreement whereby both sides would cut costs.|İki tarafın da maliyetleri düşüreceği bir anlaşma imzaladılar.\nso as to|SOU ez tu|-mek için|She left early so as to catch the train.|Treni yakalamak için erken çıktı.\nfor instance|for İN-stıns|örneğin|Some fruits, for instance oranges, are rich in vitamin C.|Bazı meyveler, örneğin portakal, C vitamini açısından zengindir.\nsuch as|SAÇ ez|gibi|Fruits such as apples are good for you.|Elma gibi meyveler sağlığına iyi gelir.\nnamely|NEYM-li|yani, şöyle ki|Two countries, namely France and Germany, opposed the plan.|İki ülke, yani Fransa ve Almanya, plana karşı çıktı.\nin other words|in A-dhır WÖRDZ|başka bir deyişle|He was fired; in other words, he lost his job.|Kovuldu; başka bir deyişle işini kaybetti.\nsimilarly|Sİ-mı-lır-li|benzer şekilde|Children need sleep; similarly, adults need rest.|Çocukların uykuya ihtiyacı var; benzer şekilde yetişkinlerin de dinlenmeye.\nin fact|in FEKT|aslında; hatta|The test was not easy; in fact, it was very hard.|Sınav kolay değildi; hatta çok zordu.\nrather than|RE-dhır dhen|-den ziyade, yerine|She chose to walk rather than drive.|Araba kullanmak yerine yürümeyi seçti.\nas well as|ez WEL ez|-in yanı sıra|She speaks Spanish as well as English.|İngilizcenin yanı sıra İspanyolca da konuşuyor.\nin terms of|in TÖRMZ ov|bakımından|The city is rich in terms of culture.|Şehir kültür bakımından zengin.\nwith regard to|widh ri-GARD tu|ile ilgili olarak|With regard to your question, I will answer later.|Sorunla ilgili olarak daha sonra cevap vereceğim.\nin the event of|in dhi i-VENT ov|... durumunda|In the event of fire, use the stairs.|Yangın durumunda merdivenleri kullanın.\non condition that|on kın-Dİ-şın dhet|-mesi şartıyla|You can go on condition that you return by ten.|Saat ona kadar dönmen şartıyla gidebilirsin.\nas if|ez İF|-mış gibi|He talks as if he knew everything.|Her şeyi biliyormuş gibi konuşuyor.\nnow that|NAU dhet|madem, artık ... olduğuna göre|Now that you have finished, you can go home.|Bitirdiğine göre artık eve gidebilirsin.\ngiven that|Gİ-vın dhet|... göz önüne alındığında|Given that he is new, he did very well.|Yeni olduğu düşünülürse çok iyi iş çıkardı.\nin the meantime|in dhı MİİN-taym|bu arada|The doctor will come soon; in the meantime, please wait.|Doktor birazdan gelecek; bu arada lütfen bekleyin.\nas opposed to|ez ı-POUZD tu|-in aksine|He prefers tea as opposed to coffee.|Kahvenin aksine çayı tercih ediyor.\nthereby|dher-BAY|böylece|The drug blocks the virus, thereby preventing infection.|İlaç virüsü engelleyerek enfeksiyonu önler."},
{id:"kalip",name:"Akademik Kalıplar",en:"Collocations",pos:"kalıp",note:"\"be responsible for\", \"take into account\" gibi akademik metinlerde sürekli geçen hazır kalıplar. YDS kelime ve edat sorularında doğrudan çıkar.",list:"be responsible for|bi ri-SPAN-sı-bıl for|-den sorumlu olmak|Parents should be responsible for their children's safety.|Ebeveynler çocuklarının güvenliğinden sorumlu olmalıdır.\nbe capable of|bi KEY-pı-bıl ov|-ebilecek durumda olmak|Robots will soon be capable of doing many jobs.|Robotlar yakında pek çok işi yapabilecek duruma gelecek.\nbe aware of|bi ı-WER ov|-in farkında olmak|Drivers must be aware of the dangers of speeding.|Sürücüler hız yapmanın tehlikelerinin farkında olmalıdır.\nbe associated with|bi ı-SOU-şi-ey-tid widh|ile ilişkili olmak|Smoking can be associated with many diseases.|Sigara pek çok hastalıkla ilişkilendirilebilir.\nbe exposed to|bi ik-SPOUZD tu|-e maruz kalmak|Children should not be exposed to violent films.|Çocuklar şiddet içeren filmlere maruz kalmamalıdır.\nbe subject to|bi SAB-cikt tu|-e tabi olmak|All imports will be subject to a new tax.|Tüm ithalatlar yeni bir vergiye tabi olacak.\nbe prone to|bi PROUN tu|-e yatkın olmak|This area tends to be prone to flooding.|Bu bölge sele yatkın olma eğiliminde.\nbe likely to|bi LAYK-li tu|muhtemelen ... -mek|Prices are likely to rise next year.|Fiyatlar gelecek yıl muhtemelen yükselecek.\nbe bound to|bi BAUND tu|kesin ... -ecek olmak|Mistakes are bound to happen in a new job.|Yeni bir işte hata yapılması kaçınılmazdır.\nbe supposed to|bi sı-POUZD tu|-mesi gerekmek / beklenmek|Students are supposed to arrive on time.|Öğrencilerin zamanında gelmesi gerekiyor.\nbe due to|bi DUU tu|-den kaynaklanmak; ... -mesi beklenmek|The delay may be due to bad weather.|Gecikme kötü havadan kaynaklanıyor olabilir.\nbe concerned about|bi kın-SÖRND ı-baut|-den endişe duymak|Many parents are concerned about screen time.|Pek çok ebeveyn ekran süresinden endişe duyuyor.\nbe concerned with|bi kın-SÖRND widh|ile ilgili olmak|This chapter is concerned with economic history.|Bu bölüm ekonomi tarihiyle ilgilidir.\nbe involved in|bi in-VALVD in|-e dahil olmak|Thousands of volunteers will be involved in the project.|Projede binlerce gönüllü yer alacak.\nbe committed to|bi kı-Mİ-tid tu|-e bağlı olmak, kendini adamak|The company is committed to reducing waste.|Şirket atıkları azaltmaya kendini adamış durumda.\nbe accustomed to|bi ı-KAS-tımd tu|-e alışkın olmak|Farmers are accustomed to hard work.|Çiftçiler ağır işe alışkındır.\nbe eligible for|bi E-li-cı-bıl for|-e hak kazanmak|Students may be eligible for financial support.|Öğrenciler maddi desteğe hak kazanabilir.\nbe engaged in|bi in-GEYCD in|ile meşgul olmak|Most of the population is engaged in agriculture.|Nüfusun çoğu tarımla uğraşıyor.\nbe essential for|bi i-SEN-şıl for|için gerekli olmak|Sleep is essential for good health.|Uyku sağlıklı olmak için gereklidir.\nbe faced with|bi FEYST widh|ile karşı karşıya olmak|Many cities are faced with serious traffic problems.|Pek çok şehir ciddi trafik sorunlarıyla karşı karşıya.\nbe familiar with|bi fı-Mİ-li-yır widh|-i biliyor olmak, aşina olmak|Most young people are familiar with social media.|Gençlerin çoğu sosyal medyaya aşinadır.\nbe independent of|bi in-di-PEN-dınt ov|-den bağımsız olmak|The central bank should be independent of the government.|Merkez bankası hükümetten bağımsız olmalıdır.\nbe inclined to|bi in-KLAYND tu|-e meyilli olmak|People are inclined to believe good news.|İnsanlar iyi haberlere inanmaya meyillidir.\nbe keen on|bi KİİN on|-e hevesli olmak|Many children are keen on video games.|Pek çok çocuk video oyunlarına meraklıdır.\nbe relevant to|bi RE-lı-vınt tu|ile ilgili olmak|Your answer must be relevant to the question.|Cevabın soruyla ilgili olmalı.\nbe similar to|bi Sİ-mı-lır tu|-e benzer olmak|The new phone is similar to the old one.|Yeni telefon eskisine benziyor.\nbe superior to|bi suu-Pİ-ri-ır tu|-den üstün olmak|The new drug is superior to ol const FORM=(title,head,rows,note)=>`<div class="formula"><div class="ft">${title}</div><div class="tablewrap"><table><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table></div>${note?`<p class="fn">${note}</p>`:''}</div>`;
/* Yanlış / doğru karşılaştırması */

/* Cümle analizi: [[metin,rol],...] rol: s=özne v=yüklem o=nesne t=zaman/ipucu c=bağlaç x=diğer */
const ROLE={s:'özne',v:'yüklem',o:'nesne',t:'ipucu',c:'bağlaç',x:''};
const SV=(parts,tr)=>`<div class="sv"><div class="svl">${parts.map(([t,r])=>`<span class="r-${r}">${t}${ROLE[r]?`<i>${ROLE[r]}</i>`:''}</span>`).join(' ')}</div>${tr?`<div class="svt">${tr}</div>`:''}</div>`;
/* Öğretmen notu / konuşma balonu */

  const wave=(a,b)=>{let d=`M${a},${Y}`;for(let x=a;x<b;x+=12)d+=` q3,-9 6,0 t6,0`;return `<path d="${d}" class="tl-w"/>`;};
  const bar=(a,b)=>`<line x1="${a}" y1="${Y}" x2="${b}" y2="${Y}" class="tl-bar"/><circle cx="${a}" cy="${Y}" r="5" class="tl-dot"/>`;
  let k='';
  if(kind==='repeat')k=[70,140,210,280,350,420,490].map(x=>X(x)).join('')+`<text x="280" y="${Y-22}" class="tl-t" text-anchor="middle">her zaman / tekrar tekrar</text>`;
  if(kind==='now')k=wave(270,390)+`<text x="${NOW}" y="${Y-22}" class="tl-t" text-anchor="middle">şu an sürüyor</text>`;
  if(kind==='perfect')k=bar(110,NOW)+`<text x="110" y="${Y-18}" class="tl-t" text-anchor="middle">başladı</text><text x="220" y="${Y+28}" class="tl-t" text-anchor="middle">hâlâ etkili / sürüyor</text>`;
  if(kind==='perfcont')k=`<circle cx="110" cy="${Y}" r="5" class="tl-dot"/>`+wave(110,NOW)+`<text x="215" y="${Y-22}" class="tl-t" text-anchor="middle">… süredir devam ediyor</text>`;
  if(kind==='experience')k=X(170,'ne zaman? önemli değil')+`<path d="M180,${Y-4} Q255,${Y-34} ${NOW-6},${Y-6}" class="tl-arc"/><text x="255" y="${Y+28}" class="tl-t" text-anchor="middle">sonucu şimdi önemli</text>`;
  if(kind==='past')k=X(160,'belli bir an: 2010')+`<text x="245" y="${Y+28}" class="tl-t" text-anchor="middle">bitti, şimdiyle bağı yok</text>`;
  if(kind==='pastcont')k=wave(90,250)+X(180,'telefon çaldı')+`<text x="190" y="${Y+28}" class="tl-t" text-anchor="middle">uzun eylem sürerken araya kısa eylem girdi</text>`;
  if(kind==='pastperf')k=X(90,'1. olay (had V3)')+X(240,'2. olay (V2)')+`<path d="M100,${Y-4} Q165,${Y-30} 232,${Y-6}" class="tl-arc"/><text x="165" y="${Y+28}" class="tl-t" text-anchor="middle">önce olan → Past Perfect</text>`;
  if(kind==='usedto')k=[60,105,150,195].map(x=>X(x)).join('')+`<text x="130" y="${Y-22}" class="tl-t" text-anchor="middle">eskiden tekrar tekrar</text><text x="280" y="${Y+28}" class="tl-t" text-anchor="middle">artık yok</text>`;
  if(kind==='future')k=X(450,'gelecekte bir an')+`<path d="M${NOW+6},${Y-4} Q390,${Y-30} 444,${Y-6}" class="tl-arc"/>`;
  if(kind==='futcont')k=wave(400,500)+`<line x1="450" y1="${Y-24}" x2="450" y2="${Y+10}" class="tl-now"/><text x="450" y="${Y-32}" class="tl-t" text-anchor="middle">yarın bu saatte</text><text x="450" y="${Y+28}" class="tl-t" text-anchor="middle">sürüyor olacak</text>`;
  if(kind==='futperf')k=bar(NOW+10,460)+`<line x1="470" y1="${Y-26}" x2="470" y2="${Y+12}" class="tl-dead"/><text x="470" y="${Y-30}" class="tl-t" text-anchor="middle">by 2050</text><text x="400" y="${Y+28}" class="tl-t" text-anchor="middle">o zamana kadar bitmiş olacak</text>`;
  if(kind==='cond3')k=X(150,'geçmişte olmadı')+`<text x="150" y="${Y+28}" class="tl-t" text-anchor="middle">had V3 → would have V3</text>`;
  return `<figure class="tl"><svg viewBox="0 0 ${W} 116" role="img" aria-label="${caption||'zaman çizelgesi'}">${base}${k}</svg>${caption?`<figcaption>${caption}</figcaption>`:''}</figure>`;
}

const GR1=[
{id:'cumle',grp:'temel',t:'Cümlenin Yapısı ve Kelime Türleri',en:'Sentence Structure & Parts of Speech',s:'Özne, yüklem, nesne; isim, fiil, sıfat, zarf nedir? Her şeyin temeli.',body:`
<p>İngilizce öğrenirken en büyük farkı en başta kavramak gerekir: <b>Türkçede yüklem sondadır, İngilizcede ise öznenin hemen arkasından gelir.</b> YDS'deki uzun akademik cümleleri çözebilmek için önce bu iskeleti görmeyi öğrenmelisin.</p>

<h3>1. Temel cümle dizilişi: Özne + Yüklem + Nesne</h3>
<table class="t"><tr><th></th><th>Özne (Subject)</th><th>Yüklem (Verb)</th><th>Nesne (Object)</th><th>Yer / Zaman</th></tr>
<tr><td>İngilizce</td><td>Scientists</td><td>discovered</td><td>a new virus</td><td>in 2020.</td></tr>
<tr><td>Türkçe sırası</td><td>Bilim insanları</td><td colspan="2">2020'de yeni bir virüs</td><td>keşfetti.</td></tr></table>
${EX('The government <u>will build</u> a new hospital next year.','Hükümet gelecek yıl yeni bir hastane <u>inşa edecek</u>.')}
<p>Türkçeye çevirirken yüklemi en sona at, İngilizceye çevirirken yüklemi öznenin hemen arkasına getir. YDS çeviri sorularının yarısı bu kuralla çözülür.</p>

<h3>2. İngilizce cümlede mutlaka yüklem olur</h3>
<p>Türkçede "Ali öğretmen." diyebiliriz, İngilizcede fiilsiz cümle olmaz. Bu yüzden <b>be (am / is / are / was / were)</b> fiili "-dir, -dır" görevini görür.</p>
${EX('Ali <u>is</u> a teacher. / The results <u>were</u> surprising.','Ali öğretmendir. / Sonuçlar şaşırtıcıydı.')}

<h3>3. Kelime türleri (parts of speech)</h3>
<p>YDS kelime sorularında boşluğa ne tür kelime geleceğini bilmek şıkların yarısını eler. Türü çoğu zaman kelimenin sonundan (ekinden) tanırsın.</p>
<table class="t"><tr><th>Tür</th><th>Görevi</th><th>Tipik ekleri</th><th>Örnek</th></tr>
<tr><td><b>İsim</b> (noun)</td><td>Varlık, kavram</td><td>-tion, -sion, -ment, -ness, -ity, -ance/-ence, -ship, -ism</td><td>information, development, happiness, ability, importance</td></tr>
<tr><td><b>Fiil</b> (verb)</td><td>Eylem, oluş</td><td>-ize/-ise, -ify, -ate, -en</td><td>organize, simplify, activate, strengthen</td></tr>
<tr><td><b>Sıfat</b> (adjective)</td><td>İsmi niteler</td><td>-ful, -less, -ous, -ive, -al, -able/-ible, -ic, -ant/-ent</td><td>useful, careless, dangerous, effective, natural, possible, basic, important</td></tr>
<tr><td><b>Zarf</b> (adverb)</td><td>Fiili, sıfatı ya da cümleyi niteler</td><td>Çoğunlukla -ly</td><td>quickly, significantly, largely</td></tr>
<tr><td><b>Zamir</b> (pronoun)</td><td>İsmin yerini tutar</td><td>—</td><td>he, they, it, which, who</td></tr>
<tr><td><b>Edat</b> (preposition)</td><td>İsimlerle ilişki kurar</td><td>—</td><td>in, on, at, of, for, with, by</td></tr>
<tr><td><b>Bağlaç</b> (conjunction)</td><td>Cümleleri bağlar</td><td>—</td><td>and, but, because, although</td></tr>
<tr><td><b>Belirleyici</b> (determiner)</td><td>İsmin önüne gelir</td><td>—</td><td>a, an, the, this, some, many</td></tr></table>
${TIP('Bir kelimenin dört hali sık sorulur: <b>success</b> (başarı, isim) – <b>succeed</b> (başarmak, fiil) – <b>successful</b> (başarılı, sıfat) – <b>successfully</b> (başarıyla, zarf).')}

<h3>4. Hangi yere hangi tür gelir?</h3>
<table class="t"><tr><th>Boşluğun yeri</th><th>Gelmesi gereken</th><th>Örnek</th></tr>
<tr><td>the / a / an / my / this + ____</td><td>İsim (ya da sıfat + isim)</td><td>the <u>development</u> of science</td></tr>
<tr><td>____ + isim</td><td>Sıfat</td><td>a <u>significant</u> increase</td></tr>
<tr><td>be (is, are, was) + ____</td><td>Sıfat ya da isim</td><td>The test was <u>difficult</u>.</td></tr>
<tr><td>Özne + ____ + nesne</td><td>Fiil</td><td>They <u>analysed</u> the data.</td></tr>
<tr><td>Fiil + ____ / ____ + sıfat</td><td>Zarf</td><td>It rose <u>rapidly</u>. / <u>extremely</u> high</td></tr>
<tr><td>Edat (in, of, by…) + ____</td><td>İsim ya da -ing</td><td>by <u>reading</u>, in <u>addition</u></td></tr></table>

<h3>5. Yan cümleler: uzun YDS cümlelerinin sırrı</h3>
<p>YDS cümleleri genelde bir <b>ana cümle</b> ve ona bağlı bir ya da daha fazla <b>yan cümleden</b> oluşur. Yan cümleyi bağlaç (because, although, which, that, if…) başlatır. Uzun bir cümlede önce ana yüklemi bul, gerisi ona eklenmiş ayrıntıdır.</p>
${EX('Although the drug <i>was tested</i> on thousands of patients, <b>scientists still <u>do not know</u> its long-term effects</b>.','İlaç binlerce hasta üzerinde test edilmiş olmasına rağmen, <b>bilim insanları uzun vadeli etkilerini hâlâ <u>bilmiyor</u></b>.')}
<p>Burada ana cümle kalın kısımdır; "Although…" ile başlayan kısım yan cümledir.</p>

<h3>6. Olumsuz ve soru cümlesi</h3>
<table class="t"><tr><th></th><th>Olumlu</th><th>Olumsuz</th><th>Soru</th></tr>
<tr><td>be fiili</td><td>She is tired.</td><td>She is <b>not</b> tired.</td><td><b>Is</b> she tired?</td></tr>
<tr><td>Diğer fiiller (şimdi)</td><td>They work here.</td><td>They <b>do not (don't)</b> work here.</td><td><b>Do</b> they work here?</td></tr>
<tr><td>Diğer fiiller (geçmiş)</td><td>He called.</td><td>He <b>did not (didn't)</b> call.</td><td><b>Did</b> he call?</td></tr>
<tr><td>Kipli</td><td>We can go.</td><td>We <b>cannot</b> go.</td><td><b>Can</b> we go?</td></tr></table>
${TRAP('do / does / did kullanıldığında ana fiil <b>yalın</b> haline döner: He <u>doesn\'t know</u> (knows değil), Did they <u>arrive</u>? (arrived değil).')}`,
qs:[
QW('The ---- of the new vaccine took more than ten years.',['develop','developed','development','developing','developmental'],'C','"The ---- of" kalıbında the\'dan sonra ve of\'tan önce isim gelir: development (gelişme, geliştirilme).',['develop fiildir; "the" isimden önce gelir.','developed fiilin geçmiş hali ya da sıfattır; burada isim gerekiyor.',null,'developing -ing hali; "the developing of" kullanılmaz, isim hali "development" varken onu seçeriz.','developmental sıfattır (gelişimsel); arkasında isim yok.']),
QW('Global temperatures have risen ---- over the past century.',['significant','significance','significantly','signify','signification'],'C','Boşluk "have risen" fiilini niteliyor; fiili niteleyen kelime zarftır: significantly (önemli ölçüde).',['significant sıfattır; fiili değil isimleri niteler.','significance isimdir (önem).',null,'signify fiildir (anlamına gelmek).','signification isimdir ve çok nadir kullanılır.']),
QW('Many experts believe that the new policy will be ---- for small businesses.',['benefit','beneficial','beneficially','beneficiary','benefited'],'B','"will be" (olacak) arkasından durumu anlatan sıfat gelir: beneficial (yararlı).',['benefit isim/fiil; "will be benefit" yanlış yapıdır.',null,'beneficially zarftır; be fiilinden sonra sıfat gelir.','beneficiary isimdir (yararlanıcı kişi), anlam uymuyor.','benefited geçmiş zaman fiil; "will be benefited" edilgen olur ve anlam bozulur.']),
QW('Scientists ---- the samples carefully before they published the results.',['analysis','analytical','analysed','analyst','analytically'],'C','Cümlenin öznesi "Scientists", nesnesi "the samples"; aradaki boşluğa yüklem (fiil) gelmeli. Geçmiş anlatılıyor (published) → analysed.',['analysis isimdir; cümlede yüklem eksik.','analytical sıfattır; özne ile nesne arasında fiil gerekir.',null,'analyst isimdir (analist).','analytically zarftır; yüklem görevini göremez.']),
QW('The researchers ---- know how the virus first entered the human population.',['don\'t','doesn\'t','isn\'t','aren\'t','didn\'t knew'],'A','Özne çoğul (researchers) ve fiil "know" yalın halde; olumsuzluk "do not / don\'t" ile yapılır.',[null,'doesn\'t tekil öznelerle (he, she, it) kullanılır; "researchers" çoğul.','isn\'t be fiilinin olumsuzudur ve tekildir; "know" gibi bir fiille kullanılmaz.','aren\'t be fiilidir; "aren\'t know" diye bir yapı yoktur.','"didn\'t" sonrası fiil yalın olmalı (know); "knew" yanlış.']),
QW('Although the experiment failed, the team ---- valuable data.',['collecting','to collect','collected','collection','collective'],'C','"Although…" yan cümle; virgülden sonraki ana cümlenin yüklemi eksik. Özne "the team", zaman geçmiş (failed) → collected.',['-ing hali tek başına yüklem olamaz; "was collecting" olmalıydı.','"to collect" mastardır, yüklem olamaz.',null,'collection isimdir; cümlede fiil eksik.','collective sıfattır.'])]},

{id:'isim',grp:'temel',t:'İsimler ve Artikeller',en:'Nouns & Articles',s:'a / an / the, çoğul ekleri, sayılabilen ve sayılamayan isimler',body:`
<h3>1. Sayılabilen ve sayılamayan isimler</h3>
<p>İngilizcede isimler ikiye ayrılır. Bu ayrım YDS'de <b>much / many, few / little, a / an</b> sorularının temelidir.</p>
<table class="t"><tr><th>Sayılabilen (countable)</th><th>Sayılamayan (uncountable)</th></tr>
<tr><td>Tekil ve çoğul hali vardır: a book → books, a study → studies</td><td>Çoğul olmaz, "a / an" almaz, fiili tekildir.</td></tr>
<tr><td>book, student, country, problem, idea, study, result</td><td><b>information, evidence, research, advice, knowledge, equipment, furniture, progress, news, traffic, pollution, money, water, damage</b></td></tr>
<tr><td>many, a few, few, a number of, several</td><td>much, a little, little, an amount of, a great deal of</td></tr></table>
${TRAP('<b>information, evidence, research, advice, progress, news</b> Türkçede sayılabilir gibi görünür ama İngilizcede sayılamaz. "an evidence", "researches", "informations" yanlıştır. "a piece of evidence", "a piece of advice" denir.')}

<h3>2. Çoğul yapma kuralları</h3>
<table class="t"><tr><th>Kural</th><th>Örnek</th></tr>
<tr><td>Çoğu isme -s</td><td>result → results</td></tr>
<tr><td>-s, -ss, -sh, -ch, -x, -o ile bitenlere -es</td><td>class → classes, process → processes, potato → potatoes</td></tr>
<tr><td>Ünsüz + y → -ies</td><td>study → studies, country → countries</td></tr>
<tr><td>-f / -fe → -ves</td><td>life → lives, leaf → leaves</td></tr>
<tr><td>Düzensiz çoğullar</td><td>man → men, woman → women, child → children, person → people, foot → feet, tooth → teeth, mouse → mice</td></tr>
<tr><td>Latince / Yunanca kökenli (akademik metinlerde çok çıkar)</td><td>phenomenon → phenomena, criterion → criteria, analysis → analyses, hypothesis → hypotheses, datum → data, bacterium → bacteria</td></tr>
<tr><td>Tekil ve çoğulu aynı</td><td>species, series, sheep, fish, means</td></tr></table>
${TIP('"data", "criteria", "phenomena", "bacteria" çoğuldur: <i>These phenomena <u>are</u> rare.</i> Akademik İngilizcede "the data show / suggest" yaygındır.')}

<h3>3. Artikeller: a / an / the</h3>
<table class="t"><tr><th>Artikel</th><th>Ne zaman?</th><th>Örnek</th></tr>
<tr><td><b>a</b></td><td>Tekil, sayılabilen, ilk kez bahsedilen, ünsüz <i>sesle</i> başlayan isim</td><td>a book, a university (yu- sesi), a European country</td></tr>
<tr><td><b>an</b></td><td>Aynısı ama ünlü <i>sesle</i> başlayan</td><td>an idea, an hour (h okunmaz), an MBA</td></tr>
<tr><td><b>the</b></td><td>Bilinen, daha önce bahsedilen, tek olan, belirli olan</td><td>the sun, the government, the results of the study</td></tr>
<tr><td><b>Artikelsiz (Ø)</b></td><td>Genel anlamda çoğul ya da sayılamayan isimler</td><td>Water is essential. Children need love.</td></tr></table>
${EX('<u>A</u> study was published last week. <u>The</u> study shows that <u>Ø</u> sleep affects <u>Ø</u> memory.','Geçen hafta bir çalışma yayımlandı. Çalışma, uykunun hafızayı etkilediğini gösteriyor.')}
<h4>"the" kullanılan özel durumlar</h4>
<ul><li>Tek olan şeyler: the Earth, the sun, the moon, the Internet</li>
<li>Superlative (en …): the best, the most important</li>
<li>Sıra sayıları: the first, the second</li>
<li>"of" ile belirlenen isimler: the history <u>of</u> Turkey, the effects <u>of</u> smoking</li>
<li>Okyanus, nehir, sıradağ, çoğul ülke adları: the Pacific, the Nile, the Alps, the USA, the Netherlands</li>
<li>Bir türü bütün olarak anlatma: The tiger is an endangered species.</li></ul>
<h4>"the" kullanılmayan durumlar</h4>
<ul><li>Genel anlamda soyut kavramlar: <i>Ø Education is important.</i> (the education değil)</li>
<li>Ülke, şehir, kıta, tekil dağ ve göl adları: Ø Turkey, Ø Ankara, Ø Europe, Ø Mount Everest</li>
<li>Öğün, dil, spor: Ø breakfast, Ø English, Ø football</li></ul>

<h3>4. İsim tamlaması: 's ve of</h3>
<table class="t"><tr><th>Yapı</th><th>Kullanım</th><th>Örnek</th></tr>
<tr><td>isim + 's</td><td>Genelde canlılar</td><td>the doctor's advice, children's health</td></tr>
<tr><td>the … of …</td><td>Cansızlar, uzun ifadeler</td><td>the cost of the project, the causes of the disease</td></tr>
<tr><td>isim + isim</td><td>İlk isim sıfat gibi çalışır</td><td>a <u>health</u> problem, <u>climate</u> change, <u>air</u> pollution</td></tr></table>
${TIP('İsim + isim yapısında ilk isim <b>çoğul olmaz</b>: a <u>ten-year</u> study (ten-years değil), a <u>car</u> factory.')}

<h3>5. Özne-fiil uyumu</h3>
<p>Tekil özne → tekil fiil (is, has, -s); çoğul özne → çoğul fiil (are, have). YDS'de özne ile fiil arasına uzun ifadeler girer, gerçek özneyi bulmak gerekir.</p>
${EX('The <u>number</u> of students <u>is</u> rising. / The <u>effects</u> of the drug <u>are</u> not clear.','Öğrenci sayısı artıyor. / İlacın etkileri belli değil.')}
${TRAP('"One of the + çoğul isim" → tekil fiil: <i>One of the main problems <u>is</u> pollution.</i> "Each / Every + tekil isim" → tekil fiil.')}`,
qs:[
QW('The study provides strong ---- that regular exercise reduces the risk of heart disease.',['evidences','an evidence','evidence','evident','evidently'],'C','"evidence" sayılamaz bir isimdir; çoğul eki ve "an" almaz. "strong evidence" doğru kullanımdır.',['"evidence" sayılamaz, -s almaz.','Sayılamayan isim "an" almaz.',null,'evident sıfattır; "strong" sıfatından sonra isim gerekir.','evidently zarftır.']),
QW('---- Moon has a strong effect on ---- tides of ---- oceans.',['A / the / the','The / the / the','The / Ø / Ø','Ø / the / an','A / Ø / the'],'B','Ay tek olduğu için "the Moon"; gelgitler okyanuslara ait belirli gelgitler (of ile belirlenmiş) → the tides; "the oceans" da belirli (Dünya\'nın okyanusları).',['Ay tektir, "a moon" denemez.',null,'"tides of" yapısı "of" ile belirlenmiş, the ister.','Ay tek olduğu için the gerekir; "an oceans" da tekil/çoğul uyumsuzluğu.','"A Moon" yanlış.']),
QW('These ---- were first observed by scientists in the nineteenth century.',['phenomenon','phenomena','phenomenons','phenomenal','phenomenas'],'B','"These" çoğul ister ve fiil "were" çoğul. phenomenon kelimesinin çoğulu phenomena\'dır.',['phenomenon tekildir; "these" ile kullanılmaz.',null,'Düzensiz çoğuldur, -s almaz.','phenomenal sıfattır.','"phenomena" zaten çoğuldur, -s eklenmez.']),
QW('One of the biggest challenges facing developing countries ---- the lack of clean water.',['are','have been','is','were','being'],'C','Gerçek özne "One"dır (birisi), tekil. Araya giren "of the biggest challenges facing developing countries" fiili değiştirmez → is.',['"challenges" ve "countries" çoğul ama özne "One".','"have been" çoğul.',null,'"were" çoğul ve geçmiş.','-ing hali yüklem olamaz.']),
QW('The researchers gave the patients some useful ---- about diet and exercise.',['advices','advice','an advice','advise','advisers'],'B','"advice" (tavsiye) sayılamaz isimdir; çoğul eki almaz. "some useful advice" doğrudur.',['advice çoğul olmaz.',null,'"an" ile kullanılmaz; "a piece of advice" denir.','advise fiildir (tavsiye etmek); "useful" sıfatından sonra isim gerekir.','advisers (danışmanlar) anlamı uymuyor: hastalara danışman verilmemiş.']),
QW('There is ---- old bridge near the village. ---- bridge was built in ---- 16th century.',['a / A / the','an / The / the','an / A / a','a / The / Ø','the / The / a'],'B','"old" ünlü sesle başladığı için "an old bridge"; köprüden ikinci kez bahsedilince artık belirli → "The bridge"; sıra sayılarıyla (16th) yüzyıl adı "the" alır → "the 16th century".',['"old" ünlü sesle başlar, "a" değil "an" gerekir. İkinci kez bahsedilen köprü de "A" değil "The" olmalı.',null,'İkinci kez bahsedilen köprü belirli olur, "A" olamaz; "a 16th century" da yanlış.','"a old" yanlış, ünlüden önce "an"; "in 16th century" artikelsiz kullanılmaz.','İlk kez bahsedilen köprü "the" ile başlamaz; "a 16th century" yanlış.'])
]},

{id:'zamir',grp:'temel',t:'Zamirler',en:'Pronouns',s:'I/me/my/mine, kendisi (itself), it ve there, this/that, one',body:`
<p>Zamirler ismin yerini tutar. YDS'de zamir soruları genelde <b>neyi işaret ettiğini bulmak</b> (okuma sorularında "it", "they", "this" neyi kastediyor?) ve <b>doğru biçimi seçmek</b> şeklinde gelir.</p>

<h3>1. Kişi zamirleri tablosu</h3>
<table class="t"><tr><th>Özne</th><th>Nesne</th><th>İyelik sıfatı (+isim)</th><th>İyelik zamiri (tek başına)</th><th>Dönüşlü</th></tr>
<tr><td>I (ben)</td><td>me (beni, bana)</td><td>my (benim …)</td><td>mine (benimki)</td><td>myself</td></tr>
<tr><td>you (sen)</td><td>you</td><td>your</td><td>yours</td><td>yourself</td></tr>
<tr><td>he (o – erkek)</td><td>him</td><td>his</td><td>his</td><td>himself</td></tr>
<tr><td>she (o – kadın)</td><td>her</td><td>her</td><td>hers</td><td>herself</td></tr>
<tr><td>it (o – cansız, hayvan)</td><td>it</td><td>its</td><td>—</td><td>itself</td></tr>
<tr><td>we (biz)</td><td>us</td><td>our</td><td>ours</td><td>ourselves</td></tr>
<tr><td>you (siz)</td><td>you</td><td>your</td><td>yours</td><td>yourselves</td></tr>
<tr><td>they (onlar)</td><td>them</td><td>their</td><td>theirs</td><td>themselves</td></tr></table>
${EX('<u>They</u> told <u>us</u> about <u>their</u> plans, and we told them about <u>ours</u>.','Onlar bize planlarından bahsetti, biz de onlara bizimkilerden bahsettik.')}
${TRAP('<b>its</b> (onun) ile <b>it\'s</b> (= it is) karıştırılır. <i>The company changed <u>its</u> name.</i> (it\'s değil)')}

<h3>2. Özne mi nesne mi?</h3>
<p>Fiilden önce, işi yapan → özne zamiri. Fiilden ya da edattan sonra → nesne zamiri.</p>
${EX('The teacher helped <u>them</u>. / Between you and <u>me</u>, the plan will fail.','Öğretmen onlara yardım etti. / Aramızda kalsın, plan başarısız olacak.')}

<h3>3. Dönüşlü zamirler (myself, itself, themselves)</h3>
<ul><li><b>Eylem özneye döner:</b> She taught <u>herself</u> English. (Kendi kendine İngilizce öğrendi.)</li>
<li><b>Vurgu:</b> The president <u>himself</u> opened the meeting. (Başkanın kendisi açtı.)</li>
<li><b>by + dönüşlü = tek başına:</b> He lives <u>by himself</u>.</li></ul>
${EX('The body can repair <u>itself</u>.','Vücut kendini onarabilir.')}

<h3>4. each other / one another</h3>
<p>"Birbirini" anlamına gelir. Dönüşlü zamirle karıştırılmamalı.</p>
${EX('The two countries blamed <u>each other</u>. ≠ The two countries blamed <u>themselves</u>.','İki ülke birbirini suçladı. ≠ İki ülke kendini suçladı.')}

<h3>5. "it" ve "there": boş özneler</h3>
<p>İngilizcede her cümlede özne olmak zorunda olduğu için bazen anlamı olmayan "it" veya "there" kullanılır.</p>
<table class="t"><tr><th>Yapı</th><th>Kullanım</th><th>Örnek</th></tr>
<tr><td><b>There is / are</b></td><td>"… var" demek</td><td>There <u>are</u> many reasons for this. (Bunun pek çok nedeni var.)</td></tr>
<tr><td><b>It is + sıfat + to V / that</b></td><td>Uzun özneyi sona atmak</td><td>It is important <u>to sleep well</u>. (İyi uyumak önemlidir.)</td></tr>
<tr><td><b>It is said / believed that</b></td><td>Edilgen yorum</td><td>It is believed that… (… inanılmaktadır)</td></tr>
<tr><td><b>It takes + süre + to V</b></td><td>"… sürer"</td><td>It takes years to learn a language.</td></tr>
<tr><td>Hava, zaman, mesafe</td><td>—</td><td>It is raining. It is 5 km from here.</td></tr></table>
${TRAP('"There is" arkasından gelen isme uyar: <i>There <u>is</u> a problem / There <u>are</u> two problems.</i>')}

<h3>6. İşaret zamirleri: this, that, these, those</h3>
<table class="t"><tr><th></th><th>Yakın</th><th>Uzak</th></tr><tr><td>Tekil</td><td>this</td><td>that</td></tr><tr><td>Çoğul</td><td>these</td><td>those</td></tr></table>
<p>Akademik metinlerde <b>that of / those of</b> karşılaştırmada ismin tekrarını önler:</p>
${EX('The population of Istanbul is larger than <u>that of</u> Ankara.','İstanbul\'un nüfusu Ankara\'nınkinden fazladır. (that = the population)')}
${EX('The prices in cities are higher than <u>those</u> in villages.','Şehirlerdeki fiyatlar köylerdekinden yüksektir. (those = the prices)')}
${TRAP('Tekil isim için <b>that of</b>, çoğul isim için <b>those of</b>. Bu YDS\'de sık çıkar.')}

<h3>7. one / ones</h3>
<p>Aynı sayılabilen ismi tekrar etmemek için kullanılır: <i>This method is better than the old <u>one</u>.</i> (the old method)</p>

<h3>8. Belgisiz zamirler</h3>
<table class="t"><tr><th>Olumlu</th><th>Olumsuz / soru</th><th>Hiç</th></tr>
<tr><td>someone, something, somewhere</td><td>anyone, anything, anywhere</td><td>no one / nobody, nothing, nowhere</td></tr></table>
<p>Hepsi <b>tekil fiil</b> alır: <i>Everyone <u>knows</u> the answer. Nobody <u>was</u> there.</i></p>

<h3>9. Okuma sorularında zamir takibi</h3>
<p>Paragraf sorularında "they, it, this, such" kelimeleri önceki cümledeki bir ismi işaret eder. Doğru cevabı bulmak için zamiri, işaret ettiği isimle değiştirip cümlenin anlamlı olup olmadığına bak.</p>`,
qs:[
QW('The company has changed ---- strategy in order to attract younger customers.',['it\'s','its','their own','it','itself'],'B','"company" tekil ve cansız; "strategy" ismine sahiplik bildiren iyelik sıfatı "its"tir.',['it\'s = it is; "şirket bir strateji" anlamsız olur.',null,'their çoğul öznelere aittir; company tekil.','it nesne/özne zamiridir, isimden önce sahiplik bildirmez.','itself dönüşlü zamirdir, isimden önce gelmez.']),
QW('The average temperature in the north is much lower than ---- in the south.',['this','those','that','these','one'],'C','Tekrar edilmemesi gereken isim "the average temperature" tekildir; tekil isim yerine "that" kullanılır.',['"this" karşılaştırmada ismin yerine geçmek için kullanılmaz.','"those" çoğul isimlerin yerini tutar.',null,'"these" çoğuldur ve bu kullanımda kalıp değildir.','"one" "the" olmadan ve "in the south" ile bu yapıda kullanılmaz.']),
QW('The two scientists had never met, but they had read ---- work for years.',['themselves','each other\'s','theirselves','their own','themselves\''],'B','Anlam "birbirlerinin çalışmalarını okumuşlardı" → each other\'s.',['themselves "kendi kendilerini" demektir, iyelik bildirmez.',null,'"theirselves" diye bir kelime yoktur.','"their own work" kendi çalışmalarını demek olur; tanışmadıkları vurgusuyla anlam "birbirinin" olmalı.','"themselves\'" yanlış bir biçimdir.']),
QW('---- is no doubt that air pollution is a major threat to public health.',['It','This','There','That','What'],'C','"… olduğuna dair şüphe yok" → "There is no doubt that". "no doubt" isim; varlık bildiren yapı there is.',['"It is no doubt" yaygın ama hatalı kabul edilir; doğru kalıp "There is no doubt".','"This is no doubt that" kalıp değildir.',null,'"That is no doubt" anlamsızdır.','"What is no doubt" isim cümleciği kurar; bu yapıda yanlış.']),
QW('Patients with diabetes need to monitor ---- blood sugar levels carefully.',['them','themselves','their','theirs','they'],'C','"blood sugar levels" isminden önce sahiplik → iyelik sıfatı "their".',['them nesne zamiridir, ismin önüne gelmez.','themselves dönüşlüdür, isim önünde kullanılmaz.',null,'theirs tek başına kullanılır (onlarınki), ismin önüne gelmez.','they özne zamiridir.']),
QW('Bees are essential for agriculture because ---- pollinate many food crops.',['it','they','them','their','its'],'B','"Bees" çoğul ve fiil "pollinate"in öznesi gerekiyor → they.',['it tekil; arılar çoğul.',null,'them nesne zamiridir, özne olamaz.','their iyelik sıfatıdır, yüklemden önce özne olamaz.','its tekil ve iyelik.'])]},

{id:'sifatzarf',grp:'temel',t:'Sıfatlar ve Zarflar',en:'Adjectives & Adverbs',s:'Sıfat-zarf farkı, -ed / -ing sıfatlar, so/such, too/enough',body:`
<h3>1. Sıfat ismi, zarf geri kalan her şeyi niteler</h3>
<table class="t"><tr><th>Sıfat (adjective)</th><th>Zarf (adverb)</th></tr>
<tr><td>a <u>careful</u> driver (dikkatli bir sürücü)</td><td>He drives <u>carefully</u>. (dikkatli sürer)</td></tr>
<tr><td>a <u>rapid</u> increase (hızlı bir artış)</td><td>Prices increased <u>rapidly</u>. (hızla arttı)</td></tr>
<tr><td>The test was <u>easy</u>. (be + sıfat)</td><td>She passed the test <u>easily</u>.</td></tr></table>
<p>Zarflar fiilleri, sıfatları, başka zarfları ve bütün cümleyi niteleyebilir:</p>
${EX('The results were <u>surprisingly</u> good. / <u>Unfortunately</u>, the project failed.','Sonuçlar şaşırtıcı derecede iyiydi. / Ne yazık ki proje başarısız oldu.')}

<h3>2. Sıfatın yeri</h3>
<ul><li>İsimden <b>önce</b>: an <u>important</u> decision</li>
<li><b>be, become, seem, appear, look, remain, get, feel, sound, taste</b> fiillerinden sonra (bunlar "durum" fiilleridir, arkalarına zarf değil sıfat gelir):<br><i>She seems <u>happy</u>. The food tastes <u>good</u>. The situation remained <u>stable</u>.</i></li></ul>
${TRAP('"feel bad" doğrudur, "feel badly" yanlıştır. "look good" (iyi görünmek) ≠ "look well" (sağlıklı görünmek).')}

<h3>3. Zarf yapma ve düzensiz zarflar</h3>
<table class="t"><tr><th>Kural</th><th>Örnek</th></tr>
<tr><td>Sıfat + ly</td><td>quick → quickly, significant → significantly</td></tr>
<tr><td>-y → -ily</td><td>easy → easily, heavy → heavily</td></tr>
<tr><td>-le → -ly</td><td>possible → possibly, simple → simply</td></tr>
<tr><td>-ic → -ically</td><td>basic → basically, dramatic → dramatically</td></tr>
<tr><td>Düzensiz: sıfatla aynı</td><td>fast, hard, early, late, high, low, far, straight</td></tr>
<tr><td>Düzensiz: farklı</td><td>good → <b>well</b></td></tr></table>
${TRAP('<b>hard</b> = sıkı / zor, <b>hardly</b> = neredeyse hiç. <b>late</b> = geç, <b>lately</b> = son zamanlarda. <b>high</b> = yüksek, <b>highly</b> = son derece. Anlamları tamamen farklıdır!')}
${EX('He works <u>hard</u>. ≠ He <u>hardly</u> works.','Çok çalışır. ≠ Neredeyse hiç çalışmaz.')}
${TIP('-ly ile biten her kelime zarf değildir: <b>friendly, lovely, lonely, costly, likely, elderly</b> sıfattır.')}

<h3>4. -ed ve -ing sıfatlar</h3>
<p><b>-ing</b>: bir şeyin <b>etkisi</b> (neden olan). <b>-ed</b>: kişinin <b>hissettiği</b> (etkilenen).</p>
<table class="t"><tr><th>-ing (etkileyen)</th><th>-ed (etkilenen)</th></tr>
<tr><td>The lesson was <u>boring</u>. (Ders sıkıcıydı.)</td><td>The students were <u>bored</u>. (Öğrenciler sıkılmıştı.)</td></tr>
<tr><td>an <u>interesting</u> book</td><td>I am <u>interested</u> in history.</td></tr>
<tr><td><u>surprising</u> results</td><td>Scientists were <u>surprised</u>.</td></tr>
<tr><td><u>alarming</u> rate</td><td>Experts are <u>alarmed</u>.</td></tr></table>

<h3>5. Sıfat sıralaması (birden fazla sıfat)</h3>
<p>Görüş → boyut → yaş → şekil → renk → köken → malzeme → amaç + İSİM</p>
${EX('a <u>beautiful old Turkish</u> carpet','güzel, eski bir Türk halısı')}

<h3>6. too / enough / very</h3>
<table class="t"><tr><th>Yapı</th><th>Anlam</th><th>Örnek</th></tr>
<tr><td>very + sıfat</td><td>çok (sadece vurgu)</td><td>very difficult</td></tr>
<tr><td><b>too</b> + sıfat (+ to V)</td><td>gereğinden fazla, olumsuz sonuç</td><td>The box is <u>too heavy to</u> lift. (Kaldırılamayacak kadar ağır.)</td></tr>
<tr><td>sıfat + <b>enough</b> (+ to V)</td><td>yeterince</td><td>He is <u>old enough to</u> vote.</td></tr>
<tr><td><b>enough</b> + isim</td><td>yeterli</td><td><u>enough money</u></td></tr></table>
${TRAP('enough <b>sıfattan sonra</b>, ismin <b>önüne</b> gelir: <i>big enough</i> ama <i>enough time</i>.')}

<h3>7. so / such (o kadar … ki)</h3>
<table class="t"><tr><th>Yapı</th><th>Örnek</th></tr>
<tr><td><b>so</b> + sıfat/zarf + that</td><td>The test was <u>so difficult that</u> many failed.</td></tr>
<tr><td><b>such</b> (a/an) + (sıfat) + isim + that</td><td>It was <u>such a difficult test that</u> many failed.</td></tr>
<tr><td><b>so</b> many/much/few/little + isim + that</td><td>There were <u>so many</u> people <u>that</u> we couldn't enter.</td></tr></table>

<h3>8. Akademik metinlerde sık görülen zarf türleri</h3>
<table class="t"><tr><th>Görev</th><th>Zarflar</th></tr>
<tr><td>Derece</td><td>extremely, highly, relatively, fairly, slightly, considerably, significantly</td></tr>
<tr><td>Sıklık</td><td>always, usually, often, frequently, occasionally, rarely, seldom, never</td></tr>
<tr><td>Olasılık / tutum</td><td>probably, possibly, presumably, apparently, obviously, clearly, surprisingly</td></tr>
<tr><td>Zaman</td><td>recently, currently, previously, eventually, subsequently, initially</td></tr></table>
${TIP('Sıklık zarfları normal fiilden önce, "be"den sonra gelir: <i>He <u>often</u> works late. / He is <u>often</u> late.</i>')}`,
qs:[
QW('The number of tourists visiting the city has increased ---- in recent years.',['dramatic','dramatically','drama','dramatize','dramatics'],'B','"has increased" fiilini niteleyen kelime zarf olmalı → dramatically.',['dramatic sıfattır, fiili nitelemez.',null,'drama isimdir.','dramatize fiildir.','dramatics isimdir.']),
QW('Many students felt ---- after the long and difficult exam.',['exhausting','exhaustion','exhausted','exhaustedly','exhaust'],'C','"felt" durum fiilidir, arkasından sıfat gelir. Öğrenciler yorgunluğu hissedenler (etkilenen) → -ed: exhausted.',['exhausting "yorucu" demektir, sınavı nitelerdi; öğrenciler yorucu değil yorgun.','exhaustion isimdir.',null,'"feel" sonrasında zarf gelmez.','exhaust fiildir.']),
QW('The water was ---- polluted to drink, so the villagers had to buy bottled water.',['enough','very','so','too','such'],'D','"… içilemeyecek kadar kirli" → too + sıfat + to V.',['enough sıfattan sonra gelir ve "yeterince" demektir; anlam ters olur.','very + sıfat + to V yapısı yoktur.','so … that yapısı gerekir; "to drink" ile kullanılmaz.',null,'such sıfattan önce değil "such a/an + isim" olarak kullanılır.']),
QW('It was ---- important discovery that the scientists won the Nobel Prize.',['so','such an','too','such','so an'],'B','"an important discovery" bir isim öbeği; isimle birlikte "such a/an + sıfat + isim + that".',['"so" isimle değil sıfatla kullanılır (so important that).',null,'too "to V" ister, "that" değil.','Tekil sayılabilen isim olduğu için "an" gerekir: such an.','"so an" diye bir yapı yoktur.']),
QW('Although he trained ----, he ---- won any races last season.',['hardly / hard','hard / hardly','hardly / hardly','hard / hard','harder / hard'],'B','"Sıkı antrenman yapmasına rağmen neredeyse hiç yarış kazanmadı" → trained hard, hardly won.',['Sıralama ters: "hardly trained" neredeyse hiç antrenman yapmadı demek olur, although ile zıtlık kalmaz.',null,'"hardly trained" anlamı bozar.','"hard won any races" anlamsızdır.','"harder" karşılaştırma ister ve ikinci boşluk anlamsız.']),
QW('The new treatment seems ---- in reducing the symptoms of the disease.',['effectively','effect','effective','effectiveness','affect'],'C','"seem" durum fiilidir; arkasından sıfat gelir → effective (etkili).',['seem sonrasında zarf gelmez.','effect isimdir (etki).',null,'effectiveness isimdir (etkililik).','affect fiildir (etkilemek).'])]},

{id:'fiil',grp:'temel',t:'Fiiller ve Yardımcı Fiiller',en:'Verbs & Auxiliaries',s:'be / have / do, düzensiz fiiller (V1-V2-V3), geçişli-geçişsiz fiiller',body:`
<h3>1. Fiilin üç hali: V1 – V2 – V3</h3>
<p>Bütün zamanlar ve edilgen yapı bu üç halden kurulur. Düzenli fiillerde V2 ve V3 <b>-ed</b> ile yapılır; düzensiz fiiller ezberlenir.</p>
<table class="t"><tr><th>V1 (yalın)</th><th>V2 (geçmiş)</th><th>V3 (perfect / edilgen)</th><th>Anlam</th></tr>
<tr><td>work</td><td>worked</td><td>worked</td><td>çalışmak (düzenli)</td></tr>
<tr><td>be</td><td>was / were</td><td>been</td><td>olmak</td></tr>
<tr><td>have</td><td>had</td><td>had</td><td>sahip olmak</td></tr>
<tr><td>do</td><td>did</td><td>done</td><td>yapmak</td></tr>
<tr><td>begin</td><td>began</td><td>begun</td><td>başlamak</td></tr>
<tr><td>bring</td><td>brought</td><td>brought</td><td>getirmek</td></tr>
<tr><td>build</td><td>built</td><td>built</td><td>inşa etmek</td></tr>
<tr><td>choose</td><td>chose</td><td>chosen</td><td>seçmek</td></tr>
<tr><td>find</td><td>found</td><td>found</td><td>bulmak</td></tr>
<tr><td>found</td><td>founded</td><td>founded</td><td>kurmak (düzenli!)</td></tr>
<tr><td>grow</td><td>grew</td><td>grown</td><td>büyümek</td></tr>
<tr><td>lead</td><td>led</td><td>led</td><td>yol açmak, yönetmek</td></tr>
<tr><td>lie</td><td>lay</td><td>lain</td><td>uzanmak, bulunmak</td></tr>
<tr><td>lay</td><td>laid</td><td>laid</td><td>yatırmak, sermek</td></tr>
<tr><td>rise</td><td>rose</td><td>risen</td><td>yükselmek (nesnesiz)</td></tr>
<tr><td>raise</td><td>raised</td><td>raised</td><td>yükseltmek (nesneli, düzenli)</td></tr>
<tr><td>seek</td><td>sought</td><td>sought</td><td>aramak</td></tr>
<tr><td>spread</td><td>spread</td><td>spread</td><td>yaymak, yayılmak</td></tr>
<tr><td>take</td><td>took</td><td>taken</td><td>almak</td></tr>
<tr><td>teach</td><td>taught</td><td>taught</td><td>öğretmek</td></tr>
<tr><td>think</td><td>thought</td><td>thought</td><td>düşünmek</td></tr>
<tr><td>understand</td><td>understood</td><td>understood</td><td>anlamak</td></tr>
<tr><td>write</td><td>wrote</td><td>written</td><td>yazmak</td></tr>
<tr><td>show</td><td>showed</td><td>shown</td><td>göstermek</td></tr>
<tr><td>fall</td><td>fell</td><td>fallen</td><td>düşmek</td></tr>
<tr><td>feel</td><td>felt</td><td>felt</td><td>hissetmek</td></tr>
<tr><td>keep</td><td>kept</td><td>kept</td><td>tutmak</td></tr>

${TRAP('<b>rise</b> (yükselmek, nesne almaz) / <b>raise</b> (yükseltmek, nesne alır): <i>Prices <u>rose</u>. / The government <u>raised</u> taxes.</i> <b>lie</b> (bulunmak) / <b>lay</b> (koymak): <i>The problem <u>lies</u> in the design.</i> <b>find – found – found</b> ama <b>found – founded – founded</b> (kurmak).')}

<h3>2. Yardımcı fiiller: be, have, do</h3>
<table class="t"><tr><th>Yardımcı</th><th>Görevi</th><th>Örnek</th></tr>
<tr><td><b>be</b> + V-ing</td><td>Sürekli zamanlar</td><td>They <u>are working</u>.</td></tr>
<tr><td><b>be</b> + V3</td><td>Edilgen</td><td>The bridge <u>was built</u> in 1990.</td></tr>
<tr><td><b>have</b> + V3</td><td>Perfect zamanlar</td><td>She <u>has finished</u>.</td></tr>
<tr><td><b>do / does / did</b> + V1</td><td>Olumsuz, soru, vurgu</td><td>He <u>didn't</u> come. I <u>do</u> believe you.</td></tr>
<tr><td><b>Kipler</b> (can, must…) + V1</td><td>Yetenek, zorunluluk, olasılık</td><td>You <u>must</u> leave.</td></tr></table>

<h3>3. Geçişli ve geçişsiz fiiller</h3>
<p><b>Geçişli</b> fiiller nesne alır (neyi? kimi?): build, cause, reduce, affect. <b>Geçişsiz</b> fiiller nesne almaz: occur, happen, arise, emerge, exist, appear, disappear, rise, fall, die, remain.</p>
${TRAP('Geçişsiz fiiller <b>edilgen yapılamaz</b>. "was occurred", "has been happened", "were emerged" her zaman yanlıştır. Bu YDS\'nin en sevdiği tuzaklardan biri.')}

<h3>4. Durum fiilleri (stative verbs)</h3>
<p>Bir eylemi değil durumu anlatan fiiller genelde sürekli (-ing) zamanda kullanılmaz:</p>

${EX('The book <u>contains</u> ten chapters. (is containing değil)','Kitap on bölüm içerir.')}

<h3>5. Fiil + edat kalıpları</h3>
<p>Bazı fiiller belirli bir edatla kullanılır. Bunlar <b>Edatlar ve Kalıplar</b> konusunda ayrıntılı var. En sıklar: depend <u>on</u>, consist <u>of</u>, result <u>in</u>, contribute <u>to</u>, rely <u>on</u>, focus <u>on</u>, deal <u>with</u>, suffer <u>from</u>, protect <u>from</u>, prevent <u>from</u>.</p>

<h3>6. Fiil + nesne + fiil kalıpları</h3>
<table class="t"><tr><th>Kalıp</th><th>Fiiller</th><th>Örnek</th></tr>
<tr><td>fiil + nesne + <b>to V</b></td><td>allow, enable, encourage, force, require, cause, ask, advise, want</td><td>The law <u>allows</u> workers <u>to take</u> leave.</td></tr>
<tr><td>fiil + nesne + <b>V1</b></td><td>make, let, have, help (help to da olur)</td><td>The teacher <u>made</u> us <u>repeat</u> the exercise.</td></tr>
<tr><td>fiil + nesne + <b>from -ing</b></td><td>prevent, stop, keep, discourage, prohibit</td><td>Rain <u>prevented</u> us <u>from leaving</u>.</td></tr></table>`,
