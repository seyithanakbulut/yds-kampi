/* şıkların yerini karıştır (doğru cevap hep aynı harfte olmasın); I-V gibi sıralı şıklar hariç */
function shuffleQ(q){if(!q||q.o.length<2||/^(I|II|III|IV|V)$/.test(q.o[0]))return q;
  const idx=shuffle(q.o.map((_,i)=>i));
  return Object.assign({},q,{o:idx.map(i=>q.o[i]),a:idx.indexOf(q.a),why:q.why?idx.map(i=>q.why[i]):q.why});}
function startQuiz(title,qs,opt={}){
  qs=qs.map(shuffleQ);
  st.quiz={title,qs,i:0,ans:Array(qs.length).fill(null),exam:!!opt.exam,back:opt.back,sub:opt.sub,gr:opt.gr,deadline:opt.min?Date.now()+opt.min*60000:null,plan:opt.plan};
  st.res=null;render();window.scrollTo(0,0);
}
function tick(){clearInterval(timerId);const el=()=>document.getElementById('timer');
  const f=()=>{const q=st.quiz;if(!q||!q.deadline){clearInterval(timerId);return;}const ms=q.deadline-Date.now();if(ms<=0){clearInterval(timerId);finishQuiz();return;}const m=Math.floor(ms/60000),s=Math.floor(ms%60000/1000);const e=el();if(e){e.textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;e.classList.toggle('low',ms<120000);}};
  f();timerId=setInterval(f,1000);}
function viewQuiz(){
  const z=st.quiz;const q=z.qs[z.i];const a=z.ans[z.i];const reveal=!z.exam&&a!==null;
  const opts=q.o.map((o,j)=>{let c='opt';if(reveal){if(j===q.a)c+=' right';else if(j===a)c+=' wrong';}else if(a===j)c+=' sel';
    return `<button class="${c}" data-act="ans" data-j="${j}" ${reveal?'disabled':''}><span class="bub">${L[j]}</span><span>${esc(o)}</span></button>`}).join('');
  const typeName=(TYPES.find(t=>t.id===q.k)||{}).name||'';
  return `<div class="qhead"><button class="btn ghost" data-act="quit">← Çık</button><span class="muted">${esc(z.title)}</span>${z.deadline?`<span class="timer" id="timer">--:--</span>`:`<span class="muted mono" style="font-size:.85rem">${z.i+1} / ${z.qs.length}</span>`}</div>
  <div class="progress"><i style="width:${(z.ans.filter(x=>x!==null).length)/z.qs.length*100}%"></i></div>
  ${z.exam?`<div class="card"><div class="row between" style="margin-bottom:8px"><span class="eyebrow">Optik form</span><span class="muted mono" style="font-size:.8rem">${z.ans.filter(x=>x!==null).length}/${z.qs.length} işaretli</span></div><div class="optik">${z.qs.map((_,k)=>`<button class="${z.ans[k]!==null?'done':''} ${k===z.i?'cur':''}" data-act="jump" data-k="${k}" aria-label="Soru ${k+1}"><b>${k+1}</b>${z.ans[k]!==null?L[z.ans[k]]:'·'}</button>`).join('')}</div></div>`:''}
  <div class="card" style="display:flex;flex-direction:column;gap:14px">
    <div class="row between"><span class="tag">${z.i+1}. soru${typeName?' · '+typeName:''}</span></div>
    ${q.p?`<div class="passage">${esc(q.p)}</div>`:''}
    <div class="qtext">${esc(q.q)}</div>
    <div class="opts">${opts}</div>
    ${reveal?`<div class="expl">${explHTML(q,a,true)}</div>`:''}
  </div>
  <div class="row between">
    ${z.exam?`<button class="btn" data-act="prev" ${z.i===0?'disabled':''}>← Önceki</button>`:'<span></span>'}
    <div class="row">
    ${z.exam&&z.i<z.qs.length-1?`<button class="btn" data-act="next">Sonraki →</button>`:''}
    ${z.exam?`<button class="btn primary" data-act="finish">Denemeyi bitir</button>`:(reveal?`<button class="btn primary" data-act="next">${z.i<z.qs.length-1?'Sonraki soru →':'Sonuçları gör'}</button>`:'')}
    </div></div>`;
}
function finishQuiz(){
  const z=st.quiz;clearInterval(timerId);
  let c=0;z.qs.forEach((q,i)=>{if(z.ans[i]===q.a)c++;if(z.exam&&z.ans[i]!==null)stat(q.k,z.ans[i]===q.a);});
  const p=Math.round(c/z.qs.length*100*100)/100;
  if(z.gr){S.gr[z.gr]=c;}
  if(z.exam){S.hist.push({d:today(),name:z.title,c,n:z.qs.length,p:Math.round(c/z.qs.length*100)});}
  touch();save();
  st.res={z,c,p};render();window.scrollTo(0,0);
}
function viewResult(){
  const {z,c}=st.res;const n=z.qs.length;const pct=Math.round(c/n*100);
  const by={};z.qs.forEach((q,i)=>{const b=by[q.k]||(by[q.k]={c:0,t:0});b.t++;if(z.ans[i]===q.a)b.c++;});
  const wrong=z.qs.map((q,i)=>({q,i,a:z.ans[i]})).filter(x=>x.a!==x.q.a);
  const msg=pct>=80?'Çok iyi, bu tempoyla devam.':pct>=60?'İyi gidiyor. Yanlışlarının açıklamalarını oku.':pct>=40?'Temel oturuyor. Zayıf konulara geri dön.':'Başlangıç için normal. Önce kelime ve bağlaçlara ağırlık ver.';
  return `<div><div class="eyebrow">${esc(z.title)} · Sonuç</div><h1>${msg}</h1></div>
  <div class="card score"><div><div class="big">${c}<span class="muted" style="font-size:1.4rem">/${n}</span></div><span class="muted">doğru</span></div>
  ${z.exam?`<div><div class="big">${pct}</div><span class="muted">80 soruya oranlanmış tahmini YDS puanı</span></div>`:`<div><div class="big">%${pct}</div><span class="muted">başarı</span></div>`}</div>
  ${Object.keys(by).length>1?`<div class="card"><h2>Bölüm bazında</h2><div class="dist" style="margin-top:10px">${Object.entries(by).map(([k,b])=>`<div class="r"><span>${(TYPES.find(t=>t.id===k)||{}).name||k}</span><span class="track"><i style="width:${b.c/b.t*100}%;background:${b.c/b.t>=.6?'var(--ok)':b.c/b.t>=.4?'var(--warn)':'var(--bad)'}"></i></span><span class="n">${b.c}/${b.t}</span></div>`).join('')}</div></div>`:''}
  ${wrong.length?`<div><h2 style="margin-bottom:10px">Yanlış ve boş bıraktıkların (${wrong.length})</h2><div class="review">${wrong.map(x=>`<div class="item"><div class="row"><span class="tag">${x.i+1}. soru</span><span class="tag ${x.a===null?'':'bad'}">${x.a===null?'Boş':'Senin cevabın: '+L[x.a]}</span><span class="tag ok">Doğru: ${L[x.q.a]}</span></div>${x.q.p?`<details><summary class="muted" style="cursor:pointer">Paragrafı göster</summary><div class="passage" style="margin-top:6px">${esc(x.q.p)}</div></details>`:''}<div class="qtext" style="font-size:1rem">${esc(x.q.q)}</div><div><b>${L[x.q.a]})</b> ${esc(x.q.o[x.q.a])}</div><div class="expl">${explHTML(x.q,x.a,false)}</div></div>`).join('')}</div></div>`:''}
  <div class="row"><button class="btn primary" data-act="retry">Tekrar dene</button><button class="btn" data-act="go" data-v="${z.back||'ana'}">Geri dön</button></div>`;
}

/* ===================== İLERLEME ===================== */
function viewProgress(){
  const boxes=[0,0,0,0];WORDS.forEach(w=>{const b=box(w.en);boxes[b<0?0:b<2?1:b<3?2:3]++;});
  const labels=['Yeni','Öğreniliyor','Pekişiyor','Öğrenildi'];const cols=['var(--line)','var(--warn)','var(--accent)','var(--ok)'];
  const h=S.hist.slice(-12);
  return `<div><div class="eyebrow">İlerleme</div><h1>Nerede olduğun</h1></div>
  <div class="card"><h2>Kelimeler</h2><p class="muted" style="margin:4px 0 12px">${WORDS.length} kelimeden ${boxes[3]} tanesi öğrenildi (3 kez üst üste bilindi).</p>
  <div style="display:flex;height:16px;border-radius:4px;overflow:hidden;background:var(--surface-2)">${boxes.map((b,i)=>`<i style="width:${b/WORDS.length*100}%;background:${cols[i]}"></i>`).join('')}</div>
  <div class="row" style="margin-top:10px;font-size:.85rem;gap:16px">${boxes.map((b,i)=>`<span class="row" style="gap:6px"><i class="dot" style="background:${cols[i]}"></i>${labels[i]}: <b class="mono">${b}</b></span>`).join('')}</div></div>
  <div class="card"><h2>Soru tiplerinde başarın</h2><div class="dist" style="margin-top:12px">${TYPES.map(t=>{const s=S.stats[t.id];const r=s?s.c/s.t:0;return `<div class="r"><span>${t.name}</span><span class="track"><i style="width:${r*100}%;background:${r>=.6?'var(--ok)':r>=.4?'var(--warn)':'var(--bad)'}"></i></span><span class="n">${s?`%${Math.round(r*100)} · ${s.t}`:'—'}</span></div>`}).join('')}</div></div>
  ${h.length?`<div class="card"><h2>Deneme puanları</h2>${chart(h)}</div>`:''}
  <div class="card" style="display:flex;flex-direction:column;gap:10px"><h2>Yedekleme</h2>
  <p class="muted">İlerlemen bu tarayıcıda saklanıyor. Telefon değiştirirsen ya da tarayıcı verilerini silersen kaybolur. Aşağıdaki kodu kopyalayıp bir yere kaydet, gerektiğinde geri yükle.</p>
  <textarea id="bk" aria-label="Yedek kodu" readonly>${esc(JSON.stringify(S))}</textarea>
  <div class="row"><button class="btn" data-act="copy">Kopyala</button></div>
  <textarea id="imp" aria-label="Geri yüklenecek kod" placeholder="Yedek kodunu buraya yapıştır"></textarea>
  <div class="row"><button class="btn" data-act="import">Geri yükle</button><button class="btn ghost" data-act="reset" style="color:var(--bad)">Tüm ilerlemeyi sıfırla</button></div></div>`;
}
function chart(h){
  const W=600,H=180,pl=34,pr=12,pt=12,pb=26;const n=h.length;
  const x=i=>pl+(n===1?(W-pl-pr)/2:i*(W-pl-pr)/(n-1));const y=v=>pt+(1-v/100)*(H-pt-pb);
  const grid=[0,25,50,75,100].map(v=>`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${v}</text>`).join('');
  const pts=h.map((d,i)=>`${x(i)},${y(d.p)}`).join(' ');
  return `<div class="tablewrap"><svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:320px;height:auto;margin-top:10px" role="img" aria-label="Deneme puanları grafiği">${grid}<polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2.5"/>${h.map((d,i)=>`<circle cx="${x(i)}" cy="${y(d.p)}" r="${i===n-1?5:3.5}" fill="var(--accent)"/>`).join('')}<text x="${x(n-1)}" y="${y(h[n-1].p)-10}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">${h[n-1].p}</text></svg></div>`;
}

/* ===================== OLAYLAR ===================== */
const ACT={
 go:d=>go(d.v),
 cat:d=>{st.wset=0;go('kelime',d.c)},
 topic:d=>{st.step=0;go('gramer',d.id)},
 step:d=>{st.step=+d.k;render();window.scrollTo(0,0)},
 stepmode:()=>{st.allSteps=!st.allSteps;render()},
 type:d=>go('soru',d.id),
 say:d=>speak(d.t),
 term:d=>showTerm(d.k),
 closesheet:()=>{const s=document.getElementById('sheet');if(s)s.hidden=true;},
 glossary:()=>{const s=document.getElementById('sheet');if(s)s.hidden=true;st.step=0;st.allSteps=false;go('gramer','terimler');},
 wset:d=>{st.wset=+d.k;render()},
 'back-words':()=>{const s=st.study;st.study=null;if(s&&s.cid!=='all'){st.v='kelime';st.sub=s.cid;st.wset=s.s===''||s.s==null?0:+s.s;render();window.scrollTo(0,0)}else go('kelime')},
 study:d=>startStudy(d.c,d.s),
 flip:()=>{st.study.flip=true;render()},
 rate:d=>rate(+d.r),
 wquiz:d=>{const c=CATS.find(x=>x.id===d.c);startQuiz(c.name+(d.s!=null&&d.s!==''?' · Set '+(+d.s+1):'')+' testi',vocabSet(setPool(d.c,d.s),10),{back:'kelime',sub:d.c})},
 tquiz:d=>{const g=GR.find(x=>x.id===d.id);startQuiz(g.t+' testi',g.qs.map(q=>Object.assign({k:'gramer'},q)),{back:'gramer',gr:g.id})},
 typequiz:d=>{const t=TYPES.find(x=>x.id===d.id);const qs=t.gen?vocabSet(WORDS,10):(t.id==='cloze'||t.id==='okuma'?t.qs:shuffle(t.qs));startQuiz(t.name,qs.map(q=>Object.assign({k:t.id},q)),{back:'soru'})},
 exam:d=>{const qs=buildExam(d.p);startQuiz(PLANS[d.p].name,qs,{exam:true,min:Math.round(qs.length*2.25),back:'deneme',plan:d.p})},
 ans:d=>{const z=st.quiz;const j=+d.j;if(!z.exam&&z.ans[z.i]!==null)return;z.ans[z.i]=j;if(!z.exam){stat(z.qs[z.i].k,j===z.qs[z.i].a);touch();save();}render()},
 next:()=>{const z=st.quiz;if(z.i<z.qs.length-1){z.i++;render();window.scrollTo(0,0)}else finishQuiz()},
 prev:()=>{const z=st.quiz;if(z.i>0){z.i--;render()}},
 jump:d=>{st.quiz.i=+d.k;render()},
 finish:()=>finishQuiz(),
 quit:()=>{const b=st.quiz.back||'ana';const w=st.wset;go(b,st.quiz.sub||st.sub);st.wset=w;render()},
 retry:()=>{const z=st.res.z;if(z.plan){ACT.exam({p:z.plan})}else{startQuiz(z.title,z.qs.map(q=>q.k==='kelime'&&!z.gr&&WMAP[q.o[q.a]]?makeVocabQ(WMAP[q.o[q.a]])||q:q),{back:z.back,sub:z.sub,gr:z.gr})}},
 copy:()=>{const t=document.getElementById('bk');const ok=()=>toast('Kopyalandı');try{navigator.clipboard.writeText(t.value).then(ok,()=>{t.select();toast('Metni seçtim, kopyala')})}catch(e){t.select();toast('Metni seçtim, kopyala')}},
 import:()=>{const v=document.getElementById('imp').value.trim();try{const o=JSON.parse(v);if(!o.srs)throw 0;S=Object.assign(blank(),o);save();toast('İlerleme geri yüklendi');render()}catch(e){toast('Kod okunamadı, tamamını yapıştırdığından emin ol')}},
 reset:d=>{const b=document.querySelector('[data-act="reset"]');if(b.dataset.sure){S=blank();save();toast('Sıfırlandı');render()}else{b.dataset.sure='1';b.textContent='Emin misin? Tekrar bas';}}
};
document.addEventListener('click',e=>{if(e.target.id==='sheet'){e.target.hidden=true;return;}const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const f=ACT[b.dataset.act];if(f)f(b.dataset);});
document.addEventListener('input',e=>{
  if(e.target.id!=='wsearch')return;
  const v=e.target.value.trim().toLocaleLowerCase('tr');const box=document.getElementById('wresults');
  if(v.length<2){box.innerHTML='';return;}
  const r=WORDS.filter(w=>w.en.toLowerCase().includes(v)||w.tr.toLocaleLowerCase('tr').includes(v)).slice(0,40);
  box.innerHTML=r.length?wordTable(r):`<p class="muted">"${esc(v)}" için sonuç yok.</p>`;
});
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='TEXTAREA'||e.target.tagName==='INPUT')return;
  if(st.study&&st.study.i<st.study.q.length){
    if(e.code==='Space'&&!st.study.flip){e.preventDefault();ACT.flip();}
    else if(st.study.flip&&['1','2','3'].includes(e.key))rate(+e.key-1);
  }else if(st.quiz&&!st.res){
    const k='abcde'.indexOf(e.key.toLowerCase());if(k>=0&&k<st.quiz.qs[st.quiz.i].o.length)ACT.ans({j:k});
    else if(e.key==='Enter'||e.key==='ArrowRight'){const z=st.quiz;if(z.exam||z.ans[z.i]!==null)ACT.next();}
    else if(e.key==='ArrowLeft'&&st.quiz.exam)ACT.prev();
  }
});
if(canSpeak){try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{};}catch(e){}}
const h0=location.hash.slice(1);st.v=NAV.some(n=>n[0]===h0)?h0:'ana';render();
</script>
