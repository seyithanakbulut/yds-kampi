const V2_PAIRED={id:'paired',grp:'yds',v2:true,t:'Çift Bağlaçlar ve Devrik Yapı',en:'Paired Conjunctions & Inversion',s:'both…and, either…or, neither…nor, not only…but also; Never have I…, Only after…, Not until…, So … that',
body:`
<h3>Önce büyük resim</h3>
${TALK('Bu derste iki konu var:<br><br><b>1. Çift bağlaçlar:</b> İki parçadan oluşan bağlaçlar: "<i>hem … hem de</i>", "<i>ya … ya da</i>", "<i>ne … ne de</i>". Türkçedekiyle neredeyse birebir aynı mantık. YDS\'de doğru eşleşmeyi (both–and, neither–nor) ve fiil uyumunu sorar.<br><br><b>2. Devrik yapı:</b> Olumsuz ya da kısıtlayıcı bir ifade cümlenin başına gelince yardımcı fiil özneden önce geçer, tıpkı soru cümlesi gibi: <i>Never <b>have I</b> seen…</i> Anlam değişmez, sadece vurgu güçlenir. YDS bunu gramer ve özellikle "<b>anlamca en yakın cümle</b>" sorularında çok sever.')}

<h3>1. Çift bağlaçlar tablosu</h3>
${FORM('',['Yapı','Anlam','Örnek','Türkçesi'],[
['<b>both</b> A <b>and</b> B','hem A hem B','The policy benefits <u>both</u> consumers <u>and</u> producers.','Politika hem tüketicilere hem üreticilere yarar.'],
['<b>either</b> A <b>or</b> B','ya A ya B','You can pay <u>either</u> in cash <u>or</u> by card.','Ya nakit ya kartla ödeyebilirsin.'],
['<b>neither</b> A <b>nor</b> B','ne A ne B','<u>Neither</u> the students <u>nor</u> the teacher knew.','Ne öğrenciler ne öğretmen biliyordu.'],
['<b>not only</b> A <b>but (also)</b> B','sadece A değil, B de','He is <u>not only</u> a doctor <u>but also</u> a writer.','Sadece doktor değil, aynı zamanda yazar.'],
['<b>whether</b> A <b>or</b> B','A olsun B olsun','<u>Whether</u> rich <u>or</u> poor, everyone pays tax.','Zengin olsun fakir olsun herkes vergi öder.'],
['<b>not</b> A <b>but</b> B','A değil B','The problem is <u>not</u> money <u>but</u> time.','Sorun para değil, zaman.'],
['<b>rather</b> A <b>than</b> B','B\'den ziyade A','—','—']])}
${WR('Neither the students or the teacher knew.','Neither the students <b>nor</b> the teacher knew.','')}
${WR('Both the minister or his deputy attended.','Both the minister <b>and</b> his deputy attended.','')}
${TALK('"neither … nor" zaten olumsuz bir anlam taşır. Cümlede ayrıca <b>not</b> kullanılmaz: <i>Neither he nor I <u>was</u> there</i> (wasn\'t ✘).')}

<h3>2. Çift bağlaçlarda fiil uyumu</h3>
${FORM('',['Bağlaç','Fiil neye uyar?','Örnek'],[
['<b>both</b> A <b>and</b> B','Her zaman <b>çoğul</b>','Both the teacher and the students <u>are</u> here.'],
['<b>either</b> … <b>or</b> / <b>neither</b> … <b>nor</b>','<b>Yakındaki</b> özneye (B\'ye)','Neither the manager nor the <u>workers were</u> informed.<br>Neither the workers nor the <u>manager was</u> informed.'],
['<b>not only</b> … <b>but also</b>','<b>Yakındaki</b> özneye','Not only the students but also the <u>teacher was</u> late.']])}

<h3>3. Paralel yapı</h3>
${TALK('Çift bağlacın iki tarafı <b>aynı türde</b> olmalıdır: iki isim, iki sıfat, iki to V, iki -ing. Karışık olmaz.')}
${WR('She is both intelligent and works hard.','She is both <b>intelligent</b> and <b>hard-working</b>.','sıfat + sıfat')}
${WR('He likes not only reading but also to write.','He likes not only <b>reading</b> but also <b>writing</b>.','-ing + -ing')}

<h3>4. Devrik yapı nedir?</h3>
${TALK('Normal cümlede sıra <b>özne + yardımcı fiil + fiil</b>dir: <i>I have never seen</i>.<br>Devrik cümlede olumsuz/kısıtlayıcı ifade başa geçer ve <b>yardımcı fiil + özne + fiil</b> olur: <i>Never <b>have I</b> seen</i>.<br><br>Türkçede bunun karşılığı yok; çeviride normal cümle gibi çevrilir, sadece vurgu katılır.')}
${FORM('Normal ve devrik',['Normal','Devrik'],[
['I <b>have</b> never seen such a storm.','Never <b>have I</b> seen such a storm.'],
['The drug <b>reduces</b> pain and speeds up recovery.','Not only <b>does the drug reduce</b> pain, but it also speeds up recovery.'],
['They <b>realised</b> the mistake only after the test.','Only after the test <b>did they realise</b> the mistake.']])}

<h3>5. Devrik yapı nasıl kurulur? İki kural</h3>
${FORM('',['Durum','Ne yaparsın?','Örnek'],[
['Cümlede yardımcı fiil <b>var</b> (have, be, can, will, should…)','Yardımcı fiili öznenin önüne al','I <u>have</u> never seen → Never <u>have I</u> seen'],
['Yardımcı fiil <b>yok</b> (geniş zaman / geçmiş zaman)','<b>do / does / did</b> ekle, ana fiili yalın yap','It <u>reduces</u> → Not only <u>does it reduce</u><br>They <u>realised</u> → Only then <u>did they realise</u>']])}
${WR('Never I have seen such a storm.','Never <b>have I</b> seen such a storm.','')}
${WR('Not only it reduces pain, …','Not only <b>does it reduce</b> pain, …','')}

<h3>6. Devrik yapı isteyen başlangıçlar</h3>
${FORM('Ezberlenecek liste',['Başlangıç','Örnek','Türkçesi'],[
['<b>Never / Never before</b>','Never before <u>have scientists observed</u> such rapid warming.','Bilim insanları daha önce hiç bu kadar hızlı bir ısınma gözlemlemedi.'],
['<b>Rarely / Seldom</b>','Rarely <u>do we see</u> such talent.','Böyle bir yeteneği nadiren görürüz.'],
['<b>Not only</b> … but also','Not only <u>is it cheap</u>, but it is also reliable.','Sadece ucuz değil, aynı zamanda güvenilir.'],
['<b>No sooner</b> … than','No sooner <u>had he arrived</u> than it started to rain.','O gelir gelmez yağmur başladı.'],
['<b>Hardly / Scarcely</b> … when','Hardly <u>had the film begun</u> when the power went off.','Film başlar başlamaz elektrik kesildi.'],
['<b>Only after / Only when / Only if / Only by / Only then</b>','Only after the test <u>did they realise</u> the mistake.','Hatayı ancak testten sonra fark ettiler.'],
['<b>Not until</b>','Not until 1934 <u>were Turkish women allowed</u> to vote in national elections.','Türk kadınlarının genel seçimlerde oy kullanmasına ancak 1934\'te izin verildi.'],
['<b>Under no circumstances / On no account / In no way</b>','Under no circumstances <u>should you open</u> the door.','Hiçbir koşulda kapıyı açmamalısın.'],
['<b>Little</b>','Little <u>did they know</u> what would happen.','Ne olacağını hiç bilmiyorlardı.'],
['<b>Nowhere</b>','Nowhere <u>is the problem</u> more serious than in Africa.','Sorun hiçbir yerde Afrika\'dakinden daha ciddi değil.'],
['<b>So</b> + sıfat … that','So difficult <u>was the test</u> that many failed.','Sınav o kadar zordu ki pek çok kişi kaldı.'],
['<b>Such</b> … that','Such <u>was the demand</u> that tickets sold out.','Talep o kadar büyüktü ki biletler tükendi.'],
['<b>Should / Were / Had</b> (koşul)','Had I known, I would have come.','Bilseydim gelirdim.']])}
${TRAP('<b>Only after, Only when, Not until</b> ile başlayan cümlelerde devrik kısım <b>ana cümlede</b> olur, ilk kısımda değil:<br><i>Only after <u>he left</u> <b>did I</b> notice.</i> ✔<br><i>Only after <s>did he leave</s> I noticed.</i> ✘')}
${TIP('"Not until … that" (It was not until … that) de çok çıkar ve devrik değildir: <i><u>It was not until</u> 1934 <u>that</u> women were allowed to vote.</i> = Not until 1934 were women allowed to vote.')}

<h3>7. Anlamca en yakın cümle sorularında devrik yapı</h3>
${TALK('YDS\'nin "anlamca en yakın cümle" bölümünde verilen cümle genellikle devrik yapıdadır ve doğru şık onun normal cümle halidir (ya da tersi). Bu eşleşmeleri ezberle:')}
${FORM('',['Devrik / kalıp','Eşdeğeri'],[
['No sooner had A than B / Hardly had A when B','As soon as A, B (A olur olmaz B)'],
['Not until A did B','B only when A / It was not until A that B (B ancak A olunca)'],
['Only by doing A can you B','You can B only if you do A'],
['Never have I seen …','This is the first time I have seen … / I have never seen …'],
['Had I known …','If I had known …'],
['So … was A that B','A was so … that B']])}

<h3>8. so / neither ile kısa cevap</h3>
${FORM('',['Cümle','Kısa onay','Türkçesi'],[
['I like coffee.','<u>So do I</u>.','Ben de (severim).'],
['She has finished.','<u>So have I</u>.','Ben de (bitirdim).'],
['I can\'t swim.','<u>Neither can I</u>. / <u>Nor can I</u>.','Ben de (yüzemem).'],
['He didn\'t come.','<u>Neither did she</u>.','O da (gelmedi).']])}

<h3>9. Birlikte YDS sorusu çözelim</h3>
${SOLVE('Not only ---- the drug reduce pain, but it also speeds up recovery.',['is','does','do','has','did'],'B',[
'Cümle "Not only" ile başlıyor → <b>devrik yapı</b>. Boşluğa yardımcı fiil gelecek.',
'Boşluktan sonra "the drug <b>reduce</b>" var: ana fiil <b>yalın</b>. Demek ki yardımcı fiil <b>do / does / did</b>. A ve D elenir.',
'Özne "the drug" <b>tekil</b>; cümlenin ikinci yarısı "speeds up" <b>geniş zaman</b>. → <b>does</b>. (do çoğul, did geçmiş.)',
'Cevap <b>B) does</b>.'])}
${SOLVE('Only after the results were published ---- the importance of the discovery.',['scientists realised','did scientists realise','scientists did realise','had realised scientists','realised scientists'],'B',[
'Cümle "<b>Only after</b>" ile başlıyor → <b>ana cümle</b> devrik olur.',
'Ana cümlede yardımcı fiil yok (realised) → <b>did + özne + V1</b>: did scientists realise.',
'A ve C normal düzende. D ve E\'de sıralama bozuk.',
'Cevap <b>B</b>.'])}

<h3>10. Özet</h3>
${SUM([
'<b>both–and</b> (çoğul fiil), <b>either–or</b>, <b>neither–nor</b>, <b>not only–but also</b> (fiil yakındaki özneye).',
'İki taraf <b>paralel</b> olmalı: isim + isim, -ing + -ing.',
'Devrik yapı: olumsuz/kısıtlayıcı başlangıç + <b>yardımcı fiil + özne</b>. Yardımcı fiil yoksa <b>do / does / did</b>.',
'Never, Rarely, Seldom, Not only, No sooner…than, Hardly…when, Only after/when/if, Not until, Under no circumstances, Little, So … that.',

const V2_REDUCTION={id:'reduction',grp:'yds',v2:true,t:'Kısaltmalar (Participle Clauses)',en:'Reduced Clauses',s:'V-ing / V3 / having V3; sıfat ve zarf cümleciği kısaltması; sarkan kısaltma tuzağı; sonuç bildiren -ing',
body:`
<h3>Önce büyük resim</h3>
${TALK('Akademik İngilizce <b>kısa ve yoğun</b> yazmayı sever. Bu yüzden "who are working", "which was built", "after they had finished" gibi uzun yan cümleler sık sık kısaltılır: <b>working</b>, <b>built</b>, <b>having finished</b>.<br><br>Bu kısaltmaları tanıyamazsan YDS cümleleri sana anlamsız gelir; çünkü bir cümlede iki fiil varmış gibi görünür. Bu derste kısaltmaları <b>tanımayı</b> ve doğru biçimi <b>seçmeyi</b> öğreneceğiz.<br><br>Bütün konu tek bir soruya dayanıyor: <b>Özne işi yapıyor mu (V-ing), ona mı yapılıyor (V3)?</b>')}

<h3>1. Temel kural: etken V-ing, edilgen V3</h3>
${FORM('Ana tablo',['Anlam','Kısaltma','Örnek','Türkçesi'],[
['<b>Etken</b> (özne yapıyor)','<b>V-ing</b>','People <u>living</u> in cities …','Şehirlerde yaşayan insanlar …'],
['<b>Edilgen</b> (özneye yapılıyor)','<b>V3</b>','The book <u>written</u> by Orhan Pamuk …','Orhan Pamuk\'un yazdığı kitap …'],
['Önce olmuş, etken','<b>having V3</b>','<u>Having finished</u> the work, they left.','İşi bitirdikten sonra ayrıldılar.'],
['Önce olmuş, edilgen','<b>having been V3</b>','<u>Having been warned</u>, they stayed home.','Uyarıldıkları için evde kaldılar.']])}
${TALK('Türkçede de benzer bir şey var: "<b>yaşayan</b> insanlar" (etken, -an) ile "<b>yazılan</b> kitap" (edilgen, -ılan). İngilizcede -an/-en → <b>V-ing</b>, -ılan/-ilen → <b>V3</b>.')}

<h3>2. Sıfat cümleciğini kısaltmak</h3>
${TALK('who / which / that + be fiilini at, geriye kalan fiil ya V-ing ya V3 olarak kalır.')}

const V2_MODALS={id:'modals',grp:'yds',v2:true,t:'Kipler',en:'Modal Verbs',s:'can, may, might, must, should, need; must have / can\'t have / should have / needn\'t have',
body:`
<h3>Önce büyük resim</h3>
${TALK('Kipler (modal verbs), fiile bir <b>tavır</b> ekler: yapabilmek, yapmalı, yapmış olmalı, yapabilirdi… Türkçede bunları fiile eklerle yaparız: <i>gel-<b>ebil</b>-ir, gel-<b>meli</b>, gel-<b>miş olmalı</b></i>. İngilizcede ise fiilden önce ayrı bir kelime gelir: <b>can</b> come, <b>must</b> come, <b>must have</b> come.<br><br>YDS\'de kipler her sınavda gramer bölümünde 1-2 soru, cümle tamamlama ve "anlamca en yakın cümle" sorularında da birkaç kez çıkar. En çok sorulan kısım <b>geçmişe yönelik kipler</b>dir (must have, can\'t have, should have, needn\'t have). Bu derste önce temel anlamları, sonra geçmiş yapılarını adım adım göreceğiz.')}

<h3>1. Kiplerin üç altın kuralı</h3>
${FORM('',['Kural','Doğru','Yanlış'],[
['1. Arkasından her zaman <b>yalın fiil</b> gelir','She can <b>swim</b>.','She can swims. / can to swim'],
['2. Öznesine göre <b>-s almaz</b>','He <b>must</b> go.','He musts go.'],
['3. Olumsuz ve soruda <b>do kullanılmaz</b>','You <b>shouldn\'t</b> go. <b>Can</b> you help?','You don\'t should go. Do you can help?']])}
${TALK('İstisna: <b>have to, need to, be able to, ought to</b> gibi "yarı-kipler" sonlarında "to" taşır ve have to / need to normal fiil gibi çekimlenir: <i>She <u>has to</u> work. Does she <u>have to</u> work?</i>')}

<h3>2. Yetenek: can, could, be able to</h3>
${FORM('',['Zaman','Yapı','Örnek','Türkçesi'],[
['Şimdi','<b>can</b> / am able to','She <u>can</u> speak three languages.','Üç dil konuşabiliyor.'],
['Geçmiş (genel yetenek)','<b>could</b>','He <u>could</u> read when he was four.','Dört yaşında okuyabiliyordu.'],
['Geçmiş (tek bir olayda başarmak)','<b>was able to / managed to</b>','The pilot <u>was able to</u> land safely.','Pilot güvenli iniş yapmayı başardı.'],
['Gelecek','<b>will be able to</b>','Soon robots <u>will be able to</u> drive.','Yakında robotlar araba kullanabilecek.'],
['Perfect','<b>have been able to</b>','Scientists <u>have</u> not <u>been able to</u> find a cure.','Bilim insanları bir tedavi bulamadı.']],
'can\'ın gelecek ve perfect hali yoktur; bu zamanlarda <b>be able to</b> kullanılır.')}
${WR('Scientists will can find a cure.','Scientists <b>will be able to</b> find a cure.','')}

<h3>3. Zorunluluk ve gereklilik: must, have to, need to</h3>
${TALK('<b>must</b> ve <b>have to</b> ikisi de "-mak zorunda" demek. Olumluda aralarındaki fark küçüktür: must konuşanın kendi düşüncesini, have to bir kuralı ya da dış zorunluluğu vurgular. <b>Ama olumsuzları tamamen farklı anlama gelir!</b> YDS bunu çok sorar.')}

['<b>have to</b> + V1','Workers <u>have to</u> wear helmets on site.','İşçiler şantiyede kask takmak zorunda (kural).'],

${FORM('Olumsuz: DİKKAT, anlamlar farklı!',['Yapı','Anlam','Örnek','Türkçesi'],[

['<b>needn\'t</b> / don\'t need to + V1','<b>GEREK YOK</b>','You <u>needn\'t</u> worry.','Endişelenmene gerek yok.']])}
${TALK('Şöyle düşün: <b>mustn\'t</b> = kırmızı ışık (yasak). <b>don\'t have to</b> = yeşil ışık ama mecbur değilsin (serbest).')}

<h3>4. Tavsiye: should, ought to, had better</h3>
${FORM('',['Yapı','Anlam','Örnek','Türkçesi'],[

${WR('You had better to study.','You had better <b>study</b>.','had better + yalın fiil.')}

<h3>5. Olasılık ve tahmin (şimdi)</h3>
${TALK('Kipler bir şeyin ne kadar <b>olası</b> olduğunu da anlatır. Bunu bir termometre gibi düşün: en altta "olabilir", en üstte "kesin öyle olmalı".')}

['%70','<b>should / ought to</b>','The package <u>should</u> arrive tomorrow.','Paket yarın gelmeli (beklenir).'],
['%50','<b>may / could</b>','The drug <u>may</u> cause side effects.','İlaç yan etkilere neden olabilir.'],

${TRAP('Olasılık anlamında "must"un olumsuzu <b>mustn\'t değil, can\'t</b>\'tir. "He mustn\'t be at home" = "Evde olmamalı (yasak)". "He can\'t be at home" = "Evde olamaz (imkânsız)".')}

<h3>6. Geçmişe yönelik kipler: modal + have + V3</h3>
${TALK('Şimdi YDS\'nin en sevdiği konuya geldik. Geçmişte olmuş (ya da olmamış) bir şey hakkında tahmin yürütmek, pişmanlık ya da eleştiri bildirmek için <b>kip + have + V3</b> yapısı kullanılır.<br><br>Burada "have" Present Perfect değildir; sadece kibi geçmişe taşıyan bir parçadır. Bütün öznelerle "have" kalır (has olmaz): <i>She <u>must have</u> left</i>.')}

['<b>shouldn\'t have</b> V3','-<b>memeliydi</b> (ama yaptı)','He <u>shouldn\'t have driven</u> so fast.','O kadar hızlı sürmemeliydi (sürdü).'],

'Yapı "is believed to …". Şimdi inanılıyor, ama <b>yazma eylemi geçmişte</b> (Shakespeare yüzyıllar önce yaşadı).',
'Geçmişte olmuş eylem → <b>to have + V3</b>.',
'A aynı zaman/genel anlam verir (şu an yazıyor gibi). D ve E edilgen/sürekli; Shakespeare yazan kişi, yazılan değil. C bu yapıda kullanılmaz.',
'Cevap <b>B) to have written</b>.'])}

<h3>10. Özet</h3>
${SUM([
'Edilgen = <b>be + V3</b>. be\'yi cümlenin zamanına göre çekimle; sürekli → <b>being</b>, perfect → <b>been</b>, kip → <b>be</b>.',
'Özneye sor: işi o mu yapıyor (etken), ona mı yapılıyor (edilgen)?',
'<b>occur, happen, arise, emerge, exist, die, rise, remain, consist</b> → edilgen OLMAZ.',
'<b>It is said / believed that</b> + cümle; <b>X is said to</b> + V1 (aynı zaman), <b>to have V3</b> (önceden olmuş).',

qs:[

QW('Major changes in the Earth\'s climate ---- over the past few centuries.',['have been occurred','were occurred','have occurred','are occurred','had been occurring by'],'C','occur geçişsiz → edilgen olmaz; "over the past…" → have occurred.',['Edilgen olmaz.','Edilgen olmaz.',null,'Edilgen olmaz.','Anlamsız.']),
QW('Shakespeare is believed ---- some of his plays together with other writers.',['to write','to have written','writing','to be written','to be writing'],'B','Yazma geçmişte, inanma şimdi → to have written.',['Aynı zaman/genel anlam.',null,'Bu yapıda -ing kullanılmaz.','Edilgen; Shakespeare yazan.','Şu an süren anlamı.']),
QW('The results of the experiment ---- carefully before they are published.',['must check','must be checked','must have checked','have to check','are checking'],'B','Sonuçlar kontrol edilmeli → modal edilgen: must be checked.',['Etken.',null,'Etken geçmiş tahmin.','Etken.','Etken sürekli.']),
QW('The new bridge ---- at the moment, so drivers must use the old road.',['is built','is being built','has built','builds','was being built'],'B','"at the moment" + edilgen → is being built.',['Geniş zaman edilgen; "şu anda" vermez.',null,'Etken.','Etken.','Geçmiş.']),
QW('The old castle, which ---- in the 12th century, is now a popular museum.',['built','has been built','was built','is built','had built'],'C','Kale inşa edildi (edilgen); belli geçmiş → was built.',['Etken.','Belli geçmişle Present Perfect olmaz.',null,'Geniş zaman.','Etken Past Perfect.']),
QW('It ---- that more than half of the world\'s languages will disappear by the end of this century.',['estimates','is estimated','has estimated','estimated','is estimating'],'B','"… tahmin ediliyor" → It is estimated that.',['Etken; "it" tahmin yapan olamaz.',null,'Etken.','Etken geçmiş.','Etken sürekli.']),
QW('The pyramids of Giza are thought ---- about 4,500 years ago.',['to build','to be built','to have been built','to have built','building'],'C','Piramitler inşa edildi (edilgen) ve olay geçmişte → to have been built.',['Etken ve aynı zaman.','Edilgen ama aynı zaman; "4,500 years ago" geçmiş ister.',null,'Etken; piramitler inşa etmez.','Yanlış yapı.']),
QW('By the time the police arrived, all the paintings ----.',['stole','had stolen','had been stolen','have been stolen','were stealing'],'C','Polis gelmeden önce (geçmişin geçmişi) ve tablolar çalındı (edilgen) → had been stolen.',['Etken.','Etken; tablolar çalan değil.',null,'Present Perfect geçmiş bağlamla uyuşmaz.','Etken sürekli.']),
QW('Many people in the region died when the disease ---- in the 14th century.',['was appeared','appeared','had been appeared','was appearing by','is appeared'],'B','appear (ortaya çıkmak) geçişsiz → edilgen olmaz; geçmiş → appeared.',['Edilgen olmaz.',null,'Edilgen olmaz.','Anlamsız.','Edilgen olmaz ve zaman yanlış.']),
QW('The winners of the competition ---- a cash prize and a certificate.',['gave','will give','will be given','are giving','have given'],'C','Kazananlara ödül verilecek (kişi özne, edilgen) → will be given.',['Etken: kazananlar verdi.','Etken.',null,'Etken.','Etken.']),
QW('I couldn\'t drive to work today because I was ---- my car serviced.',['doing','having','making','letting','being'],'B','Ettirgen yapı: have + nesne + V3 (arabama bakım yaptırıyordum).',['do bu kalıpta kullanılmaz.',null,'make + nesne + V1 alır.','let + nesne + V1 alır.','being bu kalıpta kullanılmaz.'])]};

const V2_IF={id:'if',grp:'yds',v2:true,t:'Koşul Cümleleri ve Wish',en:'Conditionals & Wishes',s:'Type 0-1-2-3, karma koşul, unless, provided that, devrik koşul (Should/Were/Had), wish, as if',
body:`
<h3>Önce büyük resim</h3>
${TALK('Koşul cümlesi iki parçadır: <b>koşul</b> (if kısmı) ve <b>sonuç</b> (ana cümle). Türkçede "<b>-se, -sa</b>" ekiyle yaparız.<br><br>İngilizcede koşul cümlelerinin türü, koşulun <b>ne kadar gerçek</b> olduğuna göre değişir:<br>• <b>Her zaman doğru</b>: Buzu ısıtırsan erir. (Type 0)<br>• <b>Gerçekleşebilir</b>: Yarın yağmur yağarsa evde kalacağım. (Type 1)<br>• <b>Hayal, şu an gerçek değil</b>: Zengin olsaydım dünyayı gezerdim. (Type 2)<br>• <b>Geçmişte olmadı, pişmanlık</b>: Daha çok çalışsaydım sınavı geçerdim. (Type 3)<br><br>YDS\'de koşul cümleleri gramer, cümle tamamlama ve çeviri sorularında sürekli çıkar. Özellikle <b>karma koşul</b> ve <b>devrik koşul</b> (Had I known…) sınavda ayırt edici sorulardır.')}

<h3>1. Dört tür: genel tablo</h3>
${FORM('Koşul türleri',['Tür','If kısmı','Ana cümle','Anlam','Türkçe'],[
['<b>Type 0</b>','Simple Present','Simple Present','Genel gerçek','-se, -ir'],
['<b>Type 1</b>','Simple Present','<b>will</b> / can / may + V1','Gerçek olasılık (gelecek)','-se, -ecek'],
['<b>Type 2</b>','Simple Past (be → <b>were</b>)','<b>would</b> / could / might + V1','Şu an hayal','-se, -ırdı'],
['<b>Type 3</b>','Past Perfect (<b>had V3</b>)','<b>would have</b> V3','Geçmişte olmayan','-miş olsaydı, -ırdı']],
'<b>Altın kural:</b> If kısmında <b>will ve would kullanılmaz</b> (birkaç nadir istisna dışında).')}

<h3>2. Type 0: genel gerçekler</h3>
${TALK('Her zaman, her koşulda doğru olan şeyler. Bilimsel gerçekler. "if" yerine "when" de kullanılabilir, anlam değişmez.')}
${SV([['If','c'],['you','s'],['heat','v'],['ice,','o'],['it','s'],['melts','v']],'Buzu ısıtırsan erir.')}
${SV([['If','c'],['plants','s'],['don\'t get','v'],['enough light,','o'],['they','s'],['die','v']],'Bitkiler yeterli ışık almazsa ölür.')}

<h3>3. Type 1: gerçek olasılık</h3>
${TALK('Gelecekte gerçekleşmesi <b>mümkün</b> olan bir koşul ve sonucu. En çok kullanılan tür.<br><br><b>Dikkat:</b> If kısmında anlam gelecek olsa bile <b>geniş zaman</b> kullanılır, will değil.')}
${SV([['If','c'],['it','s'],['rains','v'],['tomorrow,','t'],['the match','s'],['will be cancelled','v']],'Yarın yağmur yağarsa maç iptal edilecek.')}
${SV([['If','c'],['governments','s'],['don\'t act','v'],['now,','t'],['the crisis','s'],['will get','v'],['worse','x']],'Hükümetler şimdi harekete geçmezse kriz kötüleşecek.')}
${WR('If it will rain, we will stay at home.','If it <b>rains</b>, we will stay at home.','')}
${TIP('Ana cümlede will yerine <b>can, may, might, should</b> ve emir kipi de gelebilir: <i>If you need help, <u>call</u> me.</i> / <i>If you feel tired, you <u>should</u> rest.</i>')}

<h3>4. Type 2: şimdiki hayal</h3>
${TALK('Şu an <b>gerçek olmayan</b>, hayali bir durum. Fiil geçmiş zamanda ama anlam <b>şimdi</b>! Bu Türkler için kafa karıştırıcıdır. "If I had money" geçmiş değil, "şu an param olsaydı" demektir.')}
${SV([['If','c'],['I','s'],['were','v'],['rich,','x'],['I','s'],['would travel','v'],['the world','o']],'Zengin olsaydım dünyayı gezerdim. (Zengin değilim.)')}
${SV([['If','c'],['people','s'],['used','v'],['public transport,','o'],['there','s'],['would be','v'],['less pollution','x']],'İnsanlar toplu taşıma kullansaydı daha az kirlilik olurdu. (Kullanmıyorlar.)')}
${TALK('Type 2\'de <b>be</b> fiili bütün öznelerle <b>were</b> olur: <i>If I <u>were</u> you…, If he <u>were</u> here…</i> Günlük dilde "was" da duyulur ama YDS\'de <b>were</b> doğru kabul edilir.')}
${WR('If I would have more time, I would learn Japanese.','If I <b>had</b> more time, I would learn Japanese.','If kısmında would yok.')}
${FORM('Type 1 mi, Type 2 mi?',['Type 1 (olası)','Type 2 (hayal)'],[
['If I <b>find</b> your keys, I <b>will</b> call you.<br><i>Anahtarlarını bulursam ararım. (bulabilirim)</i>','If I <b>found</b> a million lira, I <b>would</b> buy a house.<br><i>Bir milyon lira bulsam ev alırdım. (pek olası değil)</i>']])}

<h3>5. Type 3: geçmişteki pişmanlık</h3>
${TL('cond3','Type 3: geçmişte olmadı; olsaydı sonuç farklı olurdu.')}
${TALK('Geçmişte <b>gerçekleşmemiş</b> bir koşul ve onun gerçekleşmemiş sonucu. Pişmanlık, eleştiri, "keşke" anlamı taşır.<br><br>Yapı: <b>If + had V3</b>, <b>would have V3</b>. Türkçesi: "<b>-miş olsaydı, -ırdı</b>".')}
${SV([['If','c'],['they','s'],['had left','v'],['earlier,','t'],['they','s'],['would have caught','v'],['the train','o']],'Daha erken çıksalardı treni yakalarlardı. (Çıkmadılar, kaçırdılar.)')}
${SV([['If','c'],['the government','s'],['had taken','v'],['action,','o'],['thousands of lives','s'],['could have been saved','v']],'Hükümet harekete geçseydi binlerce hayat kurtarılabilirdi.')}
${WR('If I would have known, I would have helped.','If I <b>had known</b>, I would have helped.','')}
${WR('If you had studied, you would pass.','If you had studied, you <b>would have passed</b>.','İki kısım da geçmişte olmalı (karma değilse).')}

<h3>6. Karma koşul (mixed): YDS'nin ayırt edici sorusu</h3>
${TALK('Bazen koşul <b>geçmişte</b>, sonuç <b>şimdi</b>dir (ya da tersi). O zaman iki türün parçaları karışır.<br><br>En sık çıkan: <b>geçmiş neden → şimdiki sonuç</b><br>If + <b>had V3</b> (Type 3 koşulu), <b>would + V1</b> (Type 2 sonucu)')}
${SV([['If','c'],['I','s'],['had studied','v'],['medicine,','o'],['I','s'],['would be','v'],['a doctor','x'],['now','t']],'Tıp okusaydım şimdi doktor olurdum.')}
${SV([['If','c'],['governments','s'],['had invested','v'],['in renewable energy','x'],['decades ago,','t'],['we','s'],['wouldn\'t be facing','v'],['this crisis','o'],['today','t']],'Hükümetler on yıllar önce yenilenebilir enerjiye yatırım yapsaydı bugün bu krizle karşı karşıya olmazdık.')}
${TIP('Karma koşulu tanımanın yolu <b>zaman ifadeleridir</b>: if kısmında "years ago, last year, when I was young", ana cümlede "<b>now, today, still</b>" görürsen karma koşuldur.')}
${FORM('Diğer karma tür (daha nadir)',['Yapı','Örnek','Türkçesi'],[
['If + V2 (kalıcı durum), would have V3 (geçmiş sonuç)','If he <u>were</u> more careful, he <u>wouldn\'t have made</u> that mistake.','Daha dikkatli biri olsaydı o hatayı yapmazdı.']])}

<h3>7. if yerine kullanılan bağlaçlar</h3>
${FORM('',['Bağlaç','Anlam','Örnek','Türkçesi'],[
['<b>unless</b> (= if … not)','-mezse, -medikçe','<u>Unless</u> you study, you will fail.','Çalışmazsan kalırsın.'],
['<b>provided / providing (that)</b>','-mesi şartıyla','You can go <u>provided that</u> you return early.','Erken dönmen şartıyla gidebilirsin.'],
['<b>as long as / so long as</b>','-dığı sürece','<u>As long as</u> you pay, you can stay.','Ödediğin sürece kalabilirsin.'],
['<b>on condition that</b>','-mesi koşuluyla','He was released <u>on condition that</u> he left the country.','Ülkeyi terk etmesi koşuluyla serbest bırakıldı.'],
['<b>in case</b>','olur da … diye (önlem)','Take a map <u>in case</u> you get lost.','Kaybolursun diye harita al.'],
['<b>even if</b>','-se bile','I\'ll go <u>even if</u> it rains.','Yağmur yağsa bile giderim.'],
['<b>otherwise</b>','aksi takdirde','Hurry, <u>otherwise</u> you\'ll be late.','Acele et, yoksa geç kalacaksın.'],
['<b>but for / without</b> + isim','… olmasaydı','<u>But for</u> your help, I would have failed.','Senin yardımın olmasaydı başarısız olurdum.'],
['<b>suppose / supposing / what if</b>','farz et ki','<u>Suppose</u> you won the lottery, what would you do?','Piyangoyu kazandığını farz et, ne yapardın?'],
['<b>only if</b>','ancak … -se','You can enter <u>only if</u> you have a ticket.','Ancak biletin varsa girebilirsin.']])}
${TRAP('<b>unless</b> zaten olumsuz anlam taşır ("-mezse"). Arkasından olumsuz fiil gelmez: <i>Unless you <s>don\'t</s> study</i> ✘. Şıklarda "unless … not" görürsen dikkat et; genelde anlamı ters çevirir.')}
${TRAP('<b>in case</b> ≠ <b>if</b>. "Take an umbrella <u>if</u> it rains" = yağarsa al (yağmazsa alma). "Take an umbrella <u>in case</u> it rains" = önlem olarak şimdi al.')}

<h3>8. Devrik (if'siz) koşul: Should, Were, Had</h3>
${TALK('Resmi ve akademik dilde "if" atılıp yardımcı fiil başa getirilebilir. Anlam aynı kalır, sadece daha resmi olur. YDS bu yapıyı çok sever çünkü cümle soru gibi görünür ama sonunda soru işareti yoktur.')}
${FORM('Devrik koşul tablosu',['Tür','Normal','Devrik'],[
['Type 1','If you <b>should</b> need help, …','<b>Should you need</b> help, call me.'],
['Type 2','If I <b>were</b> you, …','<b>Were I</b> you, I would accept.'],
['Type 2','If it <b>were</b> not for your help, …','<b>Were it not for</b> your help, I would fail.'],
['Type 3','If they <b>had known</b>, …','<b>Had they known</b>, they would have come.'],
['Type 3','If it <b>had</b> not <b>been</b> for the rain, …','<b>Had it not been for</b> the rain, we would have won.']])}
${SV([['Had','c'],['the doctors','s'],['diagnosed','v'],['the disease','o'],['earlier,','t'],['the patient','s'],['would have survived','v']],'Doktorlar hastalığı daha erken teşhis etselerdi hasta hayatta kalırdı.')}
${TIP('Nasıl anlarım? Cümle <b>Should / Were / Had + özne</b> ile başlıyor ve sonunda soru işareti yok. Hangi tür olduğunu <b>ana cümlenin zamanı</b> söyler: will → Should; would → Were; would have → Had.')}

<h3>9. wish ve if only: "keşke"</h3>
${TALK('"Keşke" demek için <b>wish</b> ya da daha güçlü olan <b>if only</b> kullanılır. Kural Type 2 ve Type 3 ile aynı mantıkta: bir zaman <b>geriye</b> kayar.')}
${FORM('wish tablosu',['Neden şikâyet?','Yapı','Örnek','Türkçesi'],[
['Şimdiki durum','wish + <b>V2 / were</b>','I wish I <u>knew</u> the answer.','Keşke cevabı bilsem.'],
['Şimdiki durum','','I wish I <u>were</u> taller.','Keşke daha uzun olsam.'],
['Geçmiş olay (pişmanlık)','wish + <b>had V3</b>','I wish I <u>had studied</u> harder.','Keşke daha çok çalışsaydım.'],
['Yapamamak','wish + <b>could</b> V1','I wish I <u>could</u> speak French.','Keşke Fransızca konuşabilsem.'],
['Başkasının davranışı / değişim isteği','wish + <b>would</b> V1','I wish they <u>would stop</u> making noise.','Keşke gürültüyü kesseler.']])}
${WR('I wish I know the answer.','I wish I <b>knew</b> the answer.','')}
${WR('I wish I didn\'t say that yesterday.','I wish I <b>hadn\'t said</b> that yesterday.','Geçmiş pişmanlık → had V3.')}
${WR('I wish I would be rich.','I wish I <b>were</b> rich.','Kendin için would kullanılmaz.')}

<h3>10. as if / as though: "-mış gibi"</h3>
${FORM('',['Yapı','Örnek','Türkçesi'],[
['as if + V2 (gerçek dışı, şimdi)','He talks <u>as if</u> he <u>knew</u> everything.','Her şeyi biliyormuş gibi konuşuyor (bilmiyor).'],
['as if + had V3 (gerçek dışı, geçmiş)','She looked <u>as if</u> she <u>had seen</u> a ghost.','Hayalet görmüş gibi görünüyordu.'],
['as if + geniş zaman (muhtemelen doğru)','It looks <u>as if</u> it <u>is going to</u> rain.','Yağmur yağacak gibi görünüyor.']])}

<h3>11. Birlikte YDS sorusu çözelim</h3>
${SOLVE('If governments ---- more in renewable energy decades ago, we would not be facing such a serious climate crisis today.',['invested','had invested','would invest','have invested','invest'],'B',[
'Zaman ifadelerine bak: if kısmında "<b>decades ago</b>" (geçmiş), ana cümlede "<b>today</b>" ve "would not be facing" (şimdi).',
'Geçmiş neden → şimdiki sonuç = <b>karma koşul</b>. Koşul kısmı Type 3 gibi: <b>had V3</b>.',
'A Type 2 olur ve "decades ago" ile çelişir. C\'de if kısmında would olmaz. D ve E zaman uyumunu bozar.',
'Cevap <b>B) had invested</b>.'])}
${SOLVE('---- you need further information, please do not hesitate to contact our office.',['Should','Had','Were','Unless','Would'],'A',[
'Cümle bir yardımcı fiille başlıyor ama soru işareti yok → <b>devrik koşul</b> olabilir.',
'Ana cümle: "please do not hesitate…" → şimdi/gelecek, yani <b>Type 1</b>. Type 1\'in devriği <b>Should</b>.',
'B (Had) Type 3, C (Were) Type 2 ister; ana cümle uymuyor. D (Unless) anlamı ters çevirir: "bilgiye ihtiyacın yoksa bizi ara". E soru olur.',
'Cevap <b>A) Should</b>.'])}

<h3>12. Özet</h3>
${SUM([
'<b>Type 0</b>: Present + Present (genel gerçek). <b>Type 1</b>: Present + will (olası).',
'<b>Type 2</b>: V2 / were + would V1 (şimdiki hayal). <b>Type 3</b>: had V3 + would have V3 (geçmiş pişmanlık).',
'If kısmında <b>will / would kullanılmaz</b>.',
'<b>Karma</b>: had V3 + would V1 (now / today).',
'<b>unless</b> = if not (arkasından olumsuz gelmez); <b>in case</b> = önlem olarak; <b>provided that / as long as</b> = şartıyla.',
'Devrik: <b>Should</b> you… (Type 1), <b>Were</b> I… (Type 2), <b>Had</b> they… (Type 3).',
'<b>wish + V2</b> (şimdi), <b>wish + had V3</b> (geçmiş), <b>wish + would</b> (başkasından şikâyet).'])}`,
qs:[
QW('If governments ---- more in renewable energy decades ago, we would not be facing such a serious climate crisis today.',['invested','had invested','would invest','have invested','invest'],'B','Geçmiş neden + şimdiki sonuç → karma: had invested.',['Type 2; "decades ago" ile çelişir.',null,'If kısmında would olmaz.','Present Perfect uyuşmaz.','Geniş zaman uyuşmaz.']),
QW('---- you need further information, please do not hesitate to contact our office.',['Should','Had','Were','Unless','Would'],'A','Type 1 devrik → Should you need.',[null,'Type 3 ister.','Type 2 ister ve "were you need" bozuk.','Anlam ters olur.','Soru olur.']),
QW('Unless the forests ---- , thousands of species will become extinct.',['will be protected','are protected','were protected','had been protected','are not protected'],'B','Type 1, unless + olumlu geniş zaman → are protected.',['Koşulda will olmaz.',null,'Type 2; ana cümle will.','Type 3; uyuşmaz.','unless + not çift olumsuz; anlam ters.']),
QW('Many older people wish they ---- more time with their families when they were younger.',['spend','will spend','had spent','have spent','would spend'],'C','Geçmiş pişmanlık → wish + had V3.',['Şimdiki zaman wish ile olmaz.','wish + will olmaz.',null,'Present Perfect olmaz.','Başkasından şikâyet anlamı; uymaz.']),

const V2_PRESENT={id:'present',grp:'yds',v2:true,t:'Geniş, Şimdiki ve Present Perfect Zamanlar',en:'Present Tenses',s:'Simple Present, Present Continuous, Present Perfect: ne zaman hangisi, adım adım',
body:`
<h3>Önce büyük resim</h3>
${TALK('Türkçede "şimdi" ile ilgili iki zaman var: <b>geniş zaman</b> (çalışırım) ve <b>şimdiki zaman</b> (çalışıyorum). İngilizcede ise <b>dört</b> tane var. Fazladan olan ikisi, Türkçede hiç olmayan bir fikri anlatıyor: <b>"geçmişte başladı ama şimdiye bağlı."</b><br><br>Bu yüzden İngilizce öğrenen Türklerin en çok zorlandığı konu Present Perfect\'tir. YDS de bunu bildiği için her sınavda en az 2-3 soruda karşına çıkarır. Bu derste dördünü sırayla, birbirinden farkını görerek öğreneceğiz.')}
${FORM('4 present zaman, tek bakışta',['Zaman','Yapı','Ne anlatır?','Türkçesi'],[
['<b>Simple Present</b>','work / works','Her zaman doğru olan, tekrarlanan şeyler','çalışırım / çalışır'],
['<b>Present Continuous</b>','am / is / are working','Şu anda ya da bu aralar süren şeyler','çalışıyorum'],
['<b>Present Perfect</b>','have / has worked','Geçmişte olan ama şimdiyle bağlantılı şeyler','çalıştım / çalışmışımdır / -dır çalışıyorum'],
['<b>Present Perfect Continuous</b>','have / has been working','Geçmişte başlayıp şu ana kadar süren şeyler (süre vurgusu)','… -dır çalışıyorum']])}
<p>Aşağıdaki adımlarda her birini ayrı ayrı göreceğiz. Acele etme, her adımdaki örnekleri sesli okuyarak ilerle.</p>

<h3>1. Simple Present: "her zaman böyle"</h3>
${TL('repeat','Simple Present: belli bir ana bağlı değil, her zaman ya da tekrar tekrar olur.')}
${TALK('Simple Present bir olayın <b>şu an</b> olduğunu söylemez. "Genelde böyle", "her zaman böyle", "doğası böyle" der. Bu yüzden <b>bilimsel gerçekler</b> ve <b>akademik metinler</b> neredeyse hep bu zamanla yazılır. YDS paragraflarının çoğu Simple Present\'tir.')}
${FORM('Yapı',['','Olumlu','Olumsuz','Soru'],[
['I / you / we / they','I <b>work</b>','I <b>don\'t work</b>','<b>Do</b> I <b>work</b>?'],
['he / she / it','She <b>works</b>','She <b>doesn\'t work</b>','<b>Does</b> she <b>work</b>?']],
'<b>Dikkat:</b> he / she / it ile fiile <b>-s</b> eklenir. Ama olumsuz ve soruda -s, <b>does</b>\'a geçer, fiil yalın kalır: <i>She doesn\'t work</i> (doesn\'t works değil).')}
<h4>-s eki nasıl eklenir?</h4>
${FORM('-s kuralları',['Fiilin sonu','Ne olur?','Örnek'],[
['Çoğu fiil','+s','work → works, grow → grows'],
['-s, -sh, -ch, -x, -o','+es','watch → watches, go → goes, fix → fixes'],
['ünsüz + y','y düşer, +ies','study → studies, carry → carries'],
['ünlü + y','+s','play → plays'],
['have','has','She has a car.']])}
<h4>Ne zaman kullanılır?</h4>
<p><b>a) Bilimsel gerçekler, genel doğrular</b></p>
${SV([['Water','s'],['boils','v'],['at 100°C','x']],'Su 100°C\'de kaynar. (Dün de, bugün de, yarın da.)')}
${SV([['The heart','s'],['pumps','v'],['blood','o'],['around the body','x']],'Kalp kanı vücuda pompalar.')}
<p><b>b) Alışkanlıklar, tekrarlanan olaylar</b></p>
${SV([['Most people','s'],['check','v'],['their phones','o'],['every morning','t']],'İnsanların çoğu her sabah telefonuna bakar.')}
<p><b>c) Bir bilginin, raporun, çalışmanın ne söylediği</b> (akademik dilde çok sık)</p>
${SV([['The study','s'],['shows','v'],['that sleep improves memory','o']],'Çalışma, uykunun hafızayı geliştirdiğini gösteriyor.')}
${TALK('Türkçeye bazen "-yor" diye çevrilir ("gösteriyor"), ama İngilizcede Simple Present\'tir, çünkü çalışma bunu "kalıcı olarak" söylüyor.')}
<h4>İpucu kelimeler</h4>
<p><b>always, usually, often, sometimes, rarely, never, every day / year, generally, in general, as a rule</b></p>
${WR('She work in a hospital.','She <b>works</b> in a hospital.','he / she / it ile -s unutulmaz.')}
${WR('Does he works here?','Does he <b>work</b> here?','does varsa fiil yalın kalır.')}

<h3>2. Present Continuous: "şu sıralar, şu anda"</h3>
${TL('now','Present Continuous: şu anda ya da bu dönemde süren, geçici bir durum.')}
${TALK('Present Continuous bir şeyin <b>süreç halinde</b> olduğunu anlatır: başlamış, henüz bitmemiş. Bu "şu an, bu saniye" de olabilir, "bu aralar" da. YDS\'de en çok <b>değişen, gelişen durumları</b> anlatırken görürsün: <i>The population is growing, temperatures are rising</i>.')}
${FORM('Yapı: am / is / are + fiil-ing',['','Olumlu','Olumsuz','Soru'],[
['I','I <b>am working</b>','I <b>am not working</b>','<b>Am</b> I <b>working</b>?'],
['he / she / it','He <b>is working</b>','He <b>isn\'t working</b>','<b>Is</b> he <b>working</b>?'],
['you / we / they','They <b>are working</b>','They <b>aren\'t working</b>','<b>Are</b> they <b>working</b>?']],
'-ing ekleme: write → writ<b>ing</b> (sessiz e düşer), run → run<b>n</b>ing (kısa ünlü + ünsüz → ünsüz ikilenir), die → d<b>y</b>ing.')}
<h4>Ne zaman kullanılır?</h4>
<p><b>a) Tam şu anda olan</b></p>
${SV([['The students','s'],['are taking','v'],['an exam','o'],['right now','t']],'Öğrenciler şu anda sınava giriyor.')}

${SV([['More people','s'],['are working','v'],['from home','x'],['these days','t']],'Bu aralar daha fazla insan evden çalışıyor.')}

${SV([['Global temperatures','s'],['are rising','v'],['every year','t']],'Küresel sıcaklıklar her yıl artıyor.')}

<h3>3. Simple Present mi, Present Continuous mi?</h3>

${FORM('Yan yana karşılaştır',['Simple Present (kalıcı)','Present Continuous (geçici / süreç)'],[
['He <b>lives</b> in Ankara.<br><i>Ankara\'da yaşar.</i> (orası onun evi)','He <b>is living</b> in Ankara this year.<br><i>Bu yıl Ankara\'da yaşıyor.</i> (geçici)'],
['Prices <b>rise</b> in winter.<br><i>Kışın fiyatlar yükselir.</i> (her kış olur)','Prices <b>are rising</b>.<br><i>Fiyatlar yükseliyor.</i> (şu an süreç halinde)'],

${TALK('Bazı fiiller bir <b>eylem</b> değil bir <b>durum</b> anlatır. "Bilmek", "inanmak", "içermek" gibi. Bunlar süreç halinde olamayacağı için Continuous zamanda kullanılmaz.')}
<p><b>know, believe, understand, think</b> (=inanmak), <b>mean, seem, appear, need, want, prefer, like, love, hate, belong, own, contain, consist, include, depend, exist, resemble</b></p>
${WR('The report is containing several errors.','The report <b>contains</b> several errors.','contain bir durum fiilidir.')}

${TRAP('YDS bu fiillerin -ing hallerini çeldirici olarak koyar. Şıklarda "is containing", "are consisting", "is depending" görürsen hemen ele.')}

<h3>4. Present Perfect: Türkçede olmayan zaman</h3>
${TALK('Şimdi asıl konuya geldik. Present Perfect\'in mantığı şu: <b>Olay geçmişte, ama gözümüz şimdide.</b><br><br>Türkçede "Anahtarlarımı kaybettim" deriz. Bu cümleyi iki farklı şekilde düşünebiliriz:<br>• <i>Dün kaybettim, sonra buldum.</i> → Sadece geçmiş anlatılıyor. İngilizcede: <b>I lost my keys yesterday.</b><br>• <i>Kaybettim, şu an anahtarım yok!</i> → Geçmişteki olayın <b>şimdiki sonucu</b> önemli. İngilizcede: <b>I have lost my keys.</b><br><br>İşte Present Perfect bu ikinci durumdur. Geçmiş ile şimdi arasında bir <b>köprü</b> kurar.')}
${TL('perfect','Present Perfect: geçmişte başladı, etkisi ya da kendisi şimdiye kadar uzanıyor.')}
${FORM('Yapı: have / has + fiilin 3. hali (V3)',['','Olumlu','Olumsuz','Soru'],[

const V2_CUMLE={id:'cumle',grp:'temel',v2:true,t:'Cümlenin Yapısı ve Kelime Türleri',en:'Sentence Structure & Parts of Speech',s:'Özne, yüklem, nesne; isim, fiil, sıfat, zarf; ekten tür tanıma; uzun cümleyi çözmek',
body:`
<h3>Önce büyük resim</h3>
${TALK('İngilizce gramerin bütün konuları tek bir temelin üstüne kurulur: <b>cümlenin iskeleti</b>. Bu iskeleti görmeyi öğrenirsen YDS\'deki 3-4 satırlık akademik cümleler bile sana basit gelmeye başlar.<br><br>Bu derste üç şey öğreneceğiz:<br>1. İngilizce cümlede kelimeler hangi <b>sırayla</b> dizilir?<br>2. Bir kelimenin <b>türü</b> (isim mi, fiil mi, sıfat mı) nasıl anlaşılır?<br>3. Uzun bir cümlenin <b>ana parçası</b> nasıl bulunur?<br><br>Bu üçünü bilen biri YDS kelime ve gramer sorularında şıkların yarısını, kelimenin anlamını bilmese bile eleyebilir.')}

<h3>1. En büyük fark: yüklemin yeri</h3>
${TALK('Türkçede yüklem cümlenin <b>sonuna</b> gelir: <i>Ali kitabı okudu.</i><br>İngilizcede yüklem <b>öznenin hemen arkasına</b> gelir: <i>Ali read the book.</i><br><br>Yani İngilizce cümle "Kim? → Ne yaptı? → Neyi? → Nerede? → Ne zaman?" sırasıyla ilerler.')}
${FORM('İngilizce cümle sırası',['1. Özne','2. Yüklem','3. Nesne','4. Yer','5. Zaman'],[

${SV([['Scientists','s'],['discovered','v'],['a new virus','o'],['in 2020','t']],'Bilim insanları 2020\'de yeni bir virüs keşfetti.')}
${TIP('İngilizceden Türkçeye çevirirken <b>yüklemi en sona at</b>. Türkçeden İngilizceye çevirirken <b>yüklemi öznenin hemen arkasına getir</b>. YDS çeviri sorularının büyük kısmı bu basit fikirle çözülür.')}
<h4>Özne, yüklem, nesne nedir?</h4>
${FORM('',['Öğe','Sorusu','Örnek'],[
['<b>Özne</b> (subject)','İşi kim / ne yapıyor?','<u>The doctor</u> examined the patient.'],
['<b>Yüklem</b> (verb)','Ne yapıyor / ne oluyor?','The doctor <u>examined</u> the patient.'],
['<b>Nesne</b> (object)','Neyi / kimi?','The doctor examined <u>the patient</u>.'],
['<b>Tümleç</b>','Nerede, ne zaman, nasıl?','… <u>in the hospital</u> <u>yesterday</u>.']])}

<h3>3. Kelime türleri: dört büyük aile</h3>
${TALK('İngilizcede bir kelimenin cümlede ne iş yaptığına <b>türü</b> denir. YDS\'de dört tür sürekli karşına çıkar: <b>isim, fiil, sıfat, zarf</b>. Boşluğa hangi türün geleceğini bilirsen, kelimeyi tanımasan bile doğru şıkkı bulabilirsin.')}

<p>Çoğu akademik kelimenin dört hali vardır. YDS bu aileleri şıklara koyar; hangisinin boşluğa uyduğunu türüne bakarak seçersin.</p>

const V2_ZAMIR={id:'zamir',grp:'temel',v2:true,t:'Zamirler',en:'Pronouns',s:'I/me/my/mine/myself, it ve there, this/that, that of / those of, one, belgisiz zamirler',
body:`
<h3>Önce büyük resim</h3>
${TALK('Zamirler bir ismin <b>yerini tutan</b> kelimelerdir. "Ali geldi. <i>O</i> yorgundu." cümlesinde "o", Ali\'nin yerini tutuyor.<br><br>Türkçede zamirler eklerle çekimlenir: ben, beni, bana, benim, benimki, kendim. İngilizcede bu eklerin her biri <b>ayrı bir kelimedir</b>: I, me, my, mine, myself. Bu yüzden İngilizcede doğru zamiri seçmek için o kelimenin cümlede <b>ne iş yaptığına</b> bakmak gerekir.<br><br>YDS\'de zamirler iki şekilde karşına çıkar:<br>• <b>Gramer sorusu:</b> boşluğa its mi, their mi, them mi gelir?<br>• <b>Okuma sorusu:</b> paragraftaki "it", "they", "this" neyi kastediyor?')}

['onlar','<b>they</b>','them','their','theirs','themselves']])}
${TALK('Bu tabloyu satır satır sesli okuyarak ezberle. Her sütunun ne zaman kullanıldığını aşağıda tek tek göreceğiz.')}

<h3>2. Özne zamiri mi, nesne zamiri mi?</h3>
${TALK('<b>Özne zamiri</b> (I, he, she, we, they) işi <b>yapanı</b> gösterir ve fiilden <b>önce</b> gelir.<br><b>Nesne zamiri</b> (me, him, her, us, them) işten <b>etkileneni</b> gösterir; fiilden ya da edattan (to, for, with, between…) <b>sonra</b> gelir.<br><br>Türkçede "<i>onu, ona, onunla</i>" dediğimiz her yerde İngilizcede nesne zamiri kullanılır.')}

${TALK('<b>my, your, his, her, its, our, their</b> mutlaka bir <b>isimle</b> birlikte gelir: <i>my book, their plans</i>.<br><b>mine, yours, his, hers, ours, theirs</b> ise <b>tek başına</b> kullanılır, ismin tekrarını önler: <i>This book is mine</i> (= my book).')}

<h3>6. this / that / these / those</h3>
${FORM('',['','Yakın','Uzak'],[['Tekil','this (bu)','that (şu, o)'],['Çoğul','these (bunlar)','those (şunlar, onlar)']])}

const V2_SIFATZARF={id:'sifatzarf',grp:'temel',v2:true,t:'Sıfatlar ve Zarflar',en:'Adjectives & Adverbs',s:'Sıfat-zarf farkı, durum fiilleri, hard/hardly, -ed/-ing, too/enough, so/such',
body:`
<h3>Önce büyük resim</h3>
${TALK('Türkçede aynı kelime hem sıfat hem zarf olabilir: "<i>hızlı</i> bir araba" (sıfat), "<i>hızlı</i> koştu" (zarf). İngilizcede ise çoğu zaman <b>iki ayrı kelime</b> vardır: <b>quick</b> car, ran <b>quickly</b>.<br><br>YDS kelime ve gramer sorularında şıklarda sık sık aynı kelimenin sıfat ve zarf hali yan yana konur. Doğru olanı seçmek için tek kuralı bilmen yeter:<br><br><b>Sıfat → ismi niteler. Zarf → geri kalan her şeyi (fiil, sıfat, başka zarf, bütün cümle) niteler.</b>')}

<h3>1. Sıfat ne yapar, zarf ne yapar?</h3>
${FORM('',['Sıfat (adjective)','Zarf (adverb)'],[
['"Nasıl bir?" sorusuna cevap verir','"Nasıl? Ne derece? Ne sıklıkla?" sorusuna cevap verir'],
['a <b>careful</b> driver<br><i>dikkatli bir sürücü</i>','He drives <b>carefully</b>.<br><i>Dikkatli sürer.</i>'],
['a <b>rapid</b> increase<br><i>hızlı bir artış</i>','Prices increased <b>rapidly</b>.<br><i>Fiyatlar hızla arttı.</i>'],
['The test was <b>easy</b>.<br><i>Sınav kolaydı.</i>','She passed the test <b>easily</b>.<br><i>Sınavı kolayca geçti.</i>']])}
<h4>Zarf neleri niteler?</h4>
${SV([['The economy','s'],['grew','v'],['slowly','x']],'Ekonomi yavaş büyüdü. (fiili niteler)')}
${SV([['The results','s'],['were','v'],['surprisingly','x'],['good','x']],'Sonuçlar şaşırtıcı derecede iyiydi. (sıfatı niteler)')}
${SV([['She','s'],['spoke','v'],['very','x'],['clearly','x']],'Çok net konuştu. (başka bir zarfı niteler)')}
${SV([['Unfortunately,','x'],['the project','s'],['failed','v']],'Ne yazık ki proje başarısız oldu. (bütün cümleyi niteler)')}

<h3>2. Sıfatın yeri ve durum fiilleri</h3>
${TALK('Sıfat iki yerde durur:<br>• <b>İsmin önünde:</b> an <u>important</u> decision<br>• <b>Durum fiillerinden sonra:</b> Bu fiiller bir <b>eylem</b> değil bir <b>durum</b> anlatır ve arkalarından <b>zarf değil sıfat</b> gelir. Türklerin en çok hata yaptığı yer burasıdır.')}

const V2_FIIL={id:'fiil',grp:'temel',v2:true,t:'Fiiller ve Yardımcı Fiiller',en:'Verbs & Auxiliaries',s:'Fiilin 3 hali (V1, V2, V3) ne demek, nerede kullanılır? be / have / do ne işe yarar? En basit haliyle.',
body:`
<h3>Önce büyük resim</h3>
${TALK('Fiil, bir <b>iş ya da hareket</b> anlatan kelimedir: gelmek, yazmak, çalışmak, artmak. Cümlenin kalbidir.<br><br>Türkçede bir fiili değiştirmek için sonuna <b>ek</b> getiririz:<br><i>yaz → yaz<b>dı</b> → yaz<b>mış</b> → yaz<b>ıyor</b> → yaz<b>ıl</b>dı</i><br><br>İngilizcede bu kadar çok ek yok. Onun yerine:<br>1. Fiilin <b>3 hazır hali</b> var (V1, V2, V3).<br>2. Bu hallerin önüne gelen <b>3 yardımcı kelime</b> var (be, have, do).<br><br>Bu ikisini birleştirerek İngilizcedeki bütün zamanlar kurulur. Yani bu dersi anlarsan zamanların hepsi kolaylaşır. Acele etme, her örneği Türkçesiyle birlikte oku.')}

${TALK('Her İngilizce fiilin 3 hali vardır. Bunlara kısaca <b>V1, V2, V3</b> deriz ("V", İngilizce "verb" yani fiil kelimesinin baş harfi).<br><br>Bir örnekle görelim: <b>yazmak</b> fiili.')}
${FORM('"yazmak" fiilinin 3 hali',['Adı','İngilizce','Türkçede neye benzer?'],[
['<b>V1</b>','<b>write</b>','<b>yaz</b> → fiilin çıplak hali, sözlükte yazan hali'],
['<b>V2</b>','<b>wrote</b>','<b>yazdı</b> → geçmiş hali'],
['<b>V3</b>','<b>written</b>','<b>yazılmış / yazmış</b> → tek başına kullanılmayan hali']])}
${TALK('Şimdi her birini tek tek anlatayım.')}
<h4>V1: fiilin çıplak hali</h4>
${TALK('V1, fiilin hiçbir şey eklenmemiş hali. Sözlükte bir fiile baktığında gördüğün hali budur: <b>work</b> (çalış), <b>go</b> (git), <b>write</b> (yaz).<br><br>V1\'i şu durumlarda görürsün:')}
${FORM('V1 nerede kullanılır?',['Durum','İngilizce','Türkçesi'],[
['Geniş zaman (her zaman yaptığım şey)','I <b>work</b> in a hospital.','Hastanede <b>çalışırım</b>.'],
['can, must, will gibi kelimelerden sonra','She can <b>swim</b>.','<b>Yüzebilir</b>.'],
['"to" kelimesinden sonra','I want to <b>go</b>.','<b>Gitmek</b> istiyorum.'],
['do / does / did kelimelerinden sonra','Did he <b>call</b>?','<b>Aradı</b> mı?'],
['Emir verirken','<b>Open</b> the door.','Kapıyı <b>aç</b>.']])}
<h4>V1 + s: "o" için geniş zaman</h4>

${FORM('',['Kim?','İngilizce','Türkçesi'],[
['Ben','I <b>work</b>.','Çalışırım.'],
['Sen / Biz / Onlar','You / We / They <b>work</b>.','Çalışırsın / Çalışırız / Çalışırlar.'],
['<b>O</b>','He / She <b>works</b>.','<b>O çalışır.</b> → -s geldi!']])}
<h4>V2: geçmiş hali ("-dı")</h4>
${TALK('V2, Türkçedeki "<b>-dı, -di, -du</b>" ekinin karşılığıdır. Sadece geçmişte olup bitmiş bir şeyi anlatırken kullanılır: dün, geçen yıl, 1990\'da…<br><br>Güzel tarafı: V2 bütün kişilerle aynıdır. "Ben yazdım, o yazdı, onlar yazdı" hepsi <b>wrote</b>.')}
${FORM('',['İngilizce','Türkçesi'],[

['She <b>wrote</b> a book in 2010.','2010\'da bir kitap <b>yazdı</b>.'],

<h4>V3: en çok kafa karıştıran hal</h4>
${TALK('V3\'ün özelliği şu: <b>Tek başına asla kullanılmaz.</b> Önüne mutlaka bir yardımcı kelime gelir. Hangi yardımcı gelirse anlam ona göre değişir:<br><br><b>1) have + V3 → "-dı / -mış / -dır" anlamı</b> (işi biz yaptık)<br><i>I <b>have written</b> a letter.</i> = Bir mektup <b>yazdım</b>.<br><br><b>2) be (is / was…) + V3 → "-ıldı / -ılır" anlamı</b> (iş bize / ona yapıldı)<br><i>The letter <b>was written</b> in 1920.</i> = Mektup 1920\'de <b>yazıldı</b>.<br><br>Yani V3\'ü Türkçedeki "<b>yazılmış, yapılmış, inşa edilmiş</b>" kelimesi gibi düşün. Yanına ne geldiğine bakarsın.')}
${FORM('V3 hep bir yardımcıyla gelir',['Yardımcı + V3','İngilizce','Türkçesi','Ne anlatıyor?'],[
['have / has + V3','They <b>have finished</b> the project.','Projeyi <b>bitirdiler</b>.','İşi onlar yaptı.'],
['had + V3','The film <b>had started</b>.','Film <b>başlamıştı</b>.','Geçmişte daha önce olmuş.'],
['is / are + V3','English <b>is spoken</b> here.','Burada İngilizce <b>konuşulur</b>.','İş ona yapılıyor (-ılır).'],
['was / were + V3','The bridge <b>was built</b> in 1990.','Köprü 1990\'da <b>inşa edildi</b>.','İş ona yapıldı (-ıldı).']])}
${WR('I written a letter.','I <b>have written</b> a letter.','V3 tek başına yüklem olamaz; önüne have gelmeli.')}
${WR('The bridge built in 1990.','The bridge <b>was built</b> in 1990.','Köprü kendisi inşa etmedi, inşa edildi → be + V3.')}

<h3>2. -ing hali ve to + V1</h3>

['Bir ismin arkasında → "-an / -en"','People <b>living</b> here are happy.','Burada <b>yaşayan</b> insanlar mutlu.']])}

<h3>3. Düzenli fiiller: V2 ve V3 kolay</h3>
${TALK('İngilizce fiillerin çoğu <b>düzenlidir</b>: V2 ve V3\'ü yapmak için sonuna sadece <b>-ed</b> eklersin. İkisi de aynı olur.')}

body:`

{k:'v1',re:/\bV1\b/,t:'V1 (fiilin yalın hali)',d:'Fiilin sözlükte yazan çıplak hali. Hiçbir ek almamış. Türkçedeki "gel", "yap", "çalış" gibi.',ex:'work (çalış), go (git), write (yaz)'},
{k:'v2',re:/\bV2\b/,t:'V2 (fiilin geçmiş hali)',d:'Fiilin "-dı, -di" anlamı veren hali. Sadece "dün yaptım, geçen yıl gitti" gibi geçmişi anlatırken kullanılır.',ex:'worked (çalıştı), went (gitti), wrote (yazdı)'},
{k:'v3',re:/\bV3\b/,t:'V3 (fiilin 3. hali)',d:'Fiilin tek başına kullanılmayan, hep bir yardımcıyla gelen hali. "have" ile gelirse "-mış / -dı" (I have written = yazdım), "be" ile gelirse "-ıldı / -ılır" (It was written = yazıldı) anlamı verir. Türkçedeki "yazılmış, yapılmış" kelimesine benzer.',ex:'worked, gone (gitmiş), written (yazılmış), done (yapılmış)'},

{k:'fiil',re:/(?<![a-zçğıöşü])fiil(?!imsi)/i,t:'Fiil',d:'Bir işi, eylemi ya da oluşu anlatan kelime. Türkçede sonuna "-mak / -mek" ekleyebildiğin her kelime: gelmek, yazmak, olmak.',ex:'go (gitmek), build (inşa etmek), increase (artmak)'},
{k:'yuklem',re:/yüklem/i,t:'Yüklem',d:'Cümlede asıl işi söyleyen fiil. Türkçede cümlenin en sonundaki kelime: "Ali kitabı <b>okudu</b>." İngilizcede öznenin hemen arkasına gelir: "Ali <b>read</b> the book."',ex:'Scientists <b>discovered</b> a virus. (keşfetti)'},
{k:'ozne',re:/(?<![a-zçğıöşü])özne/i,t:'Özne',d:'İşi yapan kişi ya da şey. Yükleme "kim?" ya da "ne?" diye sorunca çıkan cevap. "<b>Ali</b> kitabı okudu" → kim okudu? Ali.',ex:'<b>The doctor</b> examined the patient. (Doktor)'},
{k:'nesne',re:/(?<![a-zçğıöşü])nesne/i,t:'Nesne',d:'İşten etkilenen şey. Yükleme "neyi? kimi?" diye sorunca çıkan cevap. "Ali <b>kitabı</b> okudu" → neyi okudu? Kitabı.',ex:'The doctor examined <b>the patient</b>. (hastayı)'},
{k:'isim',re:/(?<![a-zçğıöşü])isim(?! cümleci)/i,t:'İsim',d:'Bir varlığın, kavramın adı. Önüne "bir" ya da "bu" koyabildiğin kelime: bir kitap, bu sorun, bir fikir.',ex:'book (kitap), problem (sorun), information (bilgi)'},
{k:'sifat',re:/(?<![a-zçğıöşü])sıfat(?! cümleci)/i,t:'Sıfat',d:'İsmin nasıl olduğunu söyleyen kelime. "Nasıl bir?" sorusunun cevabı: <b>büyük</b> ev, <b>önemli</b> karar.',ex:'big (büyük), important (önemli), dangerous (tehlikeli)'},
{k:'zarf',re:/(?<![a-zçğıöşü])zarf(?! cümleci)/i,t:'Zarf',d:'Fiilin nasıl yapıldığını söyleyen kelime. "Nasıl?" sorusunun cevabı: <b>hızlıca</b> koştu, <b>dikkatle</b> okudu. İngilizcede çoğu -ly ile biter.',ex:'quickly (hızla), carefully (dikkatle), significantly (önemli ölçüde)'},
{k:'zamir',re:/(?<![a-zçğıöşü])zamir/i,t:'Zamir',d:'İsmin yerine kullanılan kelime. Aynı ismi tekrar etmemek için: "Ali geldi. <b>O</b> yorgundu."',ex:'I (ben), he (o), they (onlar), it (o – şey)'},
{k:'edat',re:/(?<![a-zçğıöşü])edat/i,t:'Edat',d:'İsimlerin önüne gelip yer, zaman, yön bildiren küçük kelime. Türkçede bunları çoğunlukla eklerle yaparız: ev<b>de</b>, okul<b>a</b>, Ankara\'<b>dan</b>. İngilizcede ayrı kelimedir.',ex:'in the house (evde), to school (okula), from Ankara (Ankara\'dan)'},
{k:'baglac',re:/(?<![a-zçğıöşü])bağlaç/i,t:'Bağlaç',d:'İki cümleyi ya da iki kelimeyi birbirine bağlayan kelime: ve, ama, çünkü, -e rağmen, eğer.',ex:'and (ve), but (ama), because (çünkü), although (-e rağmen)'},
{k:'yardimci',re:/yardımcı fiil/i,t:'Yardımcı fiil',d:'Kendi başına anlam taşımayan, asıl fiile "zaman" ya da "olumsuzluk" katmak için yanına gelen fiil. Türkçeye çevrilmez. Üç tane var: <b>be</b> (am/is/are), <b>have</b> (has/had), <b>do</b> (does/did).',ex:'She <b>is</b> working. They <b>have</b> finished. He <b>didn\'t</b> come.'},
{k:'kip',re:/(?<![a-zçğıöşü])kip/i,t:'Kip (modal)',d:'Fiile "-ebilir, -meli, -malı, -miş olmalı" anlamı katan kelime. Fiilin önüne gelir ve fiil yalın kalır.',ex:'can (-ebilir), must (-meli), should (-malı), may (-ebilir, olabilir)'},
{k:'edilgen',re:/edilgen/i,t:'Edilgen (passive)',d:'İşi kimin yaptığı değil, ne yapıldığı önemli olduğunda kullanılan yapı. Türkçede "-ıl, -ın" eki: yap<b>ıl</b>dı, inşa ed<b>il</b>di. İngilizcede be + V3.',ex:'The bridge <b>was built</b>. (Köprü inşa edildi.)'},
{k:'etken',re:/(?<![a-zçğıöşü])etken/i,t:'Etken (active)',d:'İşi yapanın özne olduğu normal cümle. "Mühendisler köprüyü <b>inşa etti</b>."',ex:'Engineers <b>built</b> the bridge.'},
{k:'gecissiz',re:/geçişsiz/i,t:'Geçişsiz fiil',d:'Nesne almayan fiil. "Neyi?" diye soramazsın: "Kaza <b>oldu</b>" (neyi oldu? soru anlamsız). Bu fiiller edilgen yapılamaz.',ex:'occur (olmak), happen (olmak), die (ölmek), arise (ortaya çıkmak)'},
{k:'gecisli',re:/(?<![a-zçğıöşü])geçişli/i,t:'Geçişli fiil',d:'Nesne alan fiil. "Neyi? Kimi?" diye sorabilirsin: "Köprüyü <b>inşa etti</b>" (neyi? köprüyü).',ex:'build (inşa etmek), reduce (azaltmak), cause (neden olmak)'},
{k:'durum',re:/durum fiil/i,t:'Durum fiili',d:'Bir hareket değil bir durum anlatan fiil: bilmek, inanmak, içermek, sahip olmak. Bunlara -ing eklenmez; "I am knowing" denmez, "I know" denir.',ex:'know (bilmek), believe (inanmak), contain (içermek)'},
{k:'mastar',re:/mastar|to V1|to \+ V1|to V\b/i,t:'Mastar (to + V1)',d:'Fiilin önüne "to" gelmiş hali. Türkçedeki "-mak / -mek" ya da "-mek için" anlamı verir.',ex:'I want <b>to go</b>. (Gitmek istiyorum.)'},
{k:'sayilamayan',re:/sayılamayan|sayılamaz/i,t:'Sayılamayan isim',d:'Tek tek sayamadığın, çoğul yapamadığın isim. "Bir su, iki su" diyemezsin. İngilizcede -s almaz, "a / an" almaz.',ex:'water (su), money (para), information (bilgi), advice (tavsiye)'},
{k:'sayilabilen',re:/sayılabil/i,t:'Sayılabilen isim',d:'Tek tek sayabildiğin isim: bir kitap, iki kitap. Çoğul olur (books), "a / an" alır.',ex:'book, student, idea, country'},
{k:'tekil',re:/(?<![a-zçğıöşü])tekil/i,t:'Tekil',d:'Bir tane. Fiil de buna uyar: he/she/it ile -s alır (she works), "is" ve "has" kullanılır.',ex:'a book, the student, it'},
{k:'cogul',re:/(?<![a-zçğıöşü])çoğul/i,t:'Çoğul',d:'Birden fazla. Türkçedeki "-ler, -lar". İngilizcede genelde -s eki: books. Fiil "are", "have" olur.',ex:'books, students, they'},
{k:'artikel',re:/artikel|a \/ an \/ the/i,t:'Artikel (a / an / the)',d:'İsmin önüne gelen küçük kelimeler. "a / an" = bir (herhangi bir). "the" = bildiğimiz o şey. Türkçede tam karşılığı yok.',ex:'a book (bir kitap), the book (o kitap, bildiğimiz kitap)'},
{k:'iyelik',re:/iyelik/i,t:'İyelik',d:'Sahiplik. Türkçedeki "benim, senin, onun" ve "-ım, -ın" ekleri.',ex:'my book (kitabım), their house (onların evi)'},
{k:'present',re:/Present Perfect(?! Continuous)/,t:'Present Perfect',d:'have / has + V3. Türkçede tam karşılığı yok. Geçmişte olan ama şimdiye bağlı olan şeyler: "<b>-dır</b>, <b>-den beri</b>" ya da sonucu şimdi önemli olan "<b>-dı</b>". Kısaca: "geçmişte oldu, etkisi hâlâ var".',ex:'I <b>have lived</b> here for ten years. (On yıldır burada yaşıyorum.)'},
{k:'simplepast',re:/Simple Past/,t:'Simple Past',d:'"-dı, -di" geçmiş zamanı. Geçmişte belli bir zamanda olup bitmiş şeyler.',ex:'I <b>visited</b> Ankara last year. (Geçen yıl Ankara\'yı ziyaret ettim.)'},
{k:'simplepresent',re:/Simple Present|geniş zaman/i,t:'Geniş zaman (Simple Present)',d:'"-ır, -er" zamanı. Her zaman doğru olan şeyler ve alışkanlıklar: "Su 100 derecede kaynar."',ex:'Water <b>boils</b> at 100°C. (Su 100 derecede kaynar.)'},
{k:'continuous',re:/Present Continuous|şimdiki zaman/i,t:'Şimdiki zaman (Present Continuous)',d:'"-yor" zamanı. Şu anda ya da bu aralar süren şeyler. am / is / are + -ing.',ex:'She <b>is studying</b>. (Ders çalışıyor.)'},
{k:'pastperf',re:/Past Perfect(?! Continuous)/,t:'Past Perfect',d:'had + V3. Türkçedeki "<b>-mıştı</b>". Geçmişte iki olay varsa önce olanı anlatır.',ex:'When I arrived, the film <b>had started</b>. (Vardığımda film başlamıştı.)'},
{k:'futperf',re:/Future Perfect(?! Continuous)/,t:'Future Perfect',d:'will have + V3. Türkçedeki "<b>-miş olacak</b>". Gelecekte bir tarihe kadar bitmiş olacak şeyler.',ex:'By 2030 they <b>will have finished</b>. (2030\'a kadar bitirmiş olacaklar.)'},
{k:'sifatc',re:/sıfat cümleci/i,t:'Sıfat cümleciği',d:'Bir ismi bütün bir cümleyle anlatan kısım. Türkçedeki "-en, -an, -dığı": "penisilini <b>keşfeden</b> bilim insanı". İngilizcede who / which / that ile başlar.',ex:'the man <b>who called me</b> (beni arayan adam)'},
{k:'isimc',re:/isim cümleci/i,t:'İsim cümleciği',d:'Bir cümlenin içinde isim gibi kullanılan cümle. Türkçedeki "-dığını, -ip -madığını": "Onun <b>haklı olduğunu</b> biliyorum."',ex:'I know <b>that he is right</b>.'},
{k:'zarfc',re:/zarf cümleci/i,t:'Zarf cümleciği',d:'Ana cümleye zaman, sebep, koşul, zıtlık gibi bilgi ekleyen yan cümle. because, although, when, if gibi bağlaçlarla başlar.',ex:'<b>Although it rained</b>, we went out. (Yağmur yağmasına rağmen çıktık.)'},
{k:'yancumle',re:/yan cümle/i,t:'Yan cümle',d:'Kendi başına tam anlam vermeyen, ana cümleye bağlı cümle. Genelde bir bağlaçla başlar: "<b>Çünkü yağmur yağıyordu</b>" tek başına eksik kalır.',ex:'<b>because it was raining</b>'},
{k:'anacumle',re:/ana cümle/i,t:'Ana cümle',d:'Cümlenin asıl, tek başına anlamlı olan kısmı. Yan cümleleri çıkarınca geriye kalan.',ex:'Although it rained, <b>we went out</b>.'},
{k:'devrik',re:/devrik/i,t:'Devrik yapı',d:'Cümlenin başına "never, not only, only after" gibi bir kelime gelince yardımcı fiilin öznenin önüne geçmesi. Soru cümlesine benzer ama soru değildir. Anlam değişmez, vurgu güçlenir.',ex:'Never <b>have I</b> seen such a storm. (Hiç böyle bir fırtına görmedim.)'},
{k:'kisaltma',re:/kısaltma/i,t:'Kısaltma',d:'Uzun bir yan cümlenin kısaltılmış hali. "who are working" yerine sadece "working", "which was built" yerine sadece "built".',ex:'the bridge <b>built</b> in 1890 (1890\'da inşa edilen köprü)'},
{k:'comparative',re:/comparative|karşılaştırma/i,t:'Karşılaştırma (comparative)',d:'"Daha …" demek: daha büyük, daha önemli. Kısa sıfatlara -er, uzunlara more eklenir.',ex:'bigger (daha büyük), more important (daha önemli)'},
{k:'superlative',re:/superlative|en üstünlük/i,t:'En üstünlük (superlative)',d:'"En …" demek: en büyük, en önemli. the + -est ya da the most.',ex:'the biggest (en büyük), the most important (en önemli)'},

const WORDS=[];

const WMAP=Object.fromEntries(WORDS.map(w=>[w.en,w]));
const synOf=en=>{const s=new Set([en]);SYN.forEach(g=>{if(g.includes(en))g.forEach(x=>s.add(x))});return [...s]};
const BE='(?:be|is|are|was|were|been|being|am)';
/* Öbek fiil ve kalıplarda ilk kelimenin çekimli hallerini de yakala (take → takes/took değil ama takes, be → is/are) */
const reFor=en=>{const w=WMAP[en];const parts=en.split(' ').map(p=>p.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));
  if(w&&(w.cat==='kalip'||w.cat==='phrasal')&&parts.length>1){parts[0]=parts[0]==='be'?BE:parts[0]+'(?:s|es|d|ed|ing)?';}
  return new RegExp('\\b'+parts.join('\\s+')+'\\b','i');};

const addDays=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const dayDiff=(a,b)=>Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5);

function rate(r){

/* kelime sorusu üretici */
function makeVocabQ(w){
  const re=reFor(w.en);
  if(!re.test(w.ex))return null;
  const syn=synOf(w.en);
  const isBe=w.en.startsWith('be ');
  const label=x=>isBe?x.replace(/^be /,''):x;
  const pool=CATS.find(c=>c.id===w.cat).words.filter(x=>x.en!==w.en&&!syn.includes(x.en)&&!synOf(x.en).includes(w.en)&&(x.en.startsWith('be ')===isBe));
  const dis=pick(pool,4);
  const all=shuffle([w,...dis]);
  const q=isBe?w.ex.replace(re,m=>m.split(/\s+/)[0]+' ----'):w.ex.replace(re,'----');
  return {q,o:all.map(x=>label(x.en)),a:all.indexOf(w),k:'kelime',
    e:`Doğru cevap: ${w.en} (okunuş: ${w.ok}) = ${w.tr}`,
    full:w.ex,fullTr:w.ext,
    why:all.map(x=>x===w?null:`${x.en} (${x.ok}) = ${x.tr}. Anlam cümleye uymuyor.`)};
}
function vocabSet(pool,n){return pick(pool,n*2).map(makeVocabQ).filter(Boolean).slice(0,n);}

/* ===================== ÇEVİRİ + TERİM AÇIKLAMALARI ===================== */
const normT=s=>s.replace(/\s+/g,' ').trim();
const stripT=s=>s.replace(/<[^>]+>/g,'');
function fillQ(q){let s=q.q;const ans=q.o[q.a];if(!s.includes('----'))return normT(s);const p=s.split('----');
  if(p.length===2)return normT(p[0]+ans+p[1]);const a=ans.split(' / ');return normT(p.map((x,i)=>x+(i<p.length-1?(a[i]||''):'')).join(''));}
const trQ=q=>q&&q.q?TRX['Q::'+fillQ(q)]:null;
function decorate(){
  const cards=main.querySelectorAll('.lesson');if(!cards.length)return;
  cards.forEach(card=>{
    card.querySelectorAll('td').forEach(c=>{if(c.querySelector('.trx'))return;
      const parts=c.innerHTML.split(/<br\s*\/?>/i);let hit=false;
      const out=parts.map(p=>{const t=TRX[normT(stripT(p))];if(t){hit=true;return p+`<span class="trx">${esc(t)}</span>`;}return p;});
      if(hit)c.innerHTML=out.join('<br>');});
    card.querySelectorAll('.w-v').forEach(x=>{if(x.querySelector('.trx'))return;const t=TRX[normT(x.textContent.replace(/^✔/,''))];if(t)x.insertAdjacentHTML('beforeend',`<span class="trx">${esc(t)}</span>`);});
    card.querySelectorAll('.sq').forEach(x=>{const t=TRX[normT(x.textContent)];if(t&&!x.nextElementSibling?.classList.contains('trx'))x.insertAdjacentHTML('afterend',`<p class="trx sqt">Türkçesi: ${esc(t)}</p>`);});
    /* terimler: her kartta her terimin ilk geçtiği yer */
    const used=new Set();
    const walker=document.createTreeWalker(card,NodeFilter.SHOW_TEXT,{acceptNode:n=>{const p=n.parentElement;
      if(!p||p.closest('.svl,.trx,button,.term,th,.ft,.so,code'))return NodeFilter.FILTER_REJECT;return n.nodeValue.trim()?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT;}});
    const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
    nodes.forEach(n=>{let txt=n.nodeValue;let best=null;
      TERMS.forEach((T,i)=>{if(used.has(T.k))return;const m=txt.match(T.re);if(m&&(best===null||m.index<best.m.index))best={T,m};});
      if(!best)return;used.add(best.T.k);
      const {m,T}=best;const before=txt.slice(0,m.index),word=m[0],after=txt.slice(m.index+word.length);
      const b=document.createElement('button');b.className='term';b.dataset.act='term';b.dataset.k=T.k;b.textContent=word;b.title='Ne demek?';
      const f=document.createDocumentFragment();if(before)f.append(before);f.append(b);if(after)f.append(after);n.replaceWith(f);});
  });
}
function showTerm(k){const T=TERMS.find(x=>x.k===k);if(!T)return;let sh=document.getElementById('sheet');
  if(!sh){sh=document.createElement('div');sh.id='sheet';document.body.appendChild(sh);}
  sh.innerHTML=`<div class="sheet-in" role="dialog" aria-label="${esc(T.t)}"><div class="row between"><b class="sheet-t">${esc(T.t)}</b><button class="btn ghost" data-act="closesheet" aria-label="Kapat">✕</button></div><p>${T.d}</p><p class="sheet-ex"><span class="eyebrow">Örnek</span><br>${T.ex}</p><button class="btn" data-act="glossary">Bütün terimler</button></div>`;
  sh.hidden=false;}

/* ===================== AYRINTILI ÇÖZÜM ===================== */
function explHTML(q,a,showVerdict){
  let h='';
  if(showVerdict)h+=`<b class="verdict" style="color:${a===q.a?'var(--ok)':'var(--bad)'}">${a===q.a?'Doğru!':(a===null?'Boş bıraktın.':'Yanlış.')+' Doğru cevap '+L[q.a]+'.'}</b>`;
  h+=`<p>${esc(q.e)}</p>`;
  if(q.full)h+=`<p class="muted"><b>Tam cümle:</b> ${esc(q.full)}</p>`;
  if(q.fullTr)h+=`<p class="muted"><b>Türkçesi:</b> ${esc(q.fullTr)}</p>`;
  const qt=!q.fullTr&&trQ(q);if(qt)h+=`<p class="qtr"><b>Cümlenin Türkçesi:</b> ${esc(qt)}</p>`;
  if(q.parts)h+=`<div class="sol"><div class="soltitle">Cümle analizi</div><div class="tablewrap"><table class="t parts"><tr><th>${q.dir==='tr'?'Türkçe parça':'İngilizce parça'}</th><th>${q.dir==='tr'?'İngilizce karşılığı':'Türkçe karşılığı'}</th></tr>${q.parts.map(p=>`<tr><td>${esc(p[0])}</td><td>${esc(p[1])}</td></tr>`).join('')}</table></div></div>`;
  if(q.keys)h+=`<div class="sol"><div class="soltitle">Anahtar kalıplar</div><ul class="keys">${q.keys.map(k=>`<li>${esc(k)}</li>`).join('')}</ul></div>`;
  if(q.steps)h+=`<div class="sol"><div class="soltitle">Adım adım çözüm</div><ol class="steps">${q.steps.map(k=>`<li>${esc(k)}</li>`).join('')}</ol></div>`;
  if(q.why)h+=`<div class="sol"><div class="soltitle">Şıklar tek tek</div><ul class="why">${q.o.map((o,j)=>`<li class="${j===q.a?'w-ok':'w-bad'}"><span class="bub sm">${L[j]}</span><span>${j===q.a?'<b>Doğru.</b> '+esc(q.whyOk||'Anlam, zaman ve kalıplar cümleyle birebir örtüşüyor.'):esc(q.why[j]||'')}</span></li>`).join('')}</ul></div>`;
  return h;
}
