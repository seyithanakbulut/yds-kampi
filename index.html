{id:'relative',grp:'yds',t:'Sıfat Cümlecikleri',en:'Relative Clauses',s:'who, which, that, whose, where, when; edat + which/whom; most of whom',body:`
<p>Sıfat cümleciği bir ismi <b>tanımlar ya da hakkında bilgi verir</b>. Türkçedeki "-en, -an, -dığı" eklerinin karşılığıdır.</p>
${EX('The scientist <u>who discovered penicillin</u> was Alexander Fleming.','Penisilini keşfeden bilim insanı Alexander Fleming\'di.')}

<h3>1. İlgi zamirleri</h3>
<table class="t"><tr><th>Zamir</th><th>Neyi niteler?</th><th>Görevi</th><th>Örnek</th></tr>
<tr><td><b>who</b></td><td>İnsan</td><td>Özne (ve günlük dilde nesne)</td><td>the doctor <u>who treated me</u></td></tr>
<tr><td><b>whom</b></td><td>İnsan</td><td>Nesne; edattan sonra</td><td>the man <u>whom</u> I met / the person <u>to whom</u> I spoke</td></tr>
<tr><td><b>which</b></td><td>Nesne, hayvan, fikir</td><td>Özne veya nesne</td><td>the book <u>which</u> I read</td></tr>
<tr><td><b>that</b></td><td>İnsan ya da nesne</td><td>Sadece virgülsüz cümlelerde</td><td>the car <u>that</u> I bought</td></tr>
<tr><td><b>whose</b> + isim</td><td>Sahiplik (onun …)</td><td>—</td><td>the student <u>whose</u> father is a doctor</td></tr>
<tr><td><b>where</b></td><td>Yer (= in/at which)</td><td>Arkasından tam cümle</td><td>the city <u>where</u> I was born</td></tr>
<tr><td><b>when</b></td><td>Zaman (= in/on which)</td><td>Arkasından tam cümle</td><td>the year <u>when</u> the war ended</td></tr>
<tr><td><b>why</b></td><td>Sebep (the reason why)</td><td>—</td><td>the reason <u>why</u> he left</td></tr></table>

<h3>2. where mi which mi? En sık tuzak</h3>
<p>Arkasından gelen cümle <b>eksiksizse</b> (öznesi ve nesnesi varsa) → <b>where / when</b>. Cümlede <b>özne ya da nesne eksikse</b> → <b>which / that</b>.</p>
${EX('This is the village <u>where</u> my father was born. (cümle tam: my father was born)','Bu, babamın doğduğu köy.')}
${EX('This is the village <u>which</u> we visited last year. (visited\'in nesnesi eksik)','Bu, geçen yıl ziyaret ettiğimiz köy.')}

<h3>3. Virgüllü ve virgülsüz cümlecikler</h3>
<table class="t"><tr><th>Virgülsüz (tanımlayan)</th><th>Virgüllü (ek bilgi veren)</th></tr>
<tr><td>Hangisi olduğunu belirler, çıkarılırsa anlam bozulur.</td><td>Ek bilgi verir, çıkarılsa da cümle anlaşılır.</td></tr>
<tr><td><i>Students <u>who study regularly</u> pass the exam.</i></td><td><i>Ankara, <u>which is the capital of Turkey</u>, is a large city.</i></td></tr>
<tr><td>that kullanılabilir</td><td><b>that kullanılamaz</b></td></tr></table>
${TRAP('Virgülden sonra <b>that</b> gelmez. Edattan sonra da <b>that</b> ve <b>who</b> gelmez: "in which" ✔, "in that" ✘, "with whom" ✔, "with who" ✘.')}

<h3>4. Edat + which / whom</h3>
<p>Fiilin edatı cümleciğin başına taşınabilir. Akademik dilde çok yaygındır.</p>
${EX('The house <u>in which</u> he lived is now a museum. (= the house which he lived in)','Yaşadığı ev şimdi müze.')}
${EX('The colleague <u>with whom</u> I work is very friendly.','Birlikte çalıştığım meslektaşım çok cana yakın.')}
<p>Edatı belirlemek için fiilin hangi edatı aldığına bak: depend <b>on</b> which, consist <b>of</b> which, refer <b>to</b> which, the speed <b>at</b> which, the extent <b>to</b> which, the way <b>in</b> which.</p>

<h3>5. Miktar + of + whom / which</h3>
<table class="t"><tr><th>Yapı</th><th>Örnek</th></tr>
<tr><td>most / many / some / all / none / both / half / two + <b>of whom</b> (insan)</td><td>300 people attended, <u>most of whom</u> were students.</td></tr>
<tr><td>… + <b>of which</b> (nesne)</td><td>He wrote ten books, <u>three of which</u> became bestsellers.</td></tr></table>
${TRAP('"most of them" iki cümleyi <b>bağlayamaz</b> (bağlaç değil). Virgülle bağlanan ikinci cümlede "of whom / of which" gerekir.')}

<h3>6. whose</h3>
${EX('Marie Curie, <u>whose research</u> changed physics, won two Nobel Prizes.','Araştırmaları fiziği değiştiren Marie Curie iki Nobel ödülü kazandı.')}
<p><b>whose</b> her zaman bir isimle gelir ve "onun …" anlamı verir; nesneler için de kullanılabilir: <i>a house whose roof is red</i>.</p>

<h3>7. which ile önceki cümlenin tamamını işaret etmek</h3>
${EX('Prices rose sharply, <u>which</u> caused protests.','Fiyatlar keskin bir şekilde yükseldi, bu da protestolara yol açtı.')}
<p>Virgül + which, önceki bütün olayı işaret eder; Türkçeye "bu da …" diye çevrilir.</p>

<h3>8. Kısaltma (reduction)</h3>
<table class="t"><tr><th>Uzun</th><th>Kısa</th><th>Kural</th></tr>
<tr><td>the people <u>who live</u> here</td><td>the people <u>living</u> here</td><td>Etken → V-ing</td></tr>
<tr><td>the bridge <u>which was built</u> in 1890</td><td>the bridge <u>built</u> in 1890</td><td>Edilgen → V3</td></tr>
<tr><td>the first man <u>who walked</u> on the Moon</td><td>the first man <u>to walk</u> on the Moon</td><td>the first/last/only + to V</td></tr></table>
<p>Ayrıntısı "Kısaltmalar" konusunda.</p>`,
qs:[
QW('Marie Curie, ---- research on radioactivity earned her two Nobel Prizes, was born in Poland.',['who','which','whose','that','whom'],'C','"Onun araştırması" anlamı → sahiplik: whose research.',['who arkasından isim değil fiil gelir.','which nesneler içindir ve sahiplik bildirmez.',null,'Virgüllü cümlecikte that kullanılmaz; ayrıca sahiplik bildirmez.','whom nesne zamiridir; arkasından "research earned" gelemez.']),
QW('The village ---- my grandfather was born has now become a modern town.',['which','where','when','whose','what'],'B','Arkadaki cümle tam (my grandfather was born) ve yer bildiriyor → where.',['which kullanmak için cümlede eksik öğe olmalıydı (was born in olmadan "in which" gerekirdi).',null,'when zaman bildirir.','whose sahiplik ve isim ister.','what isim cümleciği kurar, isimden sonra gelmez.']),
QW('The conference was attended by 300 scientists, most of ---- came from Europe.',['them','who','whom','which','whose'],'C','Miktar + of + insan → most of whom. "them" iki cümleyi bağlayamaz.',['"most of them" bağlaç değildir; iki cümle bağlanamaz.','Edattan (of) sonra who gelmez.',null,'which insanlar için kullanılmaz.','whose sahiplik bildirir, isim ister.']),
QW('The speed ---- the virus spread surprised even the experts.',['which','in which','at which','that','where'],'C','"spread at a speed" (… hızla yayılmak) kalıbı → the speed at which.',['Edat eksik; "spread the speed" anlamsız.','"in a speed" yanlış edat.',null,'Edat eksik.','where yer bildirir.']),
QW('Prices rose by 40 percent last year, ---- led to widespread protests.',['that','which','what','who','it'],'B','Virgülden sonra önceki cümlenin tamamını işaret eden ilgi zamiri → which (bu da …).',['Virgülden sonra that kullanılmaz.',null,'what önceki cümleyi işaret etmez.','who insanlar içindir.','"it" iki cümleyi bağlamaz; virgülle bağlanması hatalı olur.']),
QW('The colleague ---- I worked on the project has moved to another university.',['who','whom','with whom','with who','that'],'C','"work with someone" kalıbı → edat cümleciğin başına: with whom.',['Edat eksik: "worked on the project" ile kim olduğu bağlanmıyor.','Edat eksik.',null,'Edattan sonra who gelmez.','Edat eksik.'])]},

{id:'noun',grp:'yds',t:'İsim Cümlecikleri',en:'Noun Clauses',s:'that, whether/if, what, wh- kelimeleri, "the fact that", soru düzeni tuzağı',body:`
<p>İsim cümleciği, bir cümlede <b>isim görevi</b> gören yan cümledir: özne, nesne ya da edattan sonra gelir. Türkçede "-dığı, -dığını, -ip -madığı" diye çevrilir.</p>
${EX('I know <u>that he is right</u>. / <u>What he said</u> surprised everyone.','Onun haklı olduğunu biliyorum. / Söylediği şey herkesi şaşırttı.')}

<h3>1. that ile başlayanlar</h3>
<table class="t"><tr><th>Görev</th><th>Örnek</th><th>Türkçesi</th></tr>
<tr><td>Nesne</td><td>Studies show <u>that sleep improves memory</u>.</td><td>Çalışmalar uykunun hafızayı geliştirdiğini gösteriyor.</td></tr>
<tr><td>Özne</td><td><u>That the Earth is round</u> is a fact.</td><td>Dünyanın yuvarlak olduğu bir gerçektir.</td></tr>
<tr><td>It + … + that</td><td><u>It is clear that</u> the plan failed.</td><td>Planın başarısız olduğu açık.</td></tr>
<tr><td>İsim + that</td><td>the fact / idea / belief / evidence <u>that</u> …</td><td>… olduğu gerçeği / fikri / inancı / kanıtı</td></tr></table>
${TIP('Edattan sonra "that" gelmez; "the fact that" kullanılır: <i>Despite <u>the fact that</u> he was ill, …</i>')}

<h3>2. whether / if (-ip -mediği)</h3>
<p>Belirsizlik, soru, şüphe varsa kullanılır.</p>
${EX('Nobody knows <u>whether</u> the treatment will work (or not).','Tedavinin işe yarayıp yaramayacağını kimse bilmiyor.')}
<table class="t"><tr><th>Sadece whether</th><th>Örnek</th></tr>
<tr><td>Cümle başında</td><td><u>Whether</u> he comes or not is not important.</td></tr>
<tr><td>Edattan sonra</td><td>It depends <u>on whether</u> we have money.</td></tr>
<tr><td>to V'den önce</td><td>He couldn't decide <u>whether to accept</u>.</td></tr>
<tr><td>"or not" hemen arkasından</td><td>whether or not</td></tr></table>
${TIP('Belirsizlik bildiren kelimeler whether ister: <b>unclear, uncertain, not sure, doubt, ask, wonder, question, depend on, decide</b>.')}

<h3>3. what (-dığı şey)</h3>
<p><b>what = the thing(s) that</b>. Arkasındaki cümlede bir öğe (özne ya da nesne) <b>eksiktir</b>.</p>
${EX('<u>What</u> surprised scientists was the speed of the change. (surprised\'ın öznesi eksik)','Bilim insanlarını şaşırtan şey değişimin hızıydı.')}
${EX('This is exactly <u>what</u> we need. (need\'in nesnesi eksik)','Bu tam olarak ihtiyacımız olan şey.')}
${TRAP('<b>that</b> sonrası cümle <b>tamdır</b>, <b>what</b> sonrası cümle <b>eksiktir</b>. "The thing what" ✘ olur; ya "the thing that" ya sadece "what".')}

<h3>4. Soru kelimeleriyle (who, why, how, when, where, which, how much…)</h3>
<p>Soru kelimesinden sonra <b>soru düzeni değil, normal cümle düzeni</b> gelir.</p>
<table class="t"><tr><th>Soru</th><th>İsim cümleciği</th></tr>
<tr><td>Why <b>did the dinosaurs die</b> out?</td><td>We don't know why <b>the dinosaurs died</b> out.</td></tr>
<tr><td>Where <b>is</b> the station?</td><td>Can you tell me where the station <b>is</b>?</td></tr>
<tr><td>How much <b>does it cost</b>?</td><td>I wonder how much <b>it costs</b>.</td></tr></table>
${TRAP('"I don\'t know where <s>is the station</s>" ✘. Şıklarda yardımcı fiil özneden önce geliyorsa (soru düzeni) o şık yanlıştır.')}

<h3>5. -ever kelimeleri</h3>
<table class="t"><tr><th>Kelime</th><th>Anlam</th><th>Örnek</th></tr>
<tr><td>whatever</td><td>ne … -se</td><td>You can eat <u>whatever</u> you want.</td></tr>
<tr><td>whoever</td><td>kim … -se</td><td><u>Whoever</u> wins will get a prize.</td></tr>
<tr><td>whichever</td><td>hangisi … -se</td><td>Choose <u>whichever</u> you like.</td></tr>
<tr><td>wherever / whenever / however</td><td>nerede / ne zaman / nasıl … -se</td><td><u>However</u> hard he tried, he failed.</td></tr></table>

<h3>6. Dolaylı anlatım (reported speech) kısa özet</h3>
<p>Geçmiş zamanlı bir fiille (said, told, reported) aktarılan cümlede zaman bir adım geriye kayar:</p>
<table class="t"><tr><th>Doğrudan</th><th>Dolaylı</th></tr>
<tr><td>"I <b>am</b> tired."</td><td>He said (that) he <b>was</b> tired.</td></tr>
<tr><td>"We <b>will</b> win."</td><td>They said they <b>would</b> win.</td></tr>
<tr><td>"I <b>have finished</b>."</td><td>She said she <b>had finished</b>.</td></tr></table>
<p>Bilimsel gerçeklerde kaydırma yapılmayabilir: <i>The teacher said that water <u>boils</u> at 100°C.</i></p>

<h3>7. Önerme, istek fiilleri (subjunctive)</h3>
<p><b>suggest, recommend, insist, demand, require, propose, it is essential/important/necessary that</b> + özne + <b>V1</b> (should olmadan da, -s almadan):</p>
${EX('The doctor recommended that he <u>stop</u> smoking. / It is essential that every child <u>receive</u> education.','Doktor sigarayı bırakmasını önerdi. / Her çocuğun eğitim alması şarttır.')}`,
qs:[
QW('Scientists still do not know exactly ---- dinosaurs became extinct so suddenly.',['what','that','why','which','whose'],'C','Arkadaki cümle tam (dinosaurs became extinct) ve "neden" sorusu soruluyor → why.',['what sonrası cümlede eksik öğe olmalı; burada cümle tam.','"that" kesin bilgi bildirir; "tam olarak bilmiyorlar" belirsizlik ister ve anlam "neden" sorusu.',null,'which bir seçim bildirir, isim ister.','whose sahiplik bildirir, isim ister.']),
QW('---- the Earth revolves around the Sun was not accepted for centuries.',['What','That','Whether','Which','If'],'B','Kesin bir bilgi (Dünya Güneş\'in etrafında döner) cümlenin öznesi → That.',['what sonrası cümle eksik olmalı; burada tam.',null,'whether belirsizlik bildirir; bu kesin bir bilgi.','which bir seçim bildirir.','if cümle başında isim cümleciği olarak kullanılmaz.']),
QW('It is still unclear ---- the new drug will be effective against the virus.',['whether','that','what','which','whose'],'A','"unclear" belirsizlik bildirir → whether (-ip -mayacağı).',[null,'"It is unclear that" belirsizlikle çelişen bir yapı; whether gerekir.','what sonrası cümle eksik olmalı.','which seçim bildirir.','whose sahiplik bildirir.']),
QW('---- surprised the researchers most was the speed at which the disease spread.',['That','What','Which','Whether','It'],'B','"surprised" fiilinin öznesi eksik → What (-an şey).',['that sonrası cümle tam olmalı; burada surprised\'ın öznesi yok.',null,'which isim cümleciği başlatmaz (bu anlamda).','whether belirsizlik bildirir.','"It surprised the researchers most was…" iki yüklemli bozuk cümle olur.']),
QW('Can you tell me how much ----?',['does the course cost','the course costs','costs the course','did the course cost','the course does cost'],'B','Soru kelimesinden sonra isim cümleciğinde normal düzen: özne + fiil → the course costs.',['Soru düzeni (does + özne) isim cümleciğinde kullanılmaz.',null,'Fiil özneden önce gelmiş.','Soru düzeni ve zaman yanlış.','"does cost" vurgulu yapı; bu bağlamda doğal değil ve gereksiz.']),
QW('The doctor recommended that the patient ---- more exercise and less sugar.',['takes','took','take','will take','has taken'],'C','"recommend that" sonrası özne + yalın fiil (subjunctive) → take.',['-s eki almaz; subjunctive yalın fiil ister.','Geçmiş zaman kullanılmaz.',null,'will kullanılmaz.','Present Perfect kullanılmaz.'])]},

{id:'adverbial',grp:'yds',t:'Zarf Cümlecikleri ve Bağlaçlar',en:'Adverbial Clauses & Connectors',s:'Zıtlık, sebep, sonuç, amaç, zaman bağlaçları; cümle mi isim mi?',body:`
<p>YDS'nin <b>en kritik</b> konusu. Gramer, cloze test, cümle tamamlama, çeviri ve paragraf sorularının büyük kısmı bağlaçla çözülür.</p>
<p><b>Çözüm yöntemi iki adımlı:</b> <br>1) İki cümle arasındaki <b>anlam ilişkisini</b> bul (zıtlık mı, sebep mi, amaç mı?). <br>2) Bağlaçtan sonra gelen <b>yapıya</b> bak: tam cümle mi, isim/-ing mi, noktalı virgül mü?</p>

<h3>1. Üç bağlaç türü</h3>
<table class="t"><tr><th>Tür</th><th>Arkasından</th><th>Noktalama</th><th>Örnek</th></tr>
<tr><td><b>Bağlaç</b> (subordinator)</td><td>Tam cümle (özne + yüklem)</td><td>Cümle başında ya da ortasında</td><td><u>Although</u> it rained, we went out.</td></tr>
<tr><td><b>Edat</b> (preposition)</td><td>İsim, zamir ya da -ing</td><td>—</td><td><u>Despite</u> the rain, we went out.</td></tr>
<tr><td><b>Geçiş zarfı</b> (transition)</td><td>Yeni bir cümle başlatır</td><td>Nokta / noktalı virgül + zarf + virgül</td><td>It rained; <u>however</u>, we went out.</td></tr></table>

<h3>2. ZITLIK (contrast)</h3>
<table class="t"><tr><th>+ cümle</th><th>+ isim / -ing</th><th>Geçiş zarfı</th><th>Türkçesi</th></tr>
<tr><td>although, even though, though</td><td>despite, in spite of, regardless of</td><td>however, nevertheless, nonetheless, yet, still</td><td>-e rağmen, ancak, yine de</td></tr>
<tr><td>while, whereas</td><td>unlike</td><td>in contrast, on the other hand, by contrast</td><td>oysa, -iken, buna karşın</td></tr>
<tr><td>even if</td><td>—</td><td>—</td><td>-se bile</td></tr>
<tr><td>much as, however + sıfat</td><td>—</td><td>on the contrary</td><td>ne kadar … -se de; aksine</td></tr></table>
${EX('<u>Although</u> the treatment is expensive, it is very effective.<br><u>Despite</u> its high cost, the treatment is very effective.<br>The treatment is expensive; <u>nevertheless</u>, it is very effective.','Tedavi pahalı olmasına rağmen çok etkilidir.')}
${TRAP('<b>despite of</b> diye bir şey yoktur: <b>despite</b> ya da <b>in spite of</b>. Cümle bağlamak için: <i>despite <u>the fact that</u> + cümle</i>.')}
${TIP('<b>while / whereas</b> iki şeyi karşılaştırır (A şöyle, B ise böyle). <b>although</b> beklenmeyen bir sonuç bildirir (yağmur yağdı ama yine de çıktık).')}

<h3>3. SEBEP (cause)</h3>
<table class="t"><tr><th>+ cümle</th><th>+ isim / -ing</th><th>Türkçesi</th></tr>
<tr><td>because, since, as, now that, given that, seeing that, in that</td><td>because of, due to, owing to, on account of, as a result of, thanks to, in view of</td><td>çünkü, -dığı için, -den dolayı</td></tr></table>
${EX('The flight was cancelled <u>because</u> the weather was bad. / … <u>due to</u> bad weather.','Hava kötü olduğu için uçuş iptal edildi.')}

<h3>4. SONUÇ (result)</h3>
<table class="t"><tr><th>Yapı</th><th>Örnek</th><th>Türkçesi</th></tr>
<tr><td>; therefore, / ; thus, / ; hence, / ; consequently, / ; as a result, / ; accordingly,</td><td>He studied hard; <u>therefore</u>, he passed.</td><td>bu nedenle, sonuç olarak</td></tr>
<tr><td>, so + cümle</td><td>It was late, <u>so</u> we left.</td><td>bu yüzden</td></tr>
<tr><td>so + sıfat + that / such + isim + that</td><td>It was <u>so</u> cold <u>that</u> the lake froze.</td><td>o kadar … ki</td></tr>
<tr><td>, thereby + -ing / , thus + -ing</td><td>The drug blocks the virus, <u>thereby preventing</u> infection.</td><td>böylece</td></tr></table>
${TRAP('<b>because</b> sebebin önüne, <b>therefore / so</b> sonucun önüne gelir. "A, because B" = "B; therefore, A". Şıklarda bu ters çevrilir.')}

<h3>5. AMAÇ (purpose)</h3>
<table class="t"><tr><th>+ cümle</th><th>+ yalın fiil</th><th>Olumsuz amaç</th></tr>
<tr><td>so that, in order that (genelde can/could/will/would ile)</td><td>in order to, so as to, to</td><td>in order not to, so as not to, lest, for fear that</td></tr></table>
${EX('She saved money <u>so that</u> she <u>could</u> study abroad. = She saved money <u>in order to</u> study abroad.','Yurt dışında okuyabilmek için para biriktirdi.')}
${TRAP('"so that" sonrasında tam cümle (özne + modal + V1); "in order to" sonrasında yalın fiil. "for + -ing" amaç için değil, bir aletin işlevi için kullanılır: <i>a knife for cutting bread</i>.')}

<h3>6. ZAMAN (time)</h3>
<table class="t"><tr><th>Bağlaç</th><th>Anlam</th><th>Not</th></tr>
<tr><td>when, as</td><td>-dığında, -ken</td><td>—</td></tr>
<tr><td>while</td><td>-iken</td><td>Genelde sürekli zamanla</td></tr>
<tr><td>as soon as, once, the moment, immediately</td><td>-ir -mez</td><td>—</td></tr>
<tr><td>until / till</td><td>-e kadar</td><td>not … until = ancak … -dığında</td></tr>
<tr><td>before / after</td><td>-den önce / sonra</td><td>+ cümle ya da + -ing</td></tr>
<tr><td>since</td><td>-den beri</td><td>Ana cümle Present Perfect</td></tr>
<tr><td>by the time</td><td>-dığında (çoktan)</td><td>Perfect zaman ister</td></tr>
<tr><td>whenever, every time</td><td>her … -dığında</td><td>—</td></tr>
<tr><td>no sooner … than, hardly / scarcely … when</td><td>-ir -mez</td><td>Devrik + Past Perfect</td></tr></table>
${TRAP('<b>during</b> + isim (during the war), <b>while</b> + cümle (while the war was going on). "during he was" ✘.')}
${TRAP('<b>since</b> ve <b>as</b> hem zaman hem sebep bildirir; cümlenin anlamına bak.')}

<h3>7. EKLEME ve ÖRNEK</h3>
<table class="t"><tr><th>Ekleme</th><th>Örnek verme</th><th>Açıklama / yeniden ifade</th></tr>
<tr><td>moreover, furthermore, in addition, besides, also, what is more; in addition to / besides / as well as + isim/-ing</td><td>for example, for instance, such as, e.g., including, namely</td><td>in other words, that is (to say), i.e., namely</td></tr></table>

<h3>8. KOŞUL</h3>
<p>if, unless, provided that, as long as, in case, even if, otherwise — ayrıntısı "Koşul Cümleleri" konusunda.</p>

<h3>9. Hızlı karar tablosu</h3>
<table class="t"><tr><th>İki cümle arasındaki ilişki</th><th>Ara</th></tr>
<tr><td>İkinci cümle beklenmeyen bir şey söylüyor</td><td>although / despite / however</td></tr>
<tr><td>İki grubu karşılaştırıyor</td><td>while / whereas / in contrast</td></tr>
<tr><td>İkinci cümle birincinin nedeni</td><td>because / since / due to</td></tr>
<tr><td>İkinci cümle birincinin sonucu</td><td>therefore / thus / so / as a result</td></tr>
<tr><td>Aynı yönde bilgi ekleniyor</td><td>moreover / furthermore / in addition</td></tr>
<tr><td>Amaç (… için)</td><td>so that / in order to</td></tr></table>`,
qs:[
QW('---- the economy has grown rapidly, unemployment remains a serious problem in the region.',['Because','Although','Despite','Since','Unless'],'B','Ekonomi büyüdü ↔ işsizlik hâlâ sorun: beklenmeyen sonuç = zıtlık. Arkada tam cümle → Although.',['Sebep bildirir; büyüme işsizliğin nedeni değil.',null,'Zıtlık doğru ama despite cümle değil isim alır.','since sebep/zaman bildirir; anlam zıtlık.','unless koşul bildirir.']),
QW('The flight was cancelled ---- the heavy snowstorm.',['although','because','due to','so that','whereas'],'C','Sebep var ve arkasında isim öbeği (the heavy snowstorm) → due to.',['Zıtlık bildirir ve cümle ister.','Sebep doğru ama because tam cümle ister.',null,'Amaç bildirir ve cümle ister.','Karşılaştırma bildirir ve cümle ister.']),
QW('Some people prefer to live in cities, ---- others choose the peace of the countryside.',['whereas','because','so that','unless','as soon as'],'A','İki grup karşılaştırılıyor (bazıları şehir, diğerleri kır) → whereas (oysa).',[null,'Sebep ilişkisi yok.','Amaç ilişkisi yok.','Koşul ilişkisi yok.','Zaman ilişkisi yok.']),
QW('The new law was introduced ---- reduce air pollution in big cities.',['so that','in order to','because of','although','as if'],'B','Amaç bildiriyor ve arkasında yalın fiil (reduce) var → in order to.',['Amaç doğru ama so that tam cümle ister (so that air pollution would be reduced).',null,'Sebep bildirir ve isim ister.','Zıtlık bildirir.','"as if" benzetme bildirir.']),
QW('Many species have lost their habitats; ----, they are now in danger of extinction.',['however','in contrast','consequently','for instance','nevertheless'],'C','Yaşam alanlarını kaybettiler → bu yüzden nesilleri tehlikede: sonuç → consequently.',['Zıtlık bildirir; ilişki sebep-sonuç.','Karşılaştırma bildirir.',null,'Örnek bildirir; ikinci cümle bir örnek değil.','Zıtlık bildirir.']),
QW('---- he was ill, he insisted on taking the exam.',['Despite','Even though','Because of','In spite of','Due to'],'B','Hastaydı ama sınava girmekte ısrar etti: zıtlık; arkada tam cümle (he was ill) → Even though.',['despite isim alır, cümle almaz.',null,'Sebep bildirir ve isim alır.','in spite of isim alır.','Sebep bildirir ve isim alır.'])]}
];

/* ===================== GRAMER 5: FİİLİMSİ, EDAT, KARŞILAŞTIRMA, MİKTAR, DEVRİK, KISALTMA ===================== */
const GR5=[
{id:'gerund',grp:'yds',t:'Fiilimsiler: -ing ve to V1',en:'Gerunds & Infinitives',s:'Hangi fiil -ing, hangisi to V1 alır? Anlamı değişen fiiller, edat + -ing',body:`
<p>Bir fiilden sonra ikinci bir fiil geldiğinde ya <b>-ing</b> (gerund) ya da <b>to + V1</b> (infinitive) alır. Hangisinin geleceğini birinci fiil belirler. YDS'de her sınavda 1-2 soru doğrudan bu konudan gelir.</p>

<h3>1. Arkasından -ing alan fiiller</h3>
<table class="t"><tr><th>Fiil</th><th>Anlam</th><th>Fiil</th><th>Anlam</th></tr>
<tr><td>avoid</td><td>kaçınmak</td><td>involve</td><td>gerektirmek</td></tr>
<tr><td>enjoy</td><td>keyif almak</td><td>keep (on)</td><td>sürdürmek</td></tr>
<tr><td>consider</td><td>düşünmek</td><td>mind</td><td>sakıncası olmak</td></tr>
<tr><td>deny</td><td>inkâr etmek</td><td>miss</td><td>kaçırmak, özlemek</td></tr>
<tr><td>admit</td><td>kabul etmek</td><td>postpone / delay / put off</td><td>ertelemek</td></tr>
<tr><td>risk</td><td>riske atmak</td><td>practise</td><td>pratik yapmak</td></tr>
<tr><td>suggest / recommend</td><td>önermek</td><td>resist</td><td>direnmek</td></tr>
<tr><td>finish / quit / give up</td><td>bitirmek, bırakmak</td><td>can't help / can't stand</td><td>edememek / dayanamamak</td></tr>
<tr><td>imagine</td><td>hayal etmek</td><td>appreciate</td><td>takdir etmek</td></tr>
<tr><td>mention</td><td>bahsetmek</td><td>tolerate</td><td>katlanmak</td></tr></table>
${EX('Many people <u>avoid going</u> to the doctor until it is too late.','Pek çok insan çok geç olana kadar doktora gitmekten kaçınır.')}

<h3>2. Arkasından to + V1 alan fiiller</h3>
<table class="t"><tr><th>Fiil</th><th>Anlam</th><th>Fiil</th><th>Anlam</th></tr>
<tr><td>decide</td><td>karar vermek</td><td>tend</td><td>eğiliminde olmak</td></tr>
<tr><td>plan / intend / aim</td><td>planlamak, amaçlamak</td><td>seem / appear</td><td>görünmek</td></tr>
<tr><td>hope / expect / want / wish</td><td>ummak, beklemek, istemek</td><td>afford</td><td>gücü yetmek</td></tr>
<tr><td>refuse</td><td>reddetmek</td><td>agree</td><td>kabul etmek</td></tr>
<tr><td>fail</td><td>başaramamak</td><td>promise</td><td>söz vermek</td></tr>
<tr><td>manage</td><td>başarmak</td><td>attempt / try</td><td>girişmek, denemek</td></tr>
<tr><td>learn</td><td>öğrenmek</td><td>threaten</td><td>tehdit etmek</td></tr>
<tr><td>offer</td><td>teklif etmek</td><td>pretend</td><td>-miş gibi yapmak</td></tr>
<tr><td>need</td><td>ihtiyaç duymak</td><td>be likely / able / willing / reluctant</td><td>muhtemel / -ebilir / istekli / isteksiz</td></tr></table>
${EX('The company <u>failed to meet</u> its targets. / Prices <u>tend to rise</u> in winter.','Şirket hedeflerine ulaşamadı. / Fiyatlar kışın yükselme eğilimindedir.')}

<h3>3. Fiil + nesne + to V1</h3>
<p><b>allow, permit, enable, encourage, force, oblige, require, cause, lead, ask, tell, advise, warn, remind, persuade, invite, expect, want, urge</b></p>
${EX('Technology <u>enables</u> people <u>to work</u> from home.','Teknoloji insanların evden çalışmasını sağlıyor.')}
${TRAP('<b>make, let, have</b> + nesne + <b>V1</b> (to\'suz): <i>The teacher <u>made</u> us <u>rewrite</u> the essay.</i> Edilgen olunca to geri gelir: <i>We <u>were made to rewrite</u> it.</i>')}

<h3>4. Edattan sonra her zaman -ing</h3>
${EX('He left <u>without saying</u> goodbye. / She is good <u>at solving</u> problems.','Veda etmeden ayrıldı. / Problem çözmekte iyidir.')}
${TRAP('Bazı kalıplarda "to" bir <b>edattır</b>, mastar değildir; arkasından -ing gelir: <b>look forward to, be used to, get used to, object to, be committed to, contribute to, lead to, be devoted to, when it comes to, in addition to, with a view to</b>. <i>We look forward to <u>hearing</u> from you.</i>')}

<h3>5. İkisini de alan ama anlamı değişen fiiller</h3>
<table class="t"><tr><th>Fiil</th><th>+ -ing</th><th>+ to V1</th></tr>
<tr><td><b>remember</b></td><td>yaptığını hatırlamak (geçmiş)<br><i>I remember <u>locking</u> the door.</i></td><td>yapmayı unutmamak (gelecek)<br><i>Remember <u>to lock</u> the door.</i></td></tr>
<tr><td><b>forget</b></td><td>yaptığını unutmak<br><i>I'll never forget <u>seeing</u> the sea.</i></td><td>yapmayı unutmak<br><i>He forgot <u>to call</u>.</i></td></tr>
<tr><td><b>stop</b></td><td>bir işi bırakmak<br><i>He stopped <u>smoking</u>.</i> (Sigarayı bıraktı)</td><td>bir şey yapmak için durmak<br><i>He stopped <u>to smoke</u>.</i> (Sigara içmek için durdu)</td></tr>
<tr><td><b>try</b></td><td>denemek (sonucu görmek için)<br><i>Try <u>restarting</u> the computer.</i></td><td>çabalamak<br><i>He tried <u>to lift</u> the box.</i></td></tr>
<tr><td><b>regret</b></td><td>yaptığına pişman olmak<br><i>I regret <u>telling</u> him.</i></td><td>üzülerek bildirmek<br><i>We regret <u>to inform</u> you…</i></td></tr>
<tr><td><b>mean</b></td><td>anlamına gelmek<br><i>This means <u>working</u> late.</i></td><td>niyet etmek<br><i>I meant <u>to call</u> you.</i></td></tr>
<tr><td><b>go on</b></td><td>aynı işe devam etmek</td><td>başka bir işe geçmek</td></tr></table>
<p>Anlamı değişmeyenler: begin, start, continue, like, love, hate, prefer.</p>

<h3>6. -ing özne olarak ve "It is … to"</h3>
${EX('<u>Learning</u> a language takes time. = <u>It</u> takes time <u>to learn</u> a language.','Bir dil öğrenmek zaman alır.')}

<h3>7. Geçmiş ve edilgen biçimler</h3>
<table class="t"><tr><th></th><th>Etken</th><th>Edilgen</th></tr>
<tr><td>to V1</td><td>to do</td><td>to be done</td></tr>
<tr><td>Geçmiş to V1</td><td>to have done</td><td>to have been done</td></tr>
<tr><td>-ing</td><td>doing</td><td>being done</td></tr>
<tr><td>Geçmiş -ing</td><td>having done</td><td>having been done</td></tr></table>
${EX('He denied <u>having taken</u> the money. / Nobody likes <u>being criticised</u>.','Parayı aldığını inkâr etti. / Kimse eleştirilmekten hoşlanmaz.')}`,
qs:[
QW('Many young people avoid ---- about their future because it makes them anxious.',['to think','thinking','think','thought','to have thought'],'B','avoid + -ing → thinking.',['avoid to V1 almaz.',null,'Yalın fiil avoid\'den sonra gelmez.','V2 bu yapıda kullanılmaz.','avoid to V1 almaz.']),
QW('New technologies have enabled farmers ---- more food with less water.',['produce','producing','to produce','produced','to producing'],'C','enable + nesne + to V1 → to produce.',['Yalın fiil make/let/have ile gelir, enable ile değil.','enable -ing almaz.',null,'V3 bu yapıda yanlış.','"to producing" yalnızca to edat olduğunda olur.']),
QW('Most scientists are looking forward to ---- the results of the space mission.',['see','seeing','be seen','have seen','saw'],'B','"look forward to" kalıbındaki "to" edattır → arkasından -ing: seeing.',['"to" edat olduğu için yalın fiil gelmez.',null,'Edilgen ve yapı yanlış.','"to have seen" mastar; burada edat var.','V2 kullanılmaz.']),
QW('The company failed ---- its sales targets for the third year in a row.',['meeting','to meet','meet','met','to meeting'],'B','fail + to V1 → to meet.',['fail -ing almaz.',null,'Yalın fiil gelmez.','V2 kullanılmaz.','to edat değil, mastar.']),
QW('I clearly remember ---- the door, but when I came back it was open.',['to lock','locking','lock','to have locked by','locked'],'B','Geçmişte yapılan bir şeyi hatırlamak → remember + -ing: locking.',['"remember to lock" gelecekte yapmayı unutmamak demektir; cümle geçmişi anlatıyor.',null,'Yalın fiil gelmez.','Bozuk yapı.','V2 kullanılmaz.']),
QW('The teacher made the students ---- the experiment three times.',['to repeat','repeating','repeat','repeated','to repeating'],'C','make + nesne + V1 (to\'suz) → repeat.',['make etken yapıda to almaz.','make -ing almaz.',null,'V3 anlamı edilgen yapar, bozuk.','Yanlış yapı.'])]},

{id:'prep',grp:'yds',t:'Edatlar ve Kalıplar',en:'Prepositions & Collocations',s:'in/on/at, fiil + edat, sıfat + edat, isim + edat, edat öbekleri',body:`
<h3>1. Zaman edatları: in / on / at</h3>
<table class="t"><tr><th>in</th><th>on</th><th>at</th></tr>
<tr><td>Ay, yıl, mevsim, yüzyıl, uzun dönem: in May, in 2020, in summer, in the 19th century, in the morning</td><td>Gün, tarih: on Monday, on 5 May, on my birthday, on the morning of 5 May</td><td>Saat, kısa an: at 5 o'clock, at noon, at night, at the weekend (BrE), at the moment</td></tr></table>

<h3>2. Yer edatları</h3>
<table class="t"><tr><th>in</th><th>on</th><th>at</th></tr>
<tr><td>İçinde, kapalı alan, şehir, ülke: in the room, in Istanbul, in Europe</td><td>Yüzeyinde: on the table, on the wall, on the second floor</td><td>Belirli nokta: at the station, at the door, at school, at home</td></tr></table>

<h3>3. Zaman ifadelerinde diğer edatlar</h3>
<table class="t"><tr><th>Edat</th><th>Kullanım</th><th>Örnek</th></tr>
<tr><td>for + süre</td><td>… boyunca / -dır</td><td>for ten years</td></tr>
<tr><td>since + başlangıç</td><td>-den beri</td><td>since 2010</td></tr>
<tr><td>during + isim</td><td>… sırasında</td><td>during the war</td></tr>
<tr><td>by + zaman</td><td>-e kadar (en geç)</td><td>by Friday</td></tr>
<tr><td>until + zaman</td><td>-e kadar (sürekli)</td><td>until Friday</td></tr>
<tr><td>within + süre</td><td>… içinde</td><td>within two weeks</td></tr>
<tr><td>throughout</td><td>boyunca, her yerinde</td><td>throughout the year / the country</td></tr></table>

<h3>4. Fiil + edat (en çok çıkanlar)</h3>
<table class="t"><tr><th>Kalıp</th><th>Anlam</th><th>Kalıp</th><th>Anlam</th></tr>
<tr><td>depend <b>on</b> / rely <b>on</b></td><td>-e bağlı olmak / güvenmek</td><td>consist <b>of</b></td><td>-den oluşmak</td></tr>
<tr><td>result <b>in</b></td><td>-e yol açmak</td><td>result <b>from</b></td><td>-den kaynaklanmak</td></tr>
<tr><td>contribute <b>to</b> / lead <b>to</b></td><td>katkıda bulunmak / yol açmak</td><td>focus <b>on</b> / concentrate <b>on</b></td><td>odaklanmak</td></tr>
<tr><td>suffer <b>from</b></td><td>-den muzdarip olmak</td><td>benefit <b>from</b></td><td>-den yararlanmak</td></tr>
<tr><td>protect <b>from / against</b></td><td>-den korumak</td><td>prevent sb <b>from</b> -ing</td><td>-den alıkoymak</td></tr>
<tr><td>deal <b>with</b> / cope <b>with</b></td><td>ilgilenmek / başa çıkmak</td><td>comply <b>with</b></td><td>uymak</td></tr>
<tr><td>participate <b>in</b> / engage <b>in</b> / succeed <b>in</b></td><td>katılmak / uğraşmak / başarmak</td><td>specialise <b>in</b> / invest <b>in</b></td><td>uzmanlaşmak / yatırım yapmak</td></tr>
<tr><td>apply <b>for</b> (iş) / apply <b>to</b> (kurum)</td><td>başvurmak</td><td>account <b>for</b></td><td>açıklamak; oluşturmak</td></tr>
<tr><td>refer <b>to</b> / respond <b>to</b> / adapt <b>to</b></td><td>değinmek / yanıt vermek / uyum sağlamak</td><td>differ <b>from</b> / distinguish <b>from</b></td><td>-den farklı olmak / ayırt etmek</td></tr>
<tr><td>attribute A <b>to</b> B</td><td>A'yı B'ye bağlamak</td><td>convert A <b>into</b> B</td><td>A'yı B'ye dönüştürmek</td></tr>
<tr><td>deprive sb <b>of</b></td><td>-den mahrum bırakmak</td><td>accuse sb <b>of</b></td><td>-le suçlamak</td></tr>
<tr><td>provide sb <b>with</b> sth / provide sth <b>for</b> sb</td><td>sağlamak</td><td>replace A <b>with</b> B</td><td>A'nın yerine B koymak</td></tr></table>
${TRAP('<b>result in</b> (sonuç: A results in B = A, B\'ye yol açar) ve <b>result from</b> (neden: B results from A = B, A\'dan kaynaklanır) yönü tamamen terstir.')}

<h3>5. Sıfat + edat</h3>
<table class="t"><tr><th>Kalıp</th><th>Anlam</th><th>Kalıp</th><th>Anlam</th></tr>
<tr><td>responsible <b>for</b></td><td>-den sorumlu</td><td>aware <b>of</b> / capable <b>of</b></td><td>farkında / -ebilir</td></tr>
<tr><td>dependent <b>on</b></td><td>-e bağımlı</td><td>independent <b>of</b></td><td>-den bağımsız</td></tr>
<tr><td>similar <b>to</b> / related <b>to</b></td><td>-e benzer / ile ilgili</td><td>different <b>from</b></td><td>-den farklı</td></tr>
<tr><td>essential <b>for</b> / necessary <b>for</b></td><td>için gerekli</td><td>exposed <b>to</b> / vulnerable <b>to</b></td><td>maruz / savunmasız</td></tr>
<tr><td>interested <b>in</b> / involved <b>in</b></td><td>ilgili / dahil</td><td>familiar <b>with</b> / associated <b>with</b></td><td>aşina / ilişkili</td></tr>
<tr><td>rich <b>in</b></td><td>-ce zengin</td><td>famous <b>for</b> / known <b>for</b></td><td>ile ünlü</td></tr>
<tr><td>harmful <b>to</b> / beneficial <b>to</b></td><td>-e zararlı / yararlı</td><td>resistant <b>to</b> / immune <b>to</b></td><td>-e dirençli / bağışık</td></tr></table>

<h3>6. İsim + edat</h3>
<p>increase / decrease / rise / fall <b>in</b> (bir şeyde artış): <i>an increase <u>in</u> prices</i><br>
cause <b>of</b>, effect / impact / influence <b>on</b>, solution <b>to</b>, reason <b>for</b>, demand <b>for</b>, access <b>to</b>, approach <b>to</b>, threat <b>to</b>, contribution <b>to</b>, research <b>into / on</b>, lack <b>of</b>, need <b>for</b></p>
${TRAP('"increase <b>in</b>" (… artış) ile "increase <b>of</b>" (… miktarında artış: an increase of 10%) farkı. "The effect <b>on</b>" ama "affect" fiili edat almaz: <i>affects the brain</i> (affects on ✘).')}

<h3>7. Edat öbekleri</h3>
<table class="t"><tr><th>Öbek</th><th>Anlam</th><th>Öbek</th><th>Anlam</th></tr>
<tr><td>according to</td><td>-e göre</td><td>contrary to</td><td>-in aksine</td></tr>
<tr><td>in terms of</td><td>bakımından</td><td>with regard to / regarding</td><td>ile ilgili</td></tr>
<tr><td>in addition to</td><td>-e ek olarak</td><td>instead of</td><td>yerine</td></tr>
<tr><td>by means of</td><td>aracılığıyla</td><td>on behalf of</td><td>adına</td></tr>
<tr><td>in favour of</td><td>-in lehine</td><td>in the face of</td><td>karşısında</td></tr>
<tr><td>as opposed to</td><td>-in aksine</td><td>in line with</td><td>-e uygun olarak</td></tr>
<tr><td>apart from / except for</td><td>dışında</td><td>prior to</td><td>-den önce</td></tr></table>`,
qs:[
QW('Smoking can result ---- serious health problems such as lung cancer.',['from','in','of','on','at'],'B','Sigara sorunlara yol açar (sigara neden, sorunlar sonuç) → result in.',['result from yönü ters çevirir: sigara sorunlardan kaynaklanır demek olur.',null,'result of fiil olarak kullanılmaz (isim: the result of).','Yanlış edat.','Yanlış edat.']),
QW('The success of the project depends largely ---- the support of local communities.',['in','at','on','with','for'],'C','depend on = -e bağlı olmak.',['Yanlış edat.','Yanlış edat.',null,'Yanlış edat.','Yanlış edat.']),
QW('There has been a significant increase ---- the number of people working from home.',['of','on','in','at','to'],'C','"an increase in + şey" (bir şeyde artış) → increase in the number.',['"increase of" artışın miktarını verir (an increase of 20%).','Yanlış edat.',null,'Yanlış edat.','Yanlış edat.']),
QW('---- the latest report, the population of the city has doubled in twenty years.',['In spite of','According to','Instead of','Contrary to','Because'],'B','"Son rapora göre" → According to.',['Zıtlık bildirir; anlam uymaz.',null,'"Yerine" anlamı uymaz.','"Raporun aksine" anlam bozulur.','because cümle ister.']),
QW('The new law aims to protect consumers ---- unfair business practices.',['of','from','with','to','by'],'B','protect from / against = -den korumak.',['Yanlış edat.',null,'Yanlış edat.','Yanlış edat.','Yanlış edat; "by" korumayı yapanı bildirir.']),
QW('Many children in poor countries are deprived ---- basic education.',['from','with','of','for','in'],'C','deprive sb of sth = -den mahrum bırakmak → deprived of.',['Yanlış edat (prevent from ile karıştırılır).','Yanlış edat.',null,'Yanlış edat.','Yanlış edat.'])]},

{id:'compare',grp:'yds',t:'Karşılaştırma Yapıları',en:'Comparisons',s:'-er/more, the most, as…as, the more…the more, much/far + comparative',body:`
<h3>1. Karşılaştırma ve en üstünlük</h3>
<table class="t"><tr><th>Sıfat türü</th><th>Karşılaştırma</th><th>En üstünlük</th></tr>
<tr><td>Tek heceli: fast, cheap</td><td>faster, cheaper (than)</td><td>the fastest, the cheapest</td></tr>
<tr><td>-y ile biten: easy, happy</td><td>easier, happier</td><td>the easiest</td></tr>
<tr><td>Ünsüz-ünlü-ünsüz: big, hot</td><td>bigger, hotter</td><td>the biggest</td></tr>
<tr><td>İki ve daha fazla heceli: important</td><td>more important (than)</td><td>the most important</td></tr>
<tr><td>Düzensiz</td><td>good → better, bad → worse, far → farther/further, little → less, many/much → more</td><td>the best, the worst, the furthest, the least, the most</td></tr></table>
${TRAP('Çift karşılaştırma yanlıştır: "more cheaper", "most biggest" ✘.')}

<h3>2. Eşitlik: as … as</h3>
<table class="t"><tr><th>Yapı</th><th>Anlam</th><th>Örnek</th></tr>
<tr><td>as + sıfat/zarf + as</td><td>kadar</td><td>Solar power is now <u>as cheap as</u> coal.</td></tr>
<tr><td>not as/so + sıfat + as</td><td>kadar değil</td><td>Wind is <u>not as reliable as</u> gas.</td></tr>
<tr><td>as much/many + isim + as</td><td>kadar çok</td><td>He earns <u>as much money as</u> I do.</td></tr>
<tr><td>twice / three times + as … as</td><td>iki / üç kat</td><td>Prices are <u>twice as high as</u> last year.</td></tr>
<tr><td>the same + isim + as</td><td>ile aynı</td><td>the same age as</td></tr></table>

<h3>3. Karşılaştırmayı güçlendiren / azaltan kelimeler</h3>
<p><b>much, far, a lot, considerably, significantly, substantially, even, still</b> + comparative = çok daha<br>
<b>slightly, a little, a bit, somewhat</b> + comparative = biraz daha</p>
${EX('The new model is <u>much lighter</u> than the old one.','Yeni model eskisinden çok daha hafif.')}
${TRAP('<b>very</b> comparative ile kullanılmaz: "very better" ✘ → "much better" ✔.')}

<h3>4. the + comparative, the + comparative</h3>
${EX('<u>The more</u> you read, <u>the larger</u> your vocabulary becomes.','Ne kadar çok okursan kelime dağarcığın o kadar genişler.')}
${EX('<u>The earlier</u> the disease is diagnosed, <u>the better</u> the chances of recovery.','Hastalık ne kadar erken teşhis edilirse iyileşme şansı o kadar yüksek olur.')}

<h3>5. Giderek artan: comparative and comparative</h3>
${EX('The world is becoming <u>warmer and warmer</u>. / Life is getting <u>more and more expensive</u>.','Dünya giderek ısınıyor. / Hayat giderek pahalılaşıyor.')}

<h3>6. Superlative kalıpları</h3>
<ul><li>the + superlative + <b>in</b> + yer/grup: the tallest building <u>in</u> the world</li>
<li>the + superlative + <b>of</b> + çoğul: the best <u>of</u> all</li>
<li>one of the + superlative + <b>çoğul isim</b>: one of the most important <u>discoveries</u></li>
<li>the + superlative + (that) + özne + <b>have ever V3</b>: the best film I <u>have ever seen</u></li></ul>

<h3>7. Diğer karşılaştırma ifadeleri</h3>
<table class="t"><tr><th>İfade</th><th>Anlam</th></tr>
<tr><td>similar to / different from</td><td>-e benzer / -den farklı</td></tr>
<tr><td>compared to / with, in comparison with</td><td>ile karşılaştırıldığında</td></tr>
<tr><td>unlike / like</td><td>-in aksine / gibi</td></tr>
<tr><td>superior to / inferior to</td><td>-den üstün / aşağı (than değil!)</td></tr>
<tr><td>prefer A to B</td><td>A'yı B'ye tercih etmek</td></tr>
<tr><td>less + sıfat + than</td><td>daha az …</td></tr>
<tr><td>more than / less than / no more than</td><td>-den fazla / az / en fazla</td></tr></table>
${TRAP('"superior <b>than</b>" ✘ → "superior <b>to</b>" ✔. "prefer A <b>than</b> B" ✘ → "prefer A <b>to</b> B" ✔.')}

<h3>8. Karşılaştırmada zamir: that of / those of</h3>
${EX('The climate of Antalya is warmer than <u>that of</u> Erzurum.','Antalya\'nın iklimi Erzurum\'unkinden daha sıcaktır.')}`,
qs:[
QW('The more people use public transport, ---- traffic congestion becomes.',['less','the less','the least','fewer','little'],'B','"The more …, the …" kalıbı ikinci kısımda da "the + comparative" ister → the less.',['"the" eksik; kalıp bozulur.',null,'Superlative bu kalıpta kullanılmaz.','fewer sayılabilen isimlerle kullanılır ve "the" eksik.','little comparative değildir.']),
QW('The new smartphone is ---- than the previous model.',['much lighter','more lighter','very lighter','lightest','the lighter'],'A','Comparative "much" ile güçlendirilir → much lighter.',[null,'Çift karşılaştırma yanlıştır.','very comparative ile kullanılmaz.','Superlative "than" ile kullanılmaz ve "the" eksik.','"the lighter" bu yapıda kullanılmaz.']),
QW('Today, solar energy is almost ---- cheap as coal in many countries.',['so','more','as','such','than'],'C','Eşitlik: as + sıfat + as → as cheap as.',['"so … as" sadece olumsuzlarda kullanılır.','"more cheap" yanlış ve "as" ile uyuşmaz.',null,'such sıfattan önce bu şekilde gelmez.','than karşılaştırmada kullanılır, as ile değil.']),
QW('The average salary in the capital is about twice ---- in rural areas.',['as high as that','higher than those','as high as those','highest than that','as higher as that'],'A','Kat ifadesi: twice + as … as; tekrar edilen tekil isim (the average salary) → that.',[null,'"twice higher than" yaygın değil ve "those" çoğul; salary tekil.','"those" çoğuldur; salary tekil.','Superlative "than" ile kullanılmaz.','"as higher as" yanlış; as … as arasına yalın sıfat gelir.']),
QW('Many experts believe that the new drug is superior ---- older treatments.',['than','to','from','of','with'],'B','"superior to" kalıbı (than değil).',['superior Latince kökenli; "than" almaz.',null,'Yanlış edat.','Yanlış edat.','Yanlış edat.']),
QW('Penicillin was one of the most important ---- of the twentieth century.',['discovery','discoveries','discover','discovered','discovering'],'B','"one of the + superlative + çoğul isim" → discoveries.',['Tekil isim "one of the" yapısında kullanılmaz.',null,'Fiil; isim gerekir.','V3; isim gerekir.','-ing; isim gerekir.'])]},

{id:'quant',grp:'yds',t:'Miktar Belirleyiciler',en:'Quantifiers & Determiners',s:'much/many, few/little, both/either/neither, the number of / a number of, other/another',body:`
<h3>1. Sayılabilen / sayılamayan ile kullananlar</h3>
<table class="t"><tr><th>Sayılabilen (çoğul)</th><th>Sayılamayan</th><th>İkisi de</th></tr>
<tr><td>many, a few, few, several, a number of, a great many, fewer, the fewest</td><td>much, a little, little, a great deal of, an amount of, less, the least</td><td>some, any, a lot of, lots of, plenty of, most, all, no, more</td></tr></table>

<h3>2. a few / few, a little / little — anlam farkı</h3>
<table class="t"><tr><th>Olumlu (biraz, yeterli)</th><th>Olumsuz (çok az, yetersiz)</th></tr>
<tr><td><b>a few</b> friends (birkaç arkadaş, iyi)</td><td><b>few</b> friends (çok az arkadaş, kötü)</td></tr>
<tr><td><b>a little</b> time (biraz zaman var)</td><td><b>little</b> time (neredeyse hiç zaman yok)</td></tr></table>
${EX('There is <u>little</u> evidence that the drug works.','İlacın işe yaradığına dair neredeyse hiç kanıt yok.')}
${TIP('Cümlenin geri kalanı olumsuz bir anlam taşıyorsa (but, so, unfortunately) few/little; olumlu taşıyorsa a few/a little.')}

<h3>3. İki şey için: both, either, neither</h3>
<table class="t"><tr><th>Kelime</th><th>Anlam</th><th>Fiil</th><th>Örnek</th></tr>
<tr><td>both (of)</td><td>ikisi de</td><td>çoğul</td><td>Both candidates <u>are</u> qualified.</td></tr>
<tr><td>either (of)</td><td>ikisinden biri, hangisi olsa</td><td>tekil</td><td>Either day <u>is</u> fine.</td></tr>
<tr><td>neither (of)</td><td>ikisi de değil</td><td>tekil (resmi)</td><td>Neither answer <u>is</u> correct.</td></tr></table>
<p>Üç ve fazlası için: <b>all</b> (hepsi), <b>none</b> (hiçbiri), <b>any</b> (herhangi biri).</p>

<h3>4. each / every</h3>
<p>Her ikisi de <b>tekil isim + tekil fiil</b>: <i>Each student <u>has</u> a book. Every country <u>is</u> affected.</i><br>
"each of the + çoğul isim" → tekil fiil: <i>Each of the students <u>has</u>…</i></p>

<h3>5. the number of / a number of</h3>
<table class="t"><tr><th>Yapı</th><th>Anlam</th><th>Fiil</th></tr>
<tr><td><b>The number of</b> + çoğul isim</td><td>… sayısı</td><td>Tekil: The number of cars <u>is</u> rising.</td></tr>
<tr><td><b>A number of</b> + çoğul isim</td><td>birçok</td><td>Çoğul: A number of cars <u>were</u> damaged.</td></tr>
<tr><td><b>The amount of</b> + sayılamayan</td><td>… miktarı</td><td>Tekil</td></tr></table>

<h3>6. most / most of / the most</h3>
<table class="t"><tr><th>Yapı</th><th>Örnek</th></tr>
<tr><td>most + isim (genel)</td><td>Most people like music.</td></tr>
<tr><td>most of + the/my/these + isim (belirli)</td><td>Most of <u>the</u> students passed.</td></tr>
<tr><td>the most + sıfat (en)</td><td>the most important factor</td></tr></table>
${TRAP('"most of people" ✘ → "most people" ✔ ya da "most of the people" ✔.')}

<h3>7. other / another / the other / others</h3>
<table class="t"><tr><th>Kelime</th><th>Kullanım</th><th>Örnek</th></tr>
<tr><td><b>another</b> + tekil</td><td>bir başka</td><td>another problem</td></tr>
<tr><td><b>other</b> + çoğul</td><td>diğer (genel)</td><td>other countries</td></tr>
<tr><td><b>the other</b> + tekil/çoğul</td><td>diğeri / geri kalanlar (belirli)</td><td>the other hand, the other students</td></tr>
<tr><td><b>others</b> (tek başına)</td><td>başkaları</td><td>Some like tea; others prefer coffee.</td></tr>
<tr><td><b>the others</b></td><td>geri kalanların hepsi</td><td>Two passed; the others failed.</td></tr></table>

<h3>8. no / none / not any</h3>
<p><b>no</b> + isim (No student failed), <b>none of</b> + the/zamir (None of them failed), <b>not any</b> + isim (There aren't any problems).</p>

<h3>9. Sayı + isim</h3>
<p>hundreds of / thousands of / millions of (belirsiz) ama two hundred / three thousand (belirli, -s almaz): <i>Two <u>thousand</u> people</i>, <i><u>Thousands of</u> people</i>.</p>`,
qs:[
QW('There is ---- evidence that the drug causes side effects, so doctors continue to prescribe it.',['few','little','many','a few','several'],'B','"evidence" sayılamaz; doktorlar ilacı yazmaya devam ettiğine göre kanıt yetersiz → little (çok az).',['few sayılabilen isimlerle kullanılır.',null,'many sayılabilenlerle.','a few sayılabilenlerle ve olumlu.','several sayılabilenlerle.']),
QW('---- of the two candidates had enough experience, so the company decided to repeat the interviews.',['Both','Either','Neither','All','None'],'C','İki aday var ve mülakat tekrarlanıyor (ikisi de yetersiz) → Neither.',['"İkisinin de deneyimi vardı" olursa mülakatı tekrarlamak anlamsız.','either "ikisinden biri" demek; anlam ve tekrar kararı uyuşmaz.',null,'all üç ve daha fazlası için.','none üç ve daha fazlası için kullanılır; iki için neither.']),
QW('The number of students who study abroad ---- increasing every year.',['are','is','have','were','be'],'B','"The number of" tekil fiil alır → is.',['"The number" tekil; "students" çoğul ama özne değil.',null,'Zaman ve yapı yanlış.','Çoğul ve geçmiş.','Çekimsiz fiil yüklem olamaz.']),
QW('A large number of tourists ---- the historic city every summer.',['visits','visit','is visiting','has visited','visiting'],'B','"A number of" çoğul fiil alır; "every summer" → Simple Present → visit.',['Tekil fiil; "a number of" çoğul.',null,'Tekil sürekli; özne çoğul.','Tekil Present Perfect.','-ing tek başına yüklem olamaz.']),
QW('---- people prefer to work from home, but ---- still want to go to the office.',['Some / others','Another / other','Other / the other','Some / another','The others / some'],'A','Bir grup bir şey tercih ederken başka bir grup başka şey istiyor → Some … others.',[null,'another tekil isimle gelir; "another people" yanlış.','other tek başına kullanılmaz; "the other" belirli bir kalan grup bildirir.','another tekil; "another still want" yanlış.','"The others" cümle başında belirli bir grubu ima eder, sıralama da bozuk.']),
QW('---- of the students passed the exam, so the teacher was very pleased.',['Most','Much','Little','Every','A little'],'A','Öğrenciler sayılabilir ve "of the" ile belirli → Most of the students; öğretmen memnun → olumlu.',[null,'much sayılamayanlarla kullanılır.','little sayılamayanlarla ve olumsuz anlam.','"every of" yanlış; "every one of" olmalıydı.','a little sayılamayanlarla kullanılır.'])]},

{id:'paired',grp:'yds',t:'Çift Bağlaçlar ve Devrik Yapı',en:'Paired Conjunctions & Inversion',s:'both…and, either…or, neither…nor, not only…but also; Never have I…, Only after…',body:`
<h3>1. Çift bağlaçlar</h3>
<table class="t"><tr><th>Yapı</th><th>Anlam</th><th>Örnek</th></tr>
<tr><td><b>both</b> A <b>and</b> B</td><td>hem A hem B</td><td>The policy benefits <u>both</u> consumers <u>and</u> producers.</td></tr>
<tr><td><b>either</b> A <b>or</b> B</td><td>ya A ya B</td><td>You can pay <u>either</u> in cash <u>or</u> by card.</td></tr>
<tr><td><b>neither</b> A <b>nor</b> B</td><td>ne A ne B</td><td><u>Neither</u> the students <u>nor</u> the teacher knew.</td></tr>
<tr><td><b>not only</b> A <b>but (also)</b> B</td><td>sadece A değil, B de</td><td>He is <u>not only</u> a doctor <u>but also</u> a writer.</td></tr>
<tr><td><b>whether</b> A <b>or</b> B</td><td>A olsun B olsun</td><td><u>Whether</u> rich <u>or</u> poor, everyone pays tax.</td></tr>
<tr><td><b>not</b> A <b>but</b> B</td><td>A değil B</td><td>The problem is <u>not</u> money <u>but</u> time.</td></tr>
<tr><td><b>rather</b> A <b>than</b> B</td><td>B'den ziyade A</td><td>—</td></tr></table>
${TRAP('Eşleşmeyi karıştırma: both–and, either–or, neither–nor. "neither … or" ✘, "both … or" ✘.')}
<p><b>Fiil uyumu:</b> either…or / neither…nor / not only…but also ile fiil <b>yakındaki özneye</b> uyar:</p>
${EX('Neither the manager nor the <u>workers were</u> informed. / Neither the workers nor the <u>manager was</u> informed.','Ne müdür ne de işçiler bilgilendirildi.')}
<p><b>both A and B</b> her zaman çoğul fiil alır.</p>
${TIP('Paralel yapı: çift bağlacın iki tarafı aynı türde olmalı: <i>both <u>to read</u> and <u>to write</u></i> ya da <i>both <u>reading</u> and <u>writing</u></i>; karışık olmaz.')}

<h3>2. Devrik yapı (inversion) nedir?</h3>
<p>Olumsuz ya da kısıtlayıcı bir zarf cümlenin başına gelince <b>yardımcı fiil özneden önce</b> gelir, soru cümlesi gibi. Anlam değişmez, sadece vurgu güçlenir. YDS'de hem gramer hem "anlamca en yakın cümle" sorularında çıkar.</p>
<table class="t"><tr><th>Başlangıç</th><th>Devrik örnek</th><th>Türkçesi</th></tr>
<tr><td><b>Never / Rarely / Seldom</b></td><td>Never <u>have I seen</u> such a storm.</td><td>Hiç böyle bir fırtına görmedim.</td></tr>
<tr><td><b>Not only … but also</b></td><td>Not only <u>does it reduce</u> pain, but it also speeds up recovery.</td><td>Sadece ağrıyı azaltmakla kalmaz, iyileşmeyi de hızlandırır.</td></tr>
<tr><td><b>No sooner … than</b></td><td>No sooner <u>had he arrived</u> than it started to rain.</td><td>O gelir gelmez yağmur başladı.</td></tr>
<tr><td><b>Hardly / Scarcely … when</b></td><td>Hardly <u>had the film begun</u> when the power went off.</td><td>Film başlar başlamaz elektrik kesildi.</td></tr>
<tr><td><b>Only after / Only when / Only if / Only by</b></td><td>Only after the test <u>did they realise</u> the mistake.</td><td>Hatayı ancak testten sonra fark ettiler.</td></tr>
<tr><td><b>Not until</b></td><td>Not until 1928 <u>were women allowed</u> to vote.</td><td>Kadınların oy kullanmasına ancak 1928'de izin verildi.</td></tr>
<tr><td><b>Under no circumstances / In no way / On no account</b></td><td>Under no circumstances <u>should you open</u> the door.</td><td>Hiçbir koşulda kapıyı açmamalısın.</td></tr>
<tr><td><b>Little</b></td><td>Little <u>did they know</u> what would happen.</td><td>Ne olacağını hiç bilmiyorlardı.</td></tr>
<tr><td><b>So + sıfat … that</b></td><td>So difficult <u>was the test</u> that many failed.</td><td>Sınav o kadar zordu ki pek çok kişi kaldı.</td></tr>
<tr><td><b>Should / Were / Had</b> (koşul)</td><td>Had I known, I would have come.</td><td>Bilseydim gelirdim.</td></tr></table>

<h3>3. Devrik yapıyı kurmak</h3>
<ol><li>Cümlede yardımcı fiil varsa (have, be, can, will…) onu öne al: <i>I have never seen → Never <u>have I</u> seen</i></li>
<li>Yardımcı fiil yoksa do / does / did ekle, ana fiili yalın yap: <i>It reduces → Not only <u>does it reduce</u></i></li></ol>
${TRAP('"Only after" ve "Not until" yapılarında devrik kısım <b>ana cümlede</b> olur, ilk kısımda değil: <i>Only after he left <u>did I</u> notice.</i> ("Only after did he leave" ✘)')}

<h3>4. so / neither ile kısa onay</h3>
${EX('I like coffee. — <u>So do I</u>. / I can\'t swim. — <u>Neither can I</u>.','Ben de. / Ben de (yüzemem).')}`,
qs:[
QW('The new policy will benefit ---- consumers ---- producers.',['neither / or','both / and','either / nor','not only / and','whether / nor'],'B','"Hem tüketicilere hem üreticilere yarar sağlayacak" → both … and.',['neither "nor" ile eşleşir.',null,'either "or" ile eşleşir.','not only "but also" ile eşleşir.','whether "or" ile eşleşir.']),
QW('No sooner had the meeting started ---- the fire alarm went off.',['when','than','then','that','as'],'B','"No sooner … than" kalıbı.',['"when" Hardly/Scarcely ile eşleşir.',null,'then zaman zarfıdır, kalıp değil.','that kalıpta yer almaz.','as kalıpta yer almaz.']),
QW('Not only ---- the drug reduce pain, but it also speeds up recovery.',['is','does','do','has','did'],'B','Devrik yapı; özne "the drug" tekil, cümle geniş zaman (speeds), ana fiil yalın (reduce) → does.',['"is reduce" yanlış yapı.',null,'Özne tekil; do değil does.','"has reduce" yanlış; V3 gerekirdi.','Cümle geniş zaman (speeds up); did geçmiş.']),
QW('---- the students nor the teacher was aware of the change in the exam schedule.',['Either','Both','Neither','Whether','Not only'],'C','"nor" ile eşleşen → Neither.',['either "or" ile eşleşir.','both "and" ile eşleşir ve çoğul fiil alır.',null,'whether "or" ile eşleşir.','not only "but also" ile eşleşir.']),
QW('Only after the results were published ---- the importance of the discovery.',['scientists realised','did scientists realise','scientists did realise','had realised scientists','realised scientists'],'B','"Only after …" ile başlayan cümlede ana cümle devrik olur: did + özne + V1.',['Devrik yapı gerekiyor.',null,'Yardımcı fiil özneden önce gelmeli.','Bozuk sıralama.','Fiil özneden önce geldi ama yardımcı fiil yok; yanlış.']),
QW('Never before ---- such a rapid increase in global temperatures.',['scientists have observed','have scientists observed','scientists observed','did scientists observed','has observed scientists'],'B','"Never before" cümle başında → devrik: have + özne + V3.',['Devrik yapı gerekiyor.',null,'Devrik yapı gerekiyor.','did sonrası fiil yalın olmalı.','Özne yanlış yerde ve tekil/çoğul uyumsuz.'])]},

{id:'reduction',grp:'yds',t:'Kısaltmalar (Participle Clauses)',en:'Reduced Clauses',s:'V-ing / V3 / having V3 ile cümle kısaltma; sıfat ve zarf cümleciklerinde',body:`
<p>Akademik İngilizcede uzun yan cümleler sık sık kısaltılır. YDS'de özellikle <b>cümle tamamlama, cloze ve çeviri</b> sorularında karşına çıkar. Kısaltılmış cümleyi tanıyamazsan cümlenin anlamını kaçırırsın.</p>

<h3>1. Temel kural: etken mi, edilgen mi?</h3>
<table class="t"><tr><th>Anlam</th><th>Kısaltma</th><th>Örnek</th></tr>
<tr><td>Etken (özne işi yapıyor)</td><td><b>V-ing</b></td><td>People <u>living</u> in cities … (= who live)</td></tr>
<tr><td>Edilgen (özneye yapılıyor)</td><td><b>V3</b></td><td>The book <u>written</u> by Orhan Pamuk … (= which was written)</td></tr>
<tr><td>Önce olmuş (etken)</td><td><b>having V3</b></td><td><u>Having finished</u> the work, they left.</td></tr>
<tr><td>Önce olmuş (edilgen)</td><td><b>having been V3</b></td><td><u>Having been warned</u>, they stayed home.</td></tr></table>

<h3>2. Sıfat cümleciği kısaltması</h3>
${EX('The scientists <u>who are working</u> on the project … → The scientists <u>working</u> on the project …','Proje üzerinde çalışan bilim insanları …')}
${EX('The vaccine <u>which was developed</u> in 2020 … → The vaccine <u>developed</u> in 2020 …','2020\'de geliştirilen aşı …')}
${EX('He was the first person <u>who climbed</u> the mountain. → He was the first person <u>to climb</u> the mountain.','Dağa tırmanan ilk kişiydi.')}
${TIP('<b>the first / the last / the only / the + superlative</b> sonrasında kısaltma <b>to V1</b> ile yapılır.')}

<h3>3. Zarf cümleciği kısaltması</h3>
<p><b>Şart:</b> İki cümlenin öznesi aynı olmalı.</p>
<table class="t"><tr><th>Uzun</th><th>Kısa</th></tr>
<tr><td><u>When he arrived</u> at the station, he called me.</td><td><u>(When) arriving</u> at the station, he called me.</td></tr>
<tr><td><u>Because she felt</u> tired, she went to bed.</td><td><u>Feeling</u> tired, she went to bed.</td></tr>
<tr><td><u>After they had finished</u> the test, they left.</td><td><u>Having finished</u> the test, they left. / <u>After finishing</u> …</td></tr>
<tr><td><u>Although it was built</u> in 1900, the house is in good condition.</td><td><u>Although built</u> in 1900, …</td></tr>
<tr><td><u>If it is used</u> correctly, the drug is safe.</td><td><u>If used</u> correctly, the drug is safe.</td></tr>
<tr><td><u>While I was walking</u> home, I saw an accident.</td><td><u>While walking</u> home, I saw an accident.</td></tr></table>
${TRAP('<b>Sarkan kısaltma (dangling participle):</b> Kısaltılmış kısmın öznesi ana cümlenin öznesiyle aynı olmalı. <i>"<s>Walking</s> home, the rain started."</i> ✘ (yağmur yürümüyor). <i>"Walking home, <u>I</u> got caught in the rain."</i> ✔. YDS\'de doğru şık her zaman özneyi doğru eşleştirir.')}

<h3>4. Sonuç bildiren -ing</h3>
<p>Ana cümlenin <b>sonucunu</b> anlatan -ing, virgülden sonra gelir; Türkçeye "… ve böylece / bu da …" diye çevrilir.</p>
${EX('The river flooded, <u>destroying</u> hundreds of homes.','Nehir taştı ve yüzlerce evi yıktı.')}
${EX('The drug blocks the virus, <u>thereby preventing</u> infection.','İlaç virüsü engelleyerek enfeksiyonu önler.')}

<h3>5. with / without + nesne + V-ing / V3</h3>
${EX('<u>With</u> prices <u>rising</u>, many families are struggling.','Fiyatlar yükselirken pek çok aile zorlanıyor.')}

<h3>6. Kısaltmayı tanıma yöntemi</h3>
<ol><li>Cümlede virgülle ayrılmış, başında yüklemsiz V-ing / V3 / having V3 olan bir kısım var mı?</li>
<li>Varsa, ana cümlenin öznesini bu kısmın öznesi kabul et.</li>
<li>Özne işi yapıyorsa V-ing, ona yapılıyorsa V3 doğrudur. Önce olmuşsa having.</li></ol>
${EX('<u>Compared</u> with other cities, Ankara is quiet. (Ankara karşılaştırılıyor → V3)','Diğer şehirlerle karşılaştırıldığında Ankara sakindir.')}`,
qs:[
QW('The bridge ---- in 1890 is still used by thousands of people every day.',['building','built','was built','which built','to build'],'B','Köprü inşa edilmiş (edilgen) → kısaltma V3: built (= which was built).',['V-ing etken anlam verir: köprü bir şey inşa ediyor.',null,'"was built" yüklem olur; cümlede zaten "is used" yüklemi var.','Etken: köprü bir şey inşa etti.','"to build" amaç bildirir.']),
QW('---- the instructions carefully, the students completed the experiment without any problems.',['Having read','Read','Being read','Having been read','To be read'],'A','Öğrenciler talimatları önce okudu, sonra deneyi tamamladı → önce olan etken eylem: Having read.',[null,'"Read" emir kipi gibi durur, anlam bozulur.','Edilgen: öğrenciler okunuyor anlamı çıkar.','Edilgen: öğrenciler okunmuş anlamı.','Edilgen mastar, anlamsız.']),

const V2_NOUN={id:'noun',grp:'yds',v2:true,t:'İsim Cümlecikleri',en:'Noun Clauses',s:'that, whether/if, what, wh- kelimeleri, soru düzeni tuzağı, -ever, dolaylı anlatım, subjunctive',
body:`
<h3>Önce büyük resim</h3>
${TALK('İsim cümleciği, bir cümlenin içinde <b>isim gibi davranan</b> bir yan cümledir. Yani normalde bir ismin olacağı yerde (özne, nesne, edattan sonra) bütün bir cümle durur.<br><br>Türkçede bunu "<b>-dığı, -dığını, -ip -madığını</b>" ekleriyle yaparız:<br><i>Onun <b>haklı olduğunu</b> biliyorum.</i><br><i><b>Söylediği şey</b> herkesi şaşırttı.</i><br><i>Gelip <b>gelmeyeceğini</b> bilmiyorum.</i><br><br>İngilizcede bu cümlecikleri <b>that, whether, what, why, how…</b> gibi kelimeler başlatır. YDS gramer sorularında doğrudan, okuma ve çeviri sorularında da sürekli karşına çıkar.')}
${FORM('Türkçe ek → İngilizce bağlaç',['Türkçe','İngilizce','Örnek'],[

['-dığı şey','<b>what</b>','<u>What</u> he said surprised me.'],

body:`
<h3>Önce büyük resim</h3>
${TALK('Bu konu YDS\'de <b>en çok puan getiren</b> gramer konusudur. Sadece gramer bölümünde değil:<br>• <b>Cloze test</b> boşluklarının yaklaşık üçte biri bağlaçtır.<br>• <b>Cümle tamamlama</b> sorularının neredeyse hepsi bağlaçla çözülür.<br>• <b>Çeviri</b> sorularında ilk elenecek şıklar yanlış bağlacı olanlardır.<br>• <b>Paragraf</b> sorularında yazarın düşünce yönü (ama, bu yüzden, üstelik) bağlaçlardan anlaşılır.<br><br>Yani bu konuyu iyi öğrenirsen 80 sorunun 20-25\'inde doğrudan avantaj sağlarsın.<br><br>Bütün bağlaç soruları <b>iki adımda</b> çözülür:<br><b>1. Anlam:</b> İki cümle arasındaki ilişki ne? Zıtlık mı, sebep mi, sonuç mu, amaç mı?<br><b>2. Yapı:</b> Bağlaçtan sonra ne geliyor? Tam cümle mi, isim mi, -ing mi? Noktalı virgül var mı?')}

const V2_GERUND={id:'gerund',grp:'yds',v2:true,t:'Fiilimsiler: -ing ve to V1',en:'Gerunds & Infinitives',s:'Hangi fiil -ing, hangisi to V1 alır? Edat + -ing, "to" edat olan kalıplar, anlamı değişen fiiller',
body:`
<h3>Önce büyük resim</h3>
${TALK('Bir cümlede iki fiil art arda gelince ikinci fiil çekimsiz bir hale girer: ya <b>-ing</b> (gerund) ya da <b>to + V1</b> (infinitive). Türkçede bunu "<b>-mek, -meyi, -mesi</b>" ekleriyle yaparız:<br><i>Sigara içmeyi <b>bıraktı</b>. → He stopped <b>smoking</b>.</i><br><i>Gitmeye <b>karar verdi</b>. → He decided <b>to go</b>.</i><br><br>Hangisinin geleceğini <b>birinci fiil</b> belirler ve bunun mantıklı bir kuralı pek yoktur; ezberlemek gerekir. Ama iyi haber: YDS hep aynı 40-50 fiili sorar. Bu derste onları gruplar halinde vereceğim.')}

<h3>1. -ing ne zaman gelir? Üç durum</h3>
${FORM('',['Durum','Örnek','Türkçesi'],[
['<b>a)</b> Bazı fiillerden sonra','Many people <u>avoid going</u> to the doctor.','Pek çok insan doktora gitmekten kaçınır.'],
['<b>b)</b> Her edattan sonra','She left <u>without saying</u> goodbye.','Veda etmeden ayrıldı.'],
['<b>c)</b> Cümlenin öznesi olarak','<u>Smoking</u> is harmful.','Sigara içmek zararlıdır.']])}

<h3>2. Arkasından -ing alan fiiller</h3>
${TALK('Bu listeyi gruplar halinde ezberle. Hafıza ipucu: Bu fiillerin çoğu "zaten var olan ya da yaşanan bir eylem" hakkındadır (kaçınmak, keyif almak, inkâr etmek, bitirmek).')}
${FORM('-ing alan fiiller',['Grup','Fiiller','Örnek'],[
['Kaçınma / erteleme','<b>avoid, postpone, delay, put off, resist, escape</b>','They <u>postponed making</u> a decision.'],
['Sevme / sevmeme','<b>enjoy, can\'t stand, can\'t help, mind, dislike, fancy</b>','I <u>don\'t mind waiting</u>.'],
['Kabul / inkâr','<b>admit, deny, confess, mention, report</b>','He <u>denied stealing</u> the money.'],
['Düşünme / önerme','<b>consider, suggest, recommend, imagine, anticipate</b>','Doctors <u>recommend drinking</u> more water.'],
['Bitirme / sürdürme','<b>finish, quit, give up, stop, keep (on), carry on, go on</b>','She <u>gave up smoking</u>.'],
['Diğer','<b>involve, risk, practise, miss, justify, tolerate, appreciate, mean</b> (gerektirmek)','The job <u>involves travelling</u> abroad.']])}
${WR('He suggested to go to the cinema.','He suggested <b>going</b> to the cinema.','')}
${WR('Would you mind to close the window?','Would you mind <b>closing</b> the window?','')}

<h3>3. Arkasından to + V1 alan fiiller</h3>
${TALK('Hafıza ipucu: Bu fiillerin çoğu "henüz olmamış, <b>gelecekteki</b> bir eylem" hakkındadır (karar vermek, planlamak, ummak, söz vermek). "to" bir hedefe doğru gitmek gibi düşün.')}
${FORM('to V1 alan fiiller',['Grup','Fiiller','Örnek'],[
['Karar / plan / niyet','<b>decide, plan, intend, aim, mean</b> (niyet), <b>choose, prepare, arrange</b>','The government <u>plans to build</u> a new airport.'],
['İstek / umut / beklenti','<b>want, wish, hope, expect, would like, need</b>','We <u>hope to see</u> you soon.'],
['Söz / kabul / ret','<b>promise, agree, refuse, offer, threaten</b>','He <u>refused to answer</u>.'],
['Deneme / başarma','<b>try, attempt, manage, fail, struggle</b>','The company <u>failed to meet</u> its targets.'],
['Görünme / eğilim','<b>seem, appear, tend, happen, prove</b>','Prices <u>tend to rise</u> in winter.'],
['Diğer','<b>afford, learn, pretend, deserve, hesitate, claim</b>','Few families <u>can afford to buy</u> a house.']])}
${FORM('Sıfat + to V1',['Kalıp','Örnek'],[
['be able / unable to','Scientists <u>were unable to find</u> a cure.'],
['be likely / unlikely to','Prices <u>are likely to rise</u>.'],
['be willing / reluctant to','Many patients <u>are reluctant to talk</u> about it.'],
['be eager / keen to','She <u>is eager to start</u>.'],
['be the first / last / only to','He <u>was the first to arrive</u>.'],
['It is + sıfat + to','<u>It is important to sleep</u> well.']])}
${WR('The company failed meeting its targets.','The company failed <b>to meet</b> its targets.','')}

<h3>4. Fiil + nesne + to V1</h3>
${TALK('Bazı fiiller önce bir <b>kişi</b> (nesne), sonra <b>to V1</b> alır: "birinin bir şey yapmasını …".')}
${FORM('',['Fiiller','Örnek','Türkçesi'],[
['allow, permit, enable','Technology <u>enables</u> people <u>to work</u> from home.','Teknoloji insanların evden çalışmasını sağlar.'],
['encourage, persuade, convince, motivate','Teachers <u>encourage</u> students <u>to read</u>.','Öğretmenler öğrencileri okumaya teşvik eder.'],
['force, oblige, require, compel','The law <u>requires</u> employers <u>to pay</u> a minimum wage.','Yasa işverenlerin asgari ücret ödemesini şart koşar.'],
['cause, lead','Stress can <u>cause</u> people <u>to lose</u> sleep.','Stres insanların uykusuz kalmasına yol açabilir.'],
['ask, tell, advise, warn, remind, urge, invite','The doctor <u>advised</u> him <u>to rest</u>.','Doktor ona dinlenmesini tavsiye etti.'],
['want, expect, would like','I <u>want</u> you <u>to come</u>.','Gelmeni istiyorum.']])}
${TRAP('<b>make / let / have</b> + nesne + <b>V1</b> (to YOK): <i>The teacher <u>made</u> us <u>repeat</u> it.</i> Ama edilgende to geri gelir: <i>We <u>were made to repeat</u> it.</i>')}
${TRAP('<b>suggest</b> ve <b>recommend</b> nesne + to V1 almaz: <i>He suggested <s>me to go</s></i> ✘ → <i>He suggested <u>going</u></i> / <i>He suggested <u>that I go</u></i> ✔.')}

<h3>5. Edattan sonra HER ZAMAN -ing</h3>
${TALK('Kural basit: in, on, at, of, for, about, by, without, before, after, instead of, despite gibi <b>her edattan</b> sonra fiil gelecekse <b>-ing</b> olur.')}
${FORM('',['Kalıp','Örnek','Türkçesi'],[
['by + -ing','You can improve your English <u>by reading</u>.','İngilizceni okuyarak geliştirebilirsin.'],
['without + -ing','He left <u>without saying</u> goodbye.','Veda etmeden ayrıldı.'],
['instead of + -ing','Walk <u>instead of taking</u> the bus.','Otobüse binmek yerine yürü.'],
['before / after + -ing','Wash your hands <u>before eating</u>.','Yemekten önce ellerini yıka.'],
['be good / interested / afraid + -ing','She is good <u>at solving</u> problems.','Problem çözmekte iyidir.'],
['be responsible / famous for + -ing','He is responsible <u>for managing</u> the team.','Ekibi yönetmekten sorumlu.'],
['think / talk / worry about + -ing','They are thinking <u>about moving</u>.','Taşınmayı düşünüyorlar.'],
['succeed in / insist on / depend on + -ing','He succeeded <u>in passing</u> the exam.','Sınavı geçmeyi başardı.'],
['prevent / stop sb from + -ing','Rain prevented us <u>from leaving</u>.','Yağmur ayrılmamızı engelledi.']])}

<h3>6. Tuzak: "to" bir EDAT olduğunda</h3>
${TALK('Bu YDS\'nin en sevdiği tuzaklardan biri. Bazı kalıplarda "<b>to</b>" mastar işareti değil, bir <b>edattır</b> ("-e, -a" anlamında). Edat olduğu için arkasından <b>-ing</b> gelir.<br><br><i>I look forward <b>to</b> see you.</i> ✘ → <i>I look forward <b>to seeing</b> you.</i> ✔')}
${FORM('"to" edat olan kalıplar (+ -ing)',['Kalıp','Anlam','Örnek'],[
['look forward to','dört gözle beklemek','We look forward to <u>hearing</u> from you.'],
['be / get used to','alışkın olmak / alışmak','I\'m used to <u>getting</u> up early.'],
['be accustomed to','alışkın olmak','Farmers are accustomed to <u>working</u> hard.'],
['object to','itiraz etmek','They objected to <u>paying</u> more.'],
['be committed / dedicated to','kendini adamak','The company is committed to <u>reducing</u> waste.'],
['contribute to','katkıda bulunmak','Exercise contributes to <u>preventing</u> disease.'],
['lead to','yol açmak','Stress can lead to <u>losing</u> sleep.'],
['be devoted to','kendini adamak','She is devoted to <u>helping</u> the poor.'],
['when it comes to','söz konusu … olduğunda','When it comes to <u>cooking</u>, he is the best.'],
['with a view to','… amacıyla','He saved money with a view to <u>buying</u> a house.'],
['in addition to','-e ek olarak','In addition to <u>teaching</u>, she writes books.'],
['be opposed to','karşı olmak','Many are opposed to <u>building</u> the dam.']])}
${TIP('Nasıl anlarım? "to"dan sonra bir <b>isim</b> koyabiliyorsan o "to" edattır: <i>I look forward to <u>the holiday</u></i> ✔ → o halde fiil gelirse -ing olur. <i>I decided to <u>the holiday</u></i> ✘ → bu "to" mastardır.')}

<h3>7. İkisini de alan ama anlamı değişen fiiller</h3>
${TALK('Bazı fiiller hem -ing hem to V1 alır ama anlam <b>tamamen değişir</b>. Genel mantık: <b>-ing geçmişe</b> (zaten yapılmış), <b>to V1 geleceğe</b> (yapılacak) bakar.')}
${FORM('Anlam değiştiren fiiller',['Fiil','+ -ing','+ to V1'],[
['<b>remember</b>','yaptığını hatırlamak (geçmiş)<br><i>I remember <u>locking</u> the door.</i><br>Kapıyı kilitlediğimi hatırlıyorum.','yapmayı unutmamak (gelecek)<br><i>Remember <u>to lock</u> the door.</i><br>Kapıyı kilitlemeyi unutma.'],
['<b>forget</b>','yaptığını unutmak<br><i>I\'ll never forget <u>seeing</u> the sea for the first time.</i>','yapmayı unutmak<br><i>He forgot <u>to call</u> his mother.</i>'],
['<b>stop</b>','bir işi bırakmak<br><i>He stopped <u>smoking</u>.</i><br>Sigarayı bıraktı.','bir şey yapmak için durmak<br><i>He stopped <u>to smoke</u>.</i><br>Sigara içmek için durdu.'],
